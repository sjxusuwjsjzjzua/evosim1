name: evosim experiment

# Runs headless.js on GitHub-hosted runners instead of the Claude Code
# session's own sandbox. Point of this: each seed gets its own dedicated
# runner (real parallelism, not N processes sharing 4 cores), it runs
# whether or not any Claude session is open, and it costs zero tokens and
# zero sandbox CPU. Trigger by hand (Actions tab -> evosim experiment ->
# Run workflow) or via the API/MCP (actions_run_trigger, method
# run_workflow) once this file is on the default branch — GitHub only
# recognizes workflow_dispatch inputs for workflows present there.
#
# Does not touch evosim-v0_49_0.html and does not ship anything by itself:
# it writes a JSON log per seed, same shape exportLog() writes on the phone.
# Someone (owner or Claude) still reads the digest and decides what happens
# next.
#
# Results land two ways: as a downloadable artifact (for a human via the
# Actions UI) AND pushed to a per-seed scratch branch runs/<label>/seed-<seed>
# (for Claude to fetch via plain git, since artifacts live on Azure blob
# storage, which the Claude Code sandbox's egress policy blocks -- confirmed
# the hard way after a batch of results were stuck undownloadable). Each
# matrix job gets its own branch name so parallel seeds can never conflict
# pushing. These branches are scratch, same convention as the gitignored
# local runs/ directory -- safe to delete once a result's been promoted into
# the repo proper.
#
# No trailing digest job on purpose (removed 2026-08-10, external audit
# finding). analyze.py is trivial local compute and Claude fetches per-seed
# results directly via `git fetch origin runs/<label>/seed-<seed>` anyway --
# a digest job here only ever added a job that queues behind the ceiling
# like everything else, which made a run's top-level "completed" status lag
# its actual results indefinitely once the account was near its concurrency
# cap. Read the digest by running analyze.py yourself once the sim jobs
# below are done, not by waiting on this workflow to say "completed".

on:
  # SELF-FIRING STANDING BATCH. Added 2026-08-10 after Actions sat idle for
  # 11 hours overnight (05:38 -> 16:44). Root cause: the hourly heartbeat
  # Routine's allowed_tools has no mcp__github__*, and the ambient
  # GITHUB_TOKEN has Actions READ but not actions:write -- so a heartbeat can
  # check and collect results but physically cannot dispatch a run. GitHub's
  # own scheduler needs no credentials from this side, so it is the only
  # mechanism that keeps compute fed when no interactive turn is happening.
  # SIZED FROM MEASUREMENT, not guessed. A successful 800-day sim job runs
  # median 0.51 h (mean 0.80, p90 1.90); a 1600-day job is ~1.1 h. The
  # account's real concurrency ceiling is 20 simultaneous JOBS -- observed
  # directly as 20 running / 9 queued, which matches the documented per-plan
  # cap and corrects the "40-50" figure previously recorded in LEDGER.
  # The repo is PUBLIC, so Actions minutes are unlimited and free -- there is
  # no quota to conserve, only the concurrency cap and account-safety.
  #   Sized from OBSERVED throughput via Little's Law, not from an estimate:
  #   12 jobs/h produced 13 concurrent, so mean service time W = 13/12 =
  #   1.08 h. Service capacity at the 20-job cap is 20/1.08 = 18.5 jobs/h.
  #   18 jobs/h => ~19.5 of 20 slots busy continuously, with arrival just
  #   under capacity so the queue stays bounded rather than growing without
  #   limit. Going to 20/h would exceed capacity (21.7 > 20) and pile up an
  #   unbounded backlog for no extra throughput.
  # An earlier version of this block fired 6 jobs every 6 h, which works out
  # to 1.1 of 20 slots -- about 5% utilisation. That was badly
 # under-provisioned and is what left Actions near-idle.
  # THREE ticks per hour, 6 seeds each, rather than one tick of 18.
  # GitHub's scheduler is best-effort and sheds load: observed 2026-08-10
  # that the :37 cron fired at 1:09, 2:20, 3:08, 4:07 and 5:02 PM PDT and
  # then DROPPED the 5:37 and 6:37 ticks entirely, leaving Actions at 13/20
  # with an empty queue. Overlap is NOT the cause -- the 4:07 run fired
  # while the 3:08 run was still in progress -- so this is plain tick
  # loss, which no workflow-side change can prevent.
  # Mitigation was meant to be graceful degradation: spreading the same 18
  # jobs/h across three independent ticks so a dropped tick costs 6 jobs
  # rather than all 18. **That reasoning was wrong and is retracted.**
  # Measured one hour after it shipped: between 02:35 and 03:35 UTC on
  # 2026-08-11, ALL THREE ticks (:47, :07, :27) dropped -- not one, all of
  # them -- leaving Actions at 11/20 with an empty queue. Drops are
  # CORRELATED, not independent, so splitting a tick three ways buys
  # nothing; it just makes each surviving tick smaller. The three crons are
  # kept (they cost nothing and occasionally one does land) but the real
  # defence is making a single surviving tick large enough to matter.
  #
  # ARITHMETIC CORRECTION, 2026-08-11. The previous version of this comment
  # set seeds/tick to 12 and claimed "36 jobs/h against ~20 job/h service
  # capacity ... builds a BOUNDED queue". That is simply wrong: when arrival
  # EXCEEDS service the queue grows without limit, by definition. Measured an
  # hour later: 20 running, **29 queued and climbing**, with a dispatched
  # priority experiment (the v0.52 emergence test) stuck behind it.
  # A queue is only a buffer when arrival is BELOW capacity.
  #
  # Sized properly now. Service capacity ~18 jobs/h at the 20-slot cap.
  # Standing batch takes 4 seeds x 3 ticks = 12 jobs/h, deliberately leaving
  # ~6 jobs/h of HEADROOM so a dispatched experiment starts within minutes
  # instead of waiting out a backlog of screening seeds. Screening is the
  # thing that should yield to a hypothesis under test, not the reverse.
  # RATE CUT, 2026-08-23. Measured 110 runs QUEUED (~440 jobs) against a
  # 20-slot cap: arrival had been sitting at capacity, so the backlog never
  # drained and v0.53 work dispatched 23 h earlier had not started a single
  # job. A queue only buffers when arrival is BELOW service -- the same
  # arithmetic error as 2026-08-11, made again by leaving three ticks running
  # after cutting seeds/tick.
  # One tick per hour x 4 seeds = 4 jobs/h against ~18/h capacity. The backlog
  # clears in ~30 h and everything after that starts promptly. 4 jobs/h is
  # still ~670 seeds a week, far more than any arm needs.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      build:
        description: 'Build file to run'
        default: 'evosim-v0_49_0.html'
        required: true
      seeds:
        description: 'Comma-separated seeds, e.g. 4001,4002,4003 (blank on a schedule => derived from run_number)'
        required: false
      days:
        description: 'Target sim-days per seed'
        default: '1600'
        required: true
      cfg:
        description: 'Path to a CFG patch JSON in the repo (optional)'
        required: false
      label:
        description: 'Run label, used in artifact names'
        default: 'run'
        required: true
      progress_days:
        description: 'How often (sim-days) to write progress'
        default: '20'
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      seed_matrix: ${{ steps.parse.outputs.matrix }}
      cell_matrix: ${{ steps.parse.outputs.cells }}
    steps:
      - id: parse
        run: |
          seeds='${{ inputs.seeds }}'
          # Scheduled firings supply no inputs at all. Derive 6 fresh cold
          # seeds from the run number so a standing batch never repeats a
          # seed it has already burned.
          # PAIRED DESIGN, 2026-09-12. The matrix used to be four seeds inside
          # ONE cell chosen by run_number % 4, which confounded the cell with
          # the dispatch block perfectly -- and dispatch block moves the
          # headline metric under no treatment at all. Now one seed per firing
          # goes through ALL FOUR cells. founderGenesA shifts the gene after
          # the founder RNG draws and takes no draw itself, so at a given seed
          # every cell founds the identical world apart from the shifted gene.
          # That removes between-seed variance from the comparison entirely.
          if [ -z "$seeds" ]; then
            seeds=$(( 40000 + ${{ github.run_number }} * 20 ))
            echo "scheduled firing: paired seed $seeds across all four cells"
          fi
          json=$(python3 -c "import json,sys; print(json.dumps([s.strip() for s in '$seeds'.split(',') if s.strip()]))")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "cells=[0,1,2,3]" >> "$GITHUB_OUTPUT"

  run:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # needed to push the per-seed results branch below
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJson(needs.setup.outputs.seed_matrix) }}
        cell: ${{ fromJson(needs.setup.outputs.cell_matrix) }}
    steps:
      # A `schedule:` trigger ONLY ever fires from the default branch, but
      # main deliberately holds just the shipped v0.49 build and no
      # cfg-patches/ -- so a scheduled run checking out main would fail
 # instantly on a missing build, the way the 2026-08-10 16:44
      # batch did. Pin scheduled runs to the working branch, which carries
      # the current build and the patches. Manual dispatches keep using
      # whatever ref they were fired against.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'claude/evolution-sim-v047-audit-jft25c' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: run headless.js
        run: |
          mkdir -p out
          CFG_ARGS=""
          CFG_IN="${{ inputs.cfg }}"
          BUILD_IN="${{ inputs.build }}"
          DAYS_IN="${{ inputs.days }}"
          PROG_IN="${{ inputs.progress_days }}"
          # Scheduled firings pass no inputs; fall back to the current
          # protocol defaults so a standing batch is a valid replicate.
          if [ -z "$CFG_IN" ]; then
            # Rotate arms by run_number so the standing batch accumulates
            # matched cold-seed replicates of the WHOLE dose series rather
            # than deepening one arm forever.
            #
            # Widened 2026-08-10 from a 2-way (3x/5x) to a 4-way rotation.
            # Reason: a collect-and-count of all 82 standing-batch seeds that
            # had landed showed every single one sitting at k_photoCost 0.012
            # or 0.02 -- there was NO run at the shipped default dose
            # anywhere in the batch, and none at shipped defaults at all. So
            # the 3x-vs-5x difference (67% vs 37% alive at day 800 on n=54
            # complete blocks) had nothing to be a difference *from*, and no
            # data described the build as it actually ships. Arms 0 and 3
            # close both gaps:
            #   0  1x-arena  -- dose control: same arena caps as 3x/5x, only
            #                   k_photoCost differs, so 0.004/0.012/0.02 is a
            #                   clean one-variable series.
            #   3  (no cfg)  -- the shipped build at its own defaults, caps
            #                   included. Not part of the dose series (its
            #                   caps differ too); it answers the separate and
            #                   more basic question of what the app does when
            #                   someone just opens it.
            # FULL-ARENA ROTATION, 2026-08-11. The previous rotation had three
            # of its four arms at maxPlants 25000, which adversarial audit F2
            # showed BINDS in 54% of 3x runs -- so those arms were a maxPlants
            # comparison wearing a k_photoCost label, and every seed they
            # produced was confounded by design. All arms now run at the
            # shipped 90k/40k arena, where the slot cap does not bind.
            # FIVE-WAY, 2026-08-11. Arms 3 and 4 are the selection-response
            # diagnostic [L66]. They were being run locally, but six container
            # restarts in seven hours killed every attempt before day 400 of a
            # 1600-day target -- local cannot finish them, and a heartbeat
            # cannot dispatch. Folding them into the standing rotation is the
            # only mechanism that runs them unattended.
            # Nothing is abandoned to make room: the full-arena dose series
            # (arms 0-2) keeps its frozen prediction and just fills slower,
            # ~2.4 jobs/h per arm instead of 4.
            # WEIGHTED 6-WAY, 2026-08-11. The first noseason seed retained
            # 166.8% of its neutral variance against a corpus median of 28.9%
            # and moved 33 functional genes past drift against a median of 7 --
            # both [L66] HIT criteria, at n=1. That is the head of the queue
            # and deserves the throughput; the dose series is the lower-priority
            # question and keeps a slot rather than being dropped.
            # Diagnostic arms take 4 of 6 slots so n=6 per arm arrives in ~4h
            # instead of ~10.
            # H14 ROTATION, 2026-09-12 -- mvtLeave dose series. The 2x2 it
            # replaces was testing founder values of carrionAttraction while
            # build line 1916 discards the scan that reads them: an animal
            # already grazing an adequate plant returns before bestAct is
            # assigned, dropping SCAVENGE, ATTACK, APPROACH and FLEE. A founder
            # value cannot matter when the decision it feeds is thrown away, so
            # that 2x2 was close to void.
            # One seed at mvtLeave 5.0 moved heterotrophy 0.447 to 3.280 percent,
            # the first movement in the mission metric not bought by raising a
            # food-value constant, at a cost of 94 animals down to 31.
            # PREVIOUS 2x2 FACTORIAL, 2026-09-11, after a program
            # audit returned a PIVOT verdict. The rotation is no longer four
            # unrelated arms; it is {carrionAttraction founder 0.80 vs 0.10} x
            # {k_meatAttrFloor 0.5 vs 0}, so both main effects and the
            # interaction are estimable from the same seeds.
            # WHY: ACT_ATTACK transfers ZERO energy (build :1985-2009). Every
            # calorie of meat flows through ACT_SCAVENGE, gated by
            # carrionAttraction -- which had ZERO runs, zero hypotheses, and was
            # not CFG-reachable. Three of five structural versions targeted
            # meatAttraction, the gate on an act that feeds nobody. Meanwhile
            # carrionAttraction founded at 0.10 against plantAttraction 0.80,
            # which under k_choiceBeta=4 is 4096:1 against ever tasting meat
            # before any biology runs, and 67.5% of corpse mass rots uneaten.
            # The mission metric (eCarrion/(ePlant+eCarrion)) sat at 0.302%
            # median across 1,502 survivors, flat through five versions.
            # PREVIOUS (v0.55) ROTATION, 2026-09-08. H4/H5/H6/H7 all MISSED and are
            # retired. H4: the Luce arbiter did not make the attraction genes
            # selectable (plantAttraction +0.07 SD vs a 0.059 SD drift
            # yardstick) -- the gradient exists now but ATTACK is 0.8% of the
            # action budget, so the act it governs is too small to matter.
            # H5: GRAZE 96.33%, monoculture intact. H6: carnivory 0.070, but
            # the arm survived 92.2% vs control 66.7% (p=0.0022) WITHOUT a diet
            # shift -- the week's real finding, now up for replication as H10.
            # H7: predation share 24.5% with the floor off, unchanged from
            # v0.53 -- carnivory is still not emergent after three structural
            # attempts. New arms stop guessing at mechanisms: H8 asks by
            # invasion probe whether a carnivore peak exists at all, H9 asks
            # whether k_mixed's concave frontier is the barrier.
            # PREVIOUS (v0.54) ROTATION, 2026-08-29. H1/H2/H3 are SCORED and retired:
            # H1 FORCED (seasonless ACF 0.00 vs control 0.56 at period 40d =
            # daysPerYear exactly -- the cycles were the calendar, not ecology),
            # H2 MISS (halfseason cv 43.2% but survival 71.2% vs control 71.4%),
            # H3 MISS (flooroff meatAttraction 0.087, predation share 25%).
            # The joint diagnosis: all four attraction genes sit at DRIFT
            # because the arbiter was a hard argmax, so v0.54 replaces it with
            # a Luce choice rule and the four new arms test that.
            # PREVIOUS (v0.53) ROTATION, 2026-08-22. [L66]'s arms are retired: the
            # seasonAmp=0 arm was never seasonless (seasonAmp gates light only,
            # W.seaSin drove plant phenology regardless -- 40d ACF 0.838 vs the
            # control's 0.831 across 340 runs), and the valid daysPerYear=120
            # arm showed no effect on survival or selection response at n=339.
            # Replaced by the three v0.53 pre-registrations, each against the
            # matched v0.53 default control which takes 1 of 4 slots.
            case ${{ matrix.cell }} in
              0) CFG_IN="cfg-patches/mvt-0.json" ;;                  # guard always fires
              1) CFG_IN="" ;;                                        # mvtLeave 1.0, shipped
              2) CFG_IN="cfg-patches/mvt-2.5.json" ;;                # guard fires less
              3) CFG_IN="cfg-patches/mvt-5.0.json" ;;                # guard rarely fires
            esac
          fi
          [ -z "$BUILD_IN" ] && BUILD_IN="evosim-v0_56_0.html"
          [ -z "$DAYS_IN" ]  && DAYS_IN="1600"
          [ -z "$PROG_IN" ]  && PROG_IN="40"
          if [ -n "$CFG_IN" ]; then CFG_ARGS="--cfg $CFG_IN"; fi
          # --max-wall-min sits under the job's own 350-min timeout (line above:
          # timeout-minutes: 350) with margin for checkout/setup/upload. GitHub
          # hosted runners cap a job at 6 h, so 350/330 is near the ceiling.
          # Raised from 180/165 on 2026-08-10: the default target went 800 ->
          # 1600 days because an 800-day run cannot exclude the founding
          # transient (its R0 window is its whole history -- see LEDGER.md
          # [L61b]), and 1600 days leaves a clean 1000-day post-establishment
          # window. Without
          # this, a run whose population survives to the timeout produces
          # nothing at all -- headless.js only writes output once, at the end,
          # so a hard-killed job returns zero data for the ~3 hours it ran.
          # Learned this the expensive way; see LEDGER.md.
          node headless.js \
            --build "$BUILD_IN" \
            --seed "${{ matrix.seed }}" \
            --days "$DAYS_IN" \
            --progress-days "$PROG_IN" \
            --max-wall-min 330 \
            $CFG_ARGS \
            --out "out/seed-${{ matrix.seed }}c${{ matrix.cell }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.label || 'standing' }}-c${{ matrix.cell }}-seed-${{ matrix.seed }}
          path: out/
          retention-days: 30
      - name: push result to a per-seed scratch branch
        run: |
          BR="runs/${{ inputs.label || 'standing' }}/seed-${{ matrix.seed }}c${{ matrix.cell }}"
          git config user.name "evosim-actions-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan "$BR"
          git rm -rf --quiet . || true
          cp "out/seed-${{ matrix.seed }}c${{ matrix.cell }}.json" .
          [ -f "out/seed-${{ matrix.seed }}c${{ matrix.cell }}.json.progress.json" ] && cp "out/seed-${{ matrix.seed }}c${{ matrix.cell }}.json.progress.json" . || true
          git add "seed-${{ matrix.seed }}c${{ matrix.cell }}.json" "seed-${{ matrix.seed }}c${{ matrix.cell }}.json.progress.json" 2>/dev/null || git add "seed-${{ matrix.seed }}c${{ matrix.cell }}.json"
          git commit -m "evosim experiment: ${{ inputs.label || 'standing' }} seed ${{ matrix.seed }}"
          git push --force origin "$BR"
