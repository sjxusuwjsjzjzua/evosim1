<!--
  EVOLUTION SIMULATOR — single self-contained HTML file, canvas 2D, no build step
  version 0.49.0  ·  2026-08-09  ·  formatVersion 36

  Version history, per-gene accounting and rationale are all in LEDGER.md,
  indexed by the [Lnn] tags below (CHANGELOG.md/GENE-LEDGER.md/DESIGN.md/
  STATE.md were consolidated into LEDGER.md and HANDOFF.md at v0.37 and no
  longer exist — a few stray "design N.N" comments predate that and are dead
  references now, not a live spec). Current state and open questions:
  HANDOFF.md.

  INVARIANTS. Every one of these was learned by breaking it, most of them twice.

   1. MATTER IS A CLOSED STOCK, ENERGY IS AN OPEN FLOW. Capping a field is a
      sink. float32 is a sink — soil, detritus and scratch are f64.
   2. A CLOSED MATTER LEDGER DOES NOT PROVE A CLOSED ENERGY LEDGER. Germination
      and animal birth both minted free tissue for dozens of versions while
      matter closed perfectly. Charge energyPerMass at every site that makes
      mass.
   3. COST MUST CURVE UP FASTER THAN BENEFIT, or the gene pins to a bound and
      its tradeoff is fictional. Prefer a saturating form to a clamp: a clamp
      leaves a linear ramp below it and dead flat ground above.
   4. EVERY UPKEEP TERM SCALES WITH mass^0.75. A flat term is a tax that kills
      juveniles.
   5. RESERVES ARE DENOMINATED IN UPKEEP-DAYS, NOT ENERGY OR MASS. Missed in
      both kingdoms, and again in offspringInvestment as late as v0.32.
   6. CHECK ACHIEVABLE RANGES, NOT JUST FORMULA SHAPES. A correct mechanism at
      the wrong scale does nothing: reach vs height, seed dormancy, rootDepth,
      k_heightMass — twice.
   6b. RUNNING THE SIM COSTS COMPUTE, NOT TOKENS, SINCE v0.47's HEADLESS
       TOOLING — this invariant used to forbid it outright on cost grounds;
       that stopped being true. What still holds: a short run answers a
       different question than a long one, so end-state counts across
       different lengths are never comparable, and every run that tests a
       biology hypothesis needs a written, falsifiable prediction on record
       BEFORE it starts — free compute makes fishing for a result easier to
       fall into, not harder. Profiling for a PERFORMANCE change needs
       neither prediction nor approval — measure a fixed sim-day count, not
       a tail, and a resulting code change gets its own prediction (moves
       speed only) same as anything else.
   7. NEVER CALIBRATE A CONSTANT AGAINST A STATISTIC MEASURED IN A BROKEN RUN.
      k_reach 0.060 came from a mean height measured in a collapsed flora.
   8. WHATEVER CAPS THE POPULATION IS WHAT DOES THE SELECTING. Slot pools are a
      balance parameter, not a memory setting.
   9. COMPETITION MUST BE ASYMMETRIC or no organism size is preferred. Height is
      earned with mass; reach is linear in size.
  10. NEVER MULTIPLY TWO GATE GENES in a behaviour score.
  11. NOTHING ABOUT TROPHIC ROLES IS HARDCODED. No predator flag, no herbivore
      class. Roles emerge from digestion genes and energy costs.
  12. THE SYSTEM IS CHAOTIC. A single-seed A/B once gave identical plant counts
      and 4x the animals. Believe nothing that does not repeat across seeds.
  13. GENE COUNT AND ORDER ARE FROZEN: plant 39 active + 9 padding = 48,
      animal 54 active + 10 padding = 64. ACTIVE count and order are what is
      frozen; padding was cut in v0.46 purely for cache locality and touches
      no saved data (pools store P_ACTIVE/A_ACTIVE-length rows, world saves
      store terrain only). Changing the ACTIVE count or order invalidates every
      save and fossil record and must be flagged loudly. Add at the first
      padding index.
  14. A SYNTAX CHECK IS NOT A CORRECTNESS CHECK and a call check is not an
      identifier check. Run check.js after every edit.
  15. GROWTH MUST NOT OUTBID BREEDING. Any allocation gate that fires at a lower
      energy than reproduction takes the whole surplus, because growth absorbs
      ~6 energy/tick against a surplus of ~0.03. v0.35 gated growth at cap*0.5
      and breeding at matingThreshold*cap (0.60) and the fauna simply never bred
      — mass/size stuck at 0.53-0.75, lifetime output 0.33-1.00, R0 < 1.
  17. EVERY ACTION SCORE IS EXPECTED ENERGY PER TICK. GRAZE, ATTACK, SCAVENGE,
      FLEE and APPROACH are all gain/(travel + handling). Behaviour genes are
      WEIGHTS on that quantity, never the quantity. A score in any other unit
      makes the modeller, not selection, decide what animals do — and if the
      unit carries a body-mass term the balance drifts as size evolves.
  18. A BEHAVIOUR GENE WITH NO BENEFIT TERM ANYWHERE IN THE MODEL CANNOT
      EVOLVE, ONLY BE PURGED. Check for the mechanism before tuning the
      weight. socialAttraction had none for eleven versions.
  19. A THRESHOLD GATE ON A DRIFTING GENE IS ABSORBING. `if (gene > 0.02)`
      around the only code that can select for it means one drift below the
      line is permanent.
  16. A CLAMPED GENE RANGE IS A SELECTION PRESSURE. mutateAnimal clamps, so a
      drifting gene walks to the MIDDLE of its declared range, not to its
      founder. Any range set wide "to be safe" and asymmetric about the founder
      will drag that gene whenever Ne is small. size .2-40 pulled toward 20.1.
      Check the midpoint of every range you widen.

  v0.49.0: performance/mechanical only, no ecological claim intended — the
  five hottest per-tick loops (rebuildCanopy, buildPlantIndex,
  buildAnimalIndex, updatePlants, updateAnimals) scanned 0..P.hi/AN.hi, a
  high-water mark that only ever grows, so a world that blooms once paid that
  cost for the rest of the run even after crashing back down. They now scan
  P.occIdx/AN.occIdx, compact lists of currently-occupied slots maintained
  incrementally on every birth/death, so cost tracks live population instead
  of a past peak [L0.49-1]. No organism's slot index changes, only some
  loops' visitation order does — verified NOT RNG-exact (order-sensitive
  detection scans and stagger-phase reassignment shift the draw sequence) but
  matter-conservation-exact and directionally unbiased across seeds.
  Rationale and full verification in LEDGER.md.

  v0.48.0: performance/mechanical only, no ecological claim either change —
  extinction halt actually fires now, was gated on a condition that was
  always false at default config [L0.48-1]; CFG/W/P/AN aliased to locals in the
  two hottest functions found by profiling, cutting repeated global-scope
  lookups [L0.48-2]. Rationale and verification in LEDGER.md.

  v0.47.0: arbiter put in one currency [L47-2]; confusion effect + AN.risk so
  grouping has a payoff [L47-3]; toxin model unified between perception and
  payoff [L47-1]; slot compaction and high-water trim [L47-4]; memcpy+geometric
  mutation [L47-5]; render throttle, tile-culled draw, precomputed cover, P.h
  cache [L47-6]. Rationale in LEDGER.md.

  v0.35.0: provisional lineage clusters (a cluster earns a name only after
  holding minPop for lineageConfirm passes — the tree was recording phantoms);
  new pLocked column (refuge measured by BIOMASS, not plant count) and
  aDeadSen; header history moved to CHANGELOG.md. v0.34.0's carrion changes are
  untouched and still unrun.
-->

<head>

<style>

    background:rgba(10,15,19,.90);border-bottom:1px solid var(--hair);

  #hbDate{display:flex;align-items:center;gap:7px;font:12.5px/1 ui-monospace,monospace;

  .sec:first-of-type{margin-top:6px}
  .sec em{font-style:normal;color:var(--dim);letter-spacing:.08em}
  .row{display:flex;align-items:center;gap:10px;margin:7px 0}
  .row label{flex:0 0 40%;color:#8a99a1;font-size:11px}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--leaf);height:24px}
  .row .val{flex:0 0 58px;text-align:right;color:var(--paper);font-size:11px}
  .note{color:var(--dim);margin:14px 0 4px;line-height:1.6;font-size:10.5px}
  #life{position:fixed;left:0;right:0;bottom:0;max-height:80vh;overflow-y:auto;z-index:6;

    padding:6px 12px calc(env(safe-area-inset-bottom) + 14px);border-radius:16px 16px 0 0;
    background:var(--panel);border:1px solid var(--hair2);border-bottom:none;backdrop-filter:blur(14px)}
  #life.open{transform:translateY(0)}
  #lgrip{width:34px;height:4px;border-radius:2px;background:var(--hair2);margin:6px auto 10px}
  .lrow{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;
    border:1px solid transparent;margin:3px 0}
  .lrow.sel{border-color:#3d5c2c;background:rgba(127,194,74,.07)}
  .sw{flex:0 0 10px;height:10px;border-radius:3px}
  .lnm{flex:1 1 auto;font-size:12px;color:var(--paper);min-width:0;overflow:hidden}
  .lpop{flex:0 0 52px;text-align:right;font-size:12px;color:#93a4ab}
  .ltr{flex:0 0 16px;text-align:center;font-size:10px}
  .lst{flex:0 0 96px;text-align:right;font-size:10px;color:var(--dim)}
  .lbar{height:3px;border-radius:2px;background:#1C2A31;margin:0 6px 4px;overflow:hidden}
  .lbar i{display:block;height:100%;border-radius:2px}
  .gene{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:10.5px}
  .gene .gn{flex:0 0 42%;color:#8a99a1}

  .gene .gb{flex:1 1 auto;height:5px;background:#141E24;border-radius:3px;position:relative}

  .gene .gb u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#6FA3C4;border-radius:1px}
  .lempty{color:var(--dim);font-size:11px;padding:10px 4px}
</style>

<script>
'use strict';
//==========================================================================
// 1. CONFIG — everything tunable lives here. EVERY k_ IS A GUESS.
//==========================================================================
// FORMAT_VERSION tracks the SAVE SCHEMA, not the build.  [L01]
const VERSION = '0.51.0', FORMAT_VERSION = 36;

const CFG = {
  // ---- world (rebuild required) ----
  seed: 1337,
  worldSize: 768,      // 23 tiles x 16 units - keep this ratio at 16
  tiles: 48,             // tileArea 256 — leaf beyond this is wasted
  maxPlants: 90000,

  // ---- time ----
  ticksPerDay: 480,
  daysPerYear: 40,
  watchTPS: 30,

  // ---- light ----
  sunPeak: 1.00,
  // --- terrain -------------------------------------------------------
  elevAmp: 1.00,         // scales the whole elevation field
  ridgeSharp: 1.35,      // >1 sharpens ridges into ranges
  germFertMin: 0.08,     // fertility below which a seed simply cannot start
  foothill: 0.68,        // SHARE OF THE MAP that is ordinary lowland
  treeLine: 0.88,        // above this share, nothing germinates (12% of map)
  peakElev: 0.94,        // absolute wall: nothing crosses (top 6% of map)
  altBite: 0.85,         // how hard altitude hits plant growth
  aridAmp: 1.00,         // scales the aridity field
  aridBite: 0.75,        // how hard dryness hits fertility
  k_climbSlow: 0.92,     // speed lost on steep ground by a non-climber
  k_climbReach: 4.0,     // reach x (1 + k_climbReach*climbing) [L43-2]
  k_climbC: 0.010,       // x climbing^2, in the capability group
  lightNoiseAmp: 0.45,
  latitudeBand: 0.25,
  seasonAmp: 0.35,

  // ---- soil ----
  nutrientCap: 12.00,     // INIT ONLY. Field is uncapped at runtime (matter ledger)
  nutrientStart: 6.00,   // per TILE — scales with tile area, not world area
  nutrientNoiseAmp: 0.60,
  diffuseFloor: 0.08,    // minimum share of the diffusion rate on dead ground
  diffuseRate: 0.12,
  diffuseEvery: 8,
  decayRate: 0.004,

  // ---- plant energy ----
  k_photo: 0.100,       // a tile only yields light x area — this sets the ceiling
  k_base: 0.00040,
  k_mass: 0.00075,
  k_leaf: 0.00050,
  k_height: 0.00120,
  k_root: 0.00035,
  k_photoCost: 0.00400,  // x eff^2 x lit-leaf — quadratic, or eff pins to a rail.
                         // WAS 0.01: 4x the leaf term by construction, and
                         // 56-70% of total plant upkeep in every run measured.
                         // At 0.004 it is 31%, and mass / leaf / height /
                         // longevity finally carry real signal
                         // (9/11/5/14% -> 14/20/10/22%). Measured on seed 4535:
                         // harmonic animal N 100 -> 338, attacks 1649 -> 13674,
                         // gain/upkeep 1.37 -> 1.83, aSeen 0.70 -> 1.07.
                         // photoEfficiency did NOT pin (0.487, atMax 0.00), so
                         // the quadratic still holds its interior optimum. [L41-1]
  k_longevity: 8e-9,     // x lifespan x mass^0.75 — kept scale-neutral
  k_shade: 1.50,
  k_shadeCost: 0.45,
  k_shadeGain: 1.50,
  k_uptake: 0.00003,   // see B1: was ~100x oversupplied, rootDepth did nothing
  k_storage: 12.0,
  k_disperse: 0.07,    // now x disp^2, so ancestral 12 costs about the same
  k_seedDecay: 0.00004,  // seeds must outlast a dormancy of up to a year
  germCostMult: 1.00,    // x seedlingMass x energyPerMass, charged to the seed
                         // at germination. 0 restores the old free-tissue bug.
  k_leafPerMass: 3.00,   // leaf area one unit of mass can hold up
  k_heightMass: 40.0,    // mass at which a plant realizes its full genetic height.
                         // WAS 250, which no plant ever reaches: realised mass runs 6-90 and P90 12-115, so sqrt(m/250) stayed at 0.05-0.68 and 97% of every flora sat in...  [L02]
  k_stem: 1.50,          // canopy given up per unit of realized height

  // ---- matter / growth ----
  energyPerMass: 60.0,   // energy to build one unit of mass — sets generation time
  k_regrow: 0.55,        // fraction of build cost waived at regrowthRate 1

// 3. PRNG
//==========================================================================
let rngState = 0, gaussCache = null;
function srand(s){ rngState = s|0; gaussCache = null; }
function rng(){
  rngState = rngState + 0x6D2B79F5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function gauss(){
  if (gaussCache !== null){ const v = gaussCache; gaussCache = null; return v; }
  let u = 0; while (u === 0) u = rng();
  const v = rng(), m = Math.sqrt(-2*Math.log(u));
  gaussCache = m*Math.sin(2*Math.PI*v);
  return m*Math.cos(2*Math.PI*v);
}
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;

function valueNoise(n, base, octaves, persistence){
  const out = new Float32Array(n*n);
  let amp = 1, tot = 0;
  for (let o = 0; o < octaves; o++){
    const g = Math.min(n, base << o);
    const grid = new Float32Array(g*g);
    for (let i = 0; i < g*g; i++) grid[i] = rng();
    for (let ty = 0; ty < n; ty++){
      const fy = ty*g/n, y0 = Math.floor(fy), y1 = (y0+1)%g, sy = fy-y0;
      const wy = sy*sy*(3-2*sy);
      for (let tx = 0; tx < n; tx++){
        const fx = tx*g/n, x0 = Math.floor(fx), x1 = (x0+1)%g, sx = fx-x0;
        const wx = sx*sx*(3-2*sx);
        const a = grid[y0*g+x0], b = grid[y0*g+x1], c = grid[y1*g+x0], d = grid[y1*g+x1];
        const top = a + (b-a)*wx, bot = c + (d-c)*wx;
        out[ty*n+tx] += amp*(top + (bot-top)*wy);
      }
    }
    tot += amp; amp *= persistence;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot;
  return out;
}

  accSum:0, accN:0,                        // realised browse access at the bite
  seenA:0, seenN:0,                        // animal-animal encounters: whether
                                           // predation, herding or kin
                                           // recognition can have ANY signal
  pMature:0, occTiles:0,                   // recruitment, and canopy occupancy

                                           // starved: aDeadAge counts only the hard 3x-lifespan cutoff and read zero across 50 years while 37% of deaths sat in the...  [L14]
  pReseed:0, aReseed:0,                    // life support, so it cannot be read
                                           // as a population that survived
  pDeadEat:0, pDeadStarve:0, pDeadAge:0, pDeadSen:0, aDeadStarve:0, aDeadAge:0,
};

// Steep ground is slow ground unless you can climb it.  [L15]
function rankNormalise(f){
  const n = f.length;
  const idx = new Int32Array(n);
  for (let i = 0; i < n; i++) idx[i] = i;
  const arr = Array.from(idx).sort((a, b) => f[a] - f[b]);
  for (let r = 0; r < n; r++) f[arr[r]] = n > 1 ? r/(n-1) : 0;
}
function terrainDrag(t, climb){
  const e = W.elev[t];
  if (e <= CFG.foothill) return 1;
  const u = (e - CFG.foothill)/(1 - CFG.foothill);
  return Math.max(0.06, 1 - u*(1 - climb)*CFG.k_climbSlow);
}
function passable(t){ return W.elev[t] < CFG.peakElev; }
function tileOf(x, y){
  const n = W.n;
  let tx = (x/W.tileSize)|0, ty = (y/W.tileSize)|0;
  if (tx < 0) tx = 0; else if (tx >= n) tx = n-1;
  if (ty < 0) ty = 0; else if (ty >= n) ty = n-1;
  return ty*n + tx;
}

// Fertility gates germination and scales growth.  [L16]
function rebuildFertility(){
  const n = W.n;
  if (!W.fert || W.fert.length !== n*n) W.fert = new Float32Array(n*n);
  let hab = 0;
  for (let i = 0; i < n*n; i++){
    const e = W.elev[i];
    let alt = 1;
    if (e >= CFG.treeLine) alt = 0;
    else if (e > CFG.foothill){
      const u = (e - CFG.foothill)/(CFG.treeLine - CFG.foothill);
      alt = Math.max(0, 1 - u*u*CFG.altBite);
    }
    W.fert[i] = clamp((1 - W.arid[i]*CFG.aridBite)*alt, 0, 1);
    if (W.fert[i] > CFG.germFertMin) hab++;
  }
  W.habFrac = hab/(n*n);
}

function buildWorld(){
  const n = W.n = CFG.tiles;
  W.size = CFG.worldSize;
  W.tileSize = W.size/n;
  W.tileArea = W.tileSize*W.tileSize;
  W.seed = CFG.seed;
  W.tick = Math.floor(CFG.ticksPerDay*0.30);
  srand(CFG.seed);

  const nz = valueNoise(n, 4, 3, 0.5);
  W.lightBase = new Float32Array(n*n);
  for (let i = 0; i < n*n; i++) W.lightBase[i] = 1 - CFG.lightNoiseAmp*(1 - nz[i]);

  // ---- terrain. Elevation is RIDGED noise: 1-|2v-1| peaks along the 0.5 contour of a smooth field, and contours are lines, so the high ground...  [L17]
  const ez = valueNoise(n, 2, 3, 0.45);
  W.elev = new Float32Array(n*n);
  for (let i = 0; i < n*n; i++){
    const ridge = 1 - Math.abs(2*ez[i] - 1);
    W.elev[i] = clamp(Math.pow(ridge, CFG.ridgeSharp)*CFG.elevAmp, 0, 1);
  }
  rankNormalise(W.elev);
  const az = valueNoise(n, 3, 3, 0.5);
  W.arid = new Float32Array(n*n);
  for (let i = 0; i < n*n; i++) W.arid[i] = az[i];
  rankNormalise(W.arid);
  if (CFG.aridAmp !== 1) for (let i = 0; i < n*n; i++) W.arid[i] = clamp(W.arid[i]*CFG.aridAmp, 0, 1);

  rebuildFertility();

  const nz2 = valueNoise(n, 3, 3, 0.55);
  W.nutrient = new Float64Array(n*n);
  const a = CFG.nutrientNoiseAmp;
  for (let i = 0; i < n*n; i++)
    W.nutrient[i] = clamp(CFG.nutrientStart*(1 - a + 2*a*nz2[i])*W.fert[i],
                          0, CFG.nutrientCap);

  W.scratch  = new Float64Array(n*n);
  W.detritus = new Float64Array(n*n);
  W.canopy   = new Float32Array(n*n*BANDS);
  W.cover    = new Float32Array(n*n);         // precomputed LAI cover [L47-6]
  W.canopyW  = new Float32Array(n*n*BANDS);
  W.canopyI  = new Float32Array(n*n*BANDS);   // intercepted fraction per band [L42-1]
  W.canopyR  = new Float32Array(n*n*BANDS);   // light remaining above each band

  rebuildLatitude(); resizeTileImage(); buildTileOffsets();
  initPlants(); initLineages(); seedFounders(CFG.founders); rebuildCanopy();
  initAnimals(); buildAnimalIndex();
  reclusterLineages(); collectStats(); clearHistory();
  W.matter0 = W.matter;
  resetView();
}

function rebuildLatitude(){
  const n = W.n; W.latF = new Float32Array(n);
  for (let y = 0; y < n; y++)
    W.latF[y] = 1 - CFG.latitudeBand*(1 - Math.cos(2*Math.PI*y/n))/2;
}
// Symmetric pairwise flux, weighted by the POORER of the two tiles.  [L18]
function diffuse(){
  const n = W.n, a = W.nutrient, f = W.fert, r = CFG.diffuseRate;
  const floor = CFG.diffuseFloor;
  for (let y = 0; y < n; y++){
    const yc = y*n, ys = ((y+1)%n)*n;
    for (let x = 0; x < n; x++){
      const i = yc+x, xe = (x+1)%n;
      const je = yc+xe, jsx = ys+x;
      let w = r*(floor + (1-floor)*Math.min(f[i], f[je]));
      let q = w*(a[i] - a[je]);
      a[i] -= q; a[je] += q;
      w = r*(floor + (1-floor)*Math.min(f[i], f[jsx]));
      q = w*(a[i] - a[jsx]);
      a[i] -= q; a[jsx] += q;
    }
  }
}
function decay(){
  const d = W.detritus, u = W.nutrient, r = CFG.decayRate*CFG.diffuseEvery;
  for (let i = 0; i < d.length; i++) if (d[i] > 0){ const m = d[i]*r; d[i] -= m; u[i] += m; }
}
function measure(){
  let s = 0, dt = 0;
  for (let i = 0; i < W.nutrient.length; i++){ s += W.nutrient[i]; dt += W.detritus[i]; }
  let bio = 0;
  for (let i = 0; i < P.hi; i++) if (P.stage[i] === 2) bio += P.mass[i];
  let abio = 0, agut = 0;
  for (let i = 0; i < AN.hi; i++) if (AN.stage[i]){ abio += AN.mass[i]; agut += AN.gut[i]; }
  W.soilSum = s; W.detSum = dt; W.bioSum = bio; W.aBio = abio;
  W.matter = s + dt + (bio+abio)*CFG.nutrientPerMass + agut;
  let tot = 0, occ = 0;
  for (let t = 0; t < W.n*W.n; t++){
    let l = 0;
    for (let b = 0; b < BANDS; b++) l += W.canopy[t*BANDS+b];
    if (l > 0){ tot += l/W.tileArea; occ++; }
  }
  // LAI is the mean over OCCUPIED tiles, so it says nothing about how much of
  // the world is bare. occTiles is the other half of that number.
  W.lai = occ ? tot/occ : 0; W.occTiles = occ;
}

//==========================================================================
// 5. TIME + LIGHT
//==========================================================================
const TPD = () => CFG.ticksPerDay;
const TPY = () => CFG.ticksPerDay*CFG.daysPerYear;
const SEASONS = ['Spring','Summer','Autumn','Winter'];
function dayPhase(){ return (W.tick % TPD())/TPD(); }
function yearPhase(){ return (W.tick % TPY())/TPY(); }
// x^0.75 = sqrt(x)*sqrt(sqrt(x)). Two hardware sqrts instead of a Math.pow
// library call. Profiling put p75(mass) at 17% of updatePlant, which
// was itself 44% of total runtime. [L42-2]
function p75(x){ const r = Math.sqrt(x); return r*Math.sqrt(r); }
function sunElev(){ return Math.max(0, Math.sin(2*Math.PI*(dayPhase() - 0.25))); }
// PER-TICK CACHE. These depend only on W.tick but were being evaluated once
// per plant per update — seasonSin alone was 6.4% of updatePlant. [L42-3]
function refreshTimeCache(){
  W.seaSin   = Math.sin(2*Math.PI*yearPhase());
  W.lightMulNow = CFG.sunPeak*sunElev()*seasonF();
}
function seasonF(){ return Math.max(0, 1 + CFG.seasonAmp*Math.sin(2*Math.PI*yearPhase())); }
function lightMul(){ return CFG.sunPeak*sunElev()*seasonF(); }
function lightAt(tx, ty){ return W.lightBase[ty*W.n+tx]*W.latF[ty]*lightMul(); }

//==========================================================================
// 6. PLANTS
//==========================================================================
const P = {
  max:0, hi:0, live:0, seeds:0,   // hi = exclusive bound on slots ever used
  x:null, y:null, mass:null, energy:null, repro:null, age:null, gen:null,
  timer:null, tile:null, stage:null, lin:null, defence:null, bit:null, leaf:null, genome:null, free:null, freeN:0,
};

function initPlants(){
  const M = P.max = CFG.maxPlants;
  P.x=new Float32Array(M); P.y=new Float32Array(M);
  P.mass=new Float32Array(M); P.energy=new Float32Array(M);
  P.repro=new Float32Array(M); P.age=new Float32Array(M);
  P.gen=new Float32Array(M); P.timer=new Float32Array(M);
  P.tile=new Int32Array(M); P.stage=new Uint8Array(M); P.lin=new Uint8Array(M);
  P.defence=new Float32Array(M); P.bit=new Float32Array(M);
  P.leaf=new Float32Array(M);     // cached leafArea, refreshed each update [L42-4]
  P.h=new Float32Array(M);        // cached effHeight, same cadence [L47-6]
  P.genome=new Float32Array(M*PGENES);
  P.free=new Int32Array(M);
  for (let i = 0; i < M; i++) P.free[i] = M-1-i;
  P.freeN = M; P.hi = 0; P.live = 0; P.seeds = 0;
  // OCCUPIED-SLOT LIST. P.hi is a high-water mark that only ever grows within
  // a run (nothing moves it down except every slot above it emptying out),
  // so a world that blooms once pays the O(hi) cost of every tick's scanning
  // loops for the rest of the run even after it crashes back down -- verified
  // empirically: a run holding steady at 14-20k live plants ran at a fraction
  // of a same-population run that had never exceeded that, because its P.hi
  // was still pinned at an earlier 26k+ peak. P.occIdx/P.occN/P.occPos track
  // exactly which slots are occupied (seed or live, i.e. not on the free
  // list) so the hot loops below can iterate O(occupied) instead of O(hi).
  // Order-only relative to the old scan: no organism's slot index changes
  // (AN.tgt and every other cross-reference by index stays valid), only the
  // VISITATION ORDER some loops use does. [L0.49-1]
  P.occIdx=new Int32Array(M); P.occPos=new Int32Array(M); P.occN=0;
}
function allocSlot(){
  if (P.freeN <= 0) return -1;
  const i = P.free[--P.freeN];
  if (i >= P.hi) P.hi = i+1;
  P.occPos[i] = P.occN; P.occIdx[P.occN++] = i;         // [L0.49-1]
  return i;
}
function releaseSlot(i){
  if (P.stage[i] === 2) P.live--; else if (P.stage[i] === 1) P.seeds--;
  P.stage[i] = 0; P.free[P.freeN++] = i;
  const pos = P.occPos[i], last = P.occIdx[--P.occN];    // swap-remove [L0.49-1]
  P.occIdx[pos] = last; P.occPos[last] = pos;
}
function killPlant(i){
  P.bit[i] = 0;
  W.detritus[P.tile[i]] += P.mass[i]*CFG.nutrientPerMass;
  P.mass[i] = 0; releaseSlot(i);
}
// COPY THEN PERTURB. Inheritance was one rng() draw plus one clamped element
// copy per gene, for every seed and every birth, when at a mutationRate of
// 0.004 fewer than one gene in five actually changes. The copy is a typed-array
// memmove and the mutated indices come from the geometric waiting time of the
// same Bernoulli process, so the distribution over which genes mutate is
// unchanged — the DRAW SEQUENCE is not, which is what the founder pool is for.
// [L47-5]
function mutateInto(dstBase, srcBase){
  const G = P.genome;
  const rate = Math.max(CFG.mutationFloor, G[srcBase+PG.mutationRate]);
  const scale = G[srcBase+PG.mutationScale];
  G.copyWithin(dstBase, srcBase, srcBase+P_ACTIVE);
  if (rate >= CFG.mutFastMax){
    for (let k = 0; k < P_ACTIVE; k++)
      if (rng() < rate) G[dstBase+k] = clamp(G[srcBase+k]+gauss()*PSIG[k]*scale, PMIN[k], PMAX[k]);
    return;
  }
  const lg = Math.log(1-rate);
  for (let k = (Math.log(1-rng())/lg)|0; k < P_ACTIVE; k += 1 + ((Math.log(1-rng())/lg)|0))
    G[dstBase+k] = clamp(G[srcBase+k]+gauss()*PSIG[k]*scale, PMIN[k], PMAX[k]);
}
// A world used to start as one genome stamped out N times, so every lineage it ever had was invented by mutation from a single point.  [L19]
function drawMorphs(nMorph, ACTIVE, START, SIG, MIN, MAX){
  const out = [];
  for (let m = 0; m < nMorph; m++){
    const v = new Float32Array(ACTIVE);
    for (let j = 0; j < ACTIVE; j++){
      // sigmas, not range fractions: a gene table already says how far a
      // meaningful step is for each gene, and the ranges do not agree
      v[j] = m === 0 ? START[j]
           : clamp(START[j] + gauss()*SIG[j]*CFG.morphSpread, MIN[j], MAX[j]);
    }
    out.push(v);
  }
  return out;
}
// FOUNDER POOL. When loaded, founders are drawn from an EVOLVED genome set exported from an earlier run instead of from random morphs around START.  [L20]
const POOL = { plant:null, animal:null };

function seedFounders(count){
  const G = P.genome;
  const pool = POOL.plant;
  const morphs = pool ? null
    : drawMorphs(Math.max(1, CFG.founderMorphs|0), P_ACTIVE, PSTART, PSIG, PMIN, PMAX);
  for (let k = 0; k < count; k++){
    const i = allocSlot(); if (i < 0) return;
    const g = i*PGENES;
    const mo = pool ? pool[(rng()*pool.length)|0] : morphs[k % morphs.length];
    // a pool genome is already the product of selection: copy it, do not
    // re-scatter it by founderNoise or the warm start is thrown away
    if (pool){ for (let j = 0; j < P_ACTIVE; j++) G[g+j] = clamp(mo[j], PMIN[j], PMAX[j]); }
    else
    for (let j = 0; j < P_ACTIVE; j++)
      G[g+j] = clamp(mo[j] + gauss()*PSIG[j]*CFG.founderNoise, PMIN[j], PMAX[j]);

    const t = P.tile[i] = tileOf(P.x[i], P.y[i]);
    if (W.fert[t] < CFG.germFertMin){ releaseSlot(i); continue; }  // [L0.49-1]
    const need = CFG.seedlingMass*CFG.nutrientPerMass;
    if (W.nutrient[t] < need){ releaseSlot(i); continue; }         // [L0.49-1]
    W.nutrient[t] -= need;
    P.mass[i] = CFG.seedlingMass; P.energy[i] = CFG.founderEnergy;
    P.leaf[i] = leafArea(g, CFG.seedlingMass);
    P.h[i]    = effHeight(g, CFG.seedlingMass);           // [L47-6]
    P.repro[i]=0; P.age[i]=0; P.gen[i]=0; P.timer[i]=0; P.lin[i]=0;
    P.stage[i] = 2; P.live++;
  }
}
function spawnSeed(parent, energy, disp){
  if (P.seeds >= P.max*CFG.seedSlotFraction) return false;
  const i = allocSlot(); if (i < 0) return false;
  const g = i*PGENES;
  mutateInto(g, parent*PGENES);
  const ang = rng()*Math.PI*2, d = Math.sqrt(rng())*disp;
  let x = P.x[parent] + Math.cos(ang)*d, y = P.y[parent] + Math.sin(ang)*d;
  x = (x % W.size + W.size) % W.size; y = (y % W.size + W.size) % W.size;
  P.x[i]=x; P.y[i]=y; P.tile[i]=tileOf(x,y);
  P.energy[i]=energy; P.mass[i]=0; P.repro[i]=0; P.age[i]=0;
  P.gen[i] = P.gen[parent]+1;
  P.lin[i] = P.lin[parent];
  P.timer[i] = P.genome[g+PG.germinationDelay];
  P.stage[i] = 1; P.seeds++;
  return true;
}

// Realized height. A seedling has no trunk, so height must be earned with mass.
// This is the asymmetry that lets big plants shade small ones out of existence.
function effHeight(g, mass){
  // sqrt, not m/(m+k): a saturating form flattens the size hierarchy and
  // proportional light sharing returns. This keeps height tracking mass.
  const f = mass < CFG.k_heightMass ? Math.sqrt(mass/CFG.k_heightMass) : 1;
  return P.genome[g+PG.height]*f;
}
// Leaf area actually carried: the canopy it wants, capped by the mass holding it
// up, minus what the stem takes. Tall plants trade canopy area for reach.
function leafArea(g, mass){
  const sp = P.genome[g+PG.canopySpread];
  const want = Math.PI*sp*sp;
  const support = CFG.k_leafPerMass*mass/(1 + CFG.k_stem*effHeight(g, mass));
  // Smooth saturation, not min(). A clamp leaves a linear ramp below it and
  // a dead flat landscape above, and evolution cannot climb flat ground.
  return support*(1 - Math.exp(-want/Math.max(1e-6, support)));
}

// Plants never move, so their index is rebuilt only with the canopy pass.
const PIDX = { start:null, items:null, cur:null };
function buildPlantIndex(){
  const nT = W.n*W.n;
  if (!PIDX.start || PIDX.start.length !== nT+1){ PIDX.start = new Int32Array(nT+1); PIDX.cur = new Int32Array(nT); }
  if (!PIDX.items || PIDX.items.length < P.max) PIDX.items = new Int32Array(P.max);
  PIDX.start.fill(0);
  // Iterates P.occIdx (occupied slots, O(occupied)) instead of 0..P.hi
  // (O(high-water-mark)) — see P.occIdx's definition in initPlants. [L0.49-1]
  for (let k = 0; k < P.occN; k++){ const i = P.occIdx[k]; if (P.stage[i] === 2) PIDX.start[P.tile[i]+1]++; }

  PIDX.cur.set(PIDX.start.subarray(0, nT));
  for (let k = 0; k < P.occN; k++){ const i = P.occIdx[k]; if (P.stage[i] === 2) PIDX.items[PIDX.cur[P.tile[i]]++] = i; }
}
function laiOf(t){
  let l = 0; for (let b = 0; b < BANDS; b++) l += W.canopy[t*BANDS+b];
  return l/W.tileArea;
}

function rebuildCanopy(){
  const c = W.canopy, cw = W.canopyW, G = P.genome;
  // HIGH-WATER TRIM. P.hi only ever grew, so the canopy pass, the index build
  // and the renderer all stayed proportional to the largest seed bank the run
  // ever held rather than to what is alive now. [L47-4] Kept for the other,
  // colder loops still bounded by P.hi (biomass/gene-stat aggregates, pool
  // export) — the hot loop right below now scans P.occIdx instead, so it no
  // longer depends on this trim actually catching up. [L0.49-1]
  while (P.hi > 0 && P.stage[P.hi-1] === 0) P.hi--;

  // iterating P.occIdx (occupied slots) instead of 0..P.hi is a straight
  // O(occupied) win with no effect on the result. [L0.49-1]
  for (let k = 0; k < P.occN; k++){

  }

  // 8 bands x Math.exp for every live plant. updatePlant was 44% of total
  // runtime. Interception per band depends only on (tile, band) — nothing
  // plant-specific — so it belongs here, once per rebuild. Only myFrac needs
  // the individual, and that is now one multiply. [L42-1]
  const AT = W.tileSize*W.tileSize, ks = CFG.k_shade;

      const bl = c[cb+b];

      ci[cb+b] = inter;
      remaining -= inter;
      if (remaining < 0) remaining = 0;
    }

    // per think inside the sense loop, and it depends on nothing individual.
    // Now it is one array read there. [L47-6]
    const cv = lai/TA*cf;
    cov[t] = cv > 1 ? 1 : cv;
  }
  buildPlantIndex();
}

function updateSeed(i, step){
  P.timer[i] -= step;

  if (P.timer[i] > 0) return;
  const t = P.tile[i], need = CFG.seedlingMass*CFG.nutrientPerMass;
  // Building tissue costs energy everywhere else in this model;  [L21]
  if (W.fert[t] < CFG.germFertMin){ W.pSeedFail++; releaseSlot(i); return; }
  const buildE = CFG.seedlingMass*CFG.energyPerMass*CFG.germCostMult;
  if (P.energy[i] <= buildE){ W.pSeedFail++; releaseSlot(i); return; }
  if (W.nutrient[t] < need) return;
  W.nutrient[t] -= need;
  P.energy[i] -= buildE;
  P.mass[i] = CFG.seedlingMass; P.age[i] = 0; W.pGerm++;
  { const gg = i*PGENES;                            // caches must be live before
    P.leaf[i] = leafArea(gg, CFG.seedlingMass);     // any animal can score this
    P.h[i]    = effHeight(gg, CFG.seedlingMass); }  // plant [L47-6]

                                 // made eaten/grown meaningless once the
                                 // world ran on seedlings

}

function updatePlant(i, step){
  // C aliases CFG for this call: CFG never changes mid-run (only buildWorld()
  // re-assigns its fields, before any tick runs), so re-resolving the global
  // binding on every one of the ~25 CFG.* reads below was pure overhead.
  // Profiling a 300-day run found LoadGlobalIC/LoadIC costing 17.5% of all JS
  // time with this function and senseDecide together 58% of it — this alone
  // does not touch W/P/AN, which hold per-tick mutable state and are already
  // partly aliased below (G, t, n, A); worth revisiting if the profile still
  // shows global-lookup cost after this. No formula changed. [L0.48-2]
  const C = CFG;
  const G = P.genome, g = i*PGENES, t = P.tile[i], n = W.n, A = W.tileArea;
  const ty = (t/n)|0;
  const mass = P.mass[i];
  const leaf = leafArea(g, mass); P.leaf[i] = leaf;      // [L42-4]
  const h = effHeight(g, mass); P.h[i] = h;   // realized, not genetic [L47-6]
  const m75 = p75(mass);
  const pe0 = G[g+PG.photoEfficiency];

  // LIGHT: layered Beer-Lambert, top band first, continuous within a band.
  let myBand = (h*BANDS)|0; if (myBand >= BANDS) myBand = BANDS-1;
  const myW = leaf*(1 + (h*BANDS - myBand));
  const cb = t*BANDS + myBand;
  const relLight = W.canopyR[cb];                        // [L42-1]
  let bw = W.canopyW[cb], inter = W.canopyI[cb];
  if (bw < myW){
    // grew past the last canopy rebuild: fall back to the honest value
    bw = myW;
    inter = relLight*(1 - Math.exp(-C.k_shade*Math.max(W.canopy[cb], leaf)/A));
  }
  const myFrac = bw > 0 ? inter*(myW/bw) : 0;
  const tol = G[g+PG.shadeTolerance];
  const photoEff = pe0
                 * (1 - C.k_shadeCost*tol)
                 * (1 + tol*(1-relLight)*C.k_shadeGain);
  const light = W.lightBase[t]*W.latF[ty]*W.lightMulNow;  // [L42-3]
  // Poor ground is poor ground: dryness and altitude scale what a plant can
  // actually make of the light it catches.
  const gain = light*A*myFrac*photoEff*C.k_photo*W.fert[t];

  // fraction of this plant's leaf actually intercepting light [L40-1]
  const litFrac = leaf > 0 ? Math.min(1, myFrac*A/leaf) : 1;
  const photoLeaf = leaf*(C.k_darkResp + (1-C.k_darkResp)*litFrac);

  const life = G[g+PG.lifespan];
  let sen = 1;
  if (P.age[i] > life) sen = Math.min(20, 1 + G[g+PG.senescenceRate]*(P.age[i]-life)/life);

  const upkeep = (C.k_base
    + C.k_mass*m75
    + C.k_leaf*leaf
    + C.k_height*h*h*mass
    + C.k_root*G[g+PG.rootDepth]*G[g+PG.rootDepth]*mass   // B1: quadratic
    + C.k_regrowCost*G[g+PG.regrowthRate]*G[g+PG.regrowthRate]*mass
    + C.k_photoCost*pe0*pe0*photoLeaf // quadratic, or efficiency pins to a rail
    // B2+B3: disposable soma, as the animals have always had.  [L22]
    + C.k_longevity*life*m75/(G[g+PG.senescenceRate] + 0.2))*sen;
  if ((i & 63) === 0){
    UPK[0] += C.k_base*sen;              UPK[1] += C.k_mass*m75*sen;
    UPK[2] += C.k_leaf*leaf*sen;         UPK[3] += C.k_height*h*h*mass*sen;
    UPK[4] += C.k_root*G[g+PG.rootDepth]*G[g+PG.rootDepth]*mass*sen;
    UPK[5] += C.k_regrowCost*G[g+PG.regrowthRate]*G[g+PG.regrowthRate]*mass*sen;
    UPK[6] += C.k_photoCost*pe0*pe0*photoLeaf*sen;
    UPK[7] += C.k_longevity*life*m75/(G[g+PG.senescenceRate]+0.2)*sen; UPK[8] += gain;
    UPKN++;
  }

  P.energy[i] += (gain - upkeep)*step;
  W.ePhoto += gain*step;
  P.age[i] += step;
  if (P.energy[i] <= 0 || P.age[i] > life*3){
    // MUTUALLY EXCLUSIVE chain: recent grazing marks "eaten", past lifespan marks senescence, everything else is shaded out.  [L23]
    if      (P.age[i] > life*3) W.pDeadAge++;
    else if (P.bit[i] > 0 && W.tick - P.bit[i] < C.ticksPerDay*2) W.pDeadEat++;
    else if (P.age[i] > life) W.pDeadSen++;
    else W.pDeadStarve++;
    killPlant(i); return;
  }

  const ageFrac = clamp(P.age[i]/life, 0, 1);
  const sea = W.seaSin;                                  // [L42-3]
  let a0 = G[g+PG.allocGrowth]  + G[g+PG.ageShiftGrowth]*ageFrac  + G[g+PG.seasonShiftGrowth]*sea;
  let a1 = G[g+PG.allocDefence] + G[g+PG.ageShiftDefence]*ageFrac + G[g+PG.seasonShiftDefence]*sea;
  let a2 = G[g+PG.allocRepro]   + G[g+PG.ageShiftRepro]*ageFrac   + G[g+PG.seasonShiftRepro]*sea;
  let a3 = G[g+PG.allocStorage] + G[g+PG.ageShiftStorage]*ageFrac + G[g+PG.seasonShiftStorage]*sea;
  if (a0<0) a0=0; if (a1<0) a1=0; if (a2<0) a2=0; if (a3<0) a3=0;
  // a plant must at least double from a seedling before it can breed, or
  // maturityMass evolves below seedlingMass and every sprout is born adult
  const matM = Math.max(C.seedlingMass*2,
                        Math.min(G[g+PG.maturityMass], G[g+PG.maxMass]));
  const mature = P.mass[i] >= matM;
  if (!mature){ a0 += a2; a2 = 0; }
  const sum = a0+a1+a2+a3;
  if (sum > 0){ a0/=sum; a1/=sum; a2/=sum; a3/=sum; } else { a3 = 1; }

  const reserve = a3*C.k_storage*upkeep*C.ticksPerDay;
  const surplus = P.energy[i] - reserve;
  if (surplus > 0){
    const room = G[g+PG.maxMass] - mass;
    const gEn = surplus*a0;
    if (room > 0 && gEn > 0){
      const cap = C.k_uptake*G[g+PG.rootDepth]*p75(mass)*step;
      const nAvail = Math.min(cap, W.nutrient[t]);
      // Compensatory regrowth: a recently cropped plant rebuilds cheaply,
      // because the roots and meristems it is regrowing from are still there.
      const epm = (P.bit[i] > 0 && W.tick - P.bit[i] < C.ticksPerDay*C.regrowDays)
        ? C.energyPerMass*(1 - C.k_regrow*G[g+PG.regrowthRate])
        : C.energyPerMass;
      const byE = gEn/epm, byN = nAvail/C.nutrientPerMass;
      const dM = Math.min(byE, byN, room);
      // which of the three actually bound? light-limited and nutrient-limited
      // worlds behave completely differently and I could not tell them apart
      if (dM === byN) W.limN++; else if (dM === room) W.limM++; else W.limE++;
      if (dM > 0){
        P.mass[i] = mass + dM; W.grown += dM;
        P.energy[i] -= dM*epm;
        W.nutrient[t] -= dM*C.nutrientPerMass;
      }
    }
    // DEFENCE. allocDefence finally has a job: realized defence is what the plant actually paid for, over what its genes ask for.  [L24]
    const dEn = surplus*a1;
    if (dEn > 0){
      P.energy[i] -= dEn;
      const tg = G[g+PG.toughness], tx = G[g+PG.toxicity], fb = G[g+PG.fibre];
      const need = (C.k_toughCost*tg*tg + C.k_toxCost*tx*tx + C.k_fibreCost*fb*fb)*mass*step;
      const got = need > 1e-9 ? clamp(dEn/need, 0, 1) : 1;
      P.defence[i] = P.defence[i]*0.75 + got*0.25;
    } else P.defence[i] *= 0.9;
    const rEn = surplus*a2; if (rEn > 0){ P.energy[i] -= rEn; P.repro[i] += rEn; }
  }

  // Recruitment survival — pMature against pGerm. Zero net recruitment while
  // eaten/grown read a healthy 0.48 was the failure the log could not show.
  if (!mature && P.mass[i] >= matM) W.pMature++;

  if (mature && P.repro[i] > 0){
    const sE = G[g+PG.seedEnergy], disp = G[g+PG.dispersalRange];
    const costPer = sE + C.k_disperse*disp*disp;   // B7: quadratic
    let want = Math.min(G[g+PG.seedCount]|0, (P.repro[i]/costPer)|0);
    while (want-- > 0){
      if (!spawnSeed(i, sE, disp)) break;
      P.repro[i] -= costPer;
      // every 8th, so the accumulator costs a fraction of a gene copy per seed
      if ((W.pSeeded++ & 7) === 0) selAccum(SELP, P.genome, g, P_ACTIVE);
    }
  }
}

function updatePlants(){
  const stag = CFG.plantStagger, phase = W.tick % stag;
  if (phase === 0) rebuildCanopy();
  // Strided over P.occIdx's POSITION, not raw slot index, so cost tracks
  // occupied count rather than P.hi. [L0.49-1] This does change which specific
  // plants share a stagger phase (a swap-remove during this same pass — a
  // plant dying as a direct result of its own update this tick — can move an
  // unvisited slot into an already-visited position, skipping it for this one
  // cycle) versus the old raw-index scan; no plant is ever double-updated or
  // lost, worst case is one plant's growth landing a cycle late. Verified via
  // the same-seed comparison in LEDGER.md, not an exact RNG-sequence match.
  for (let k = phase; k < P.occN; k += stag){
    const i = P.occIdx[k], st = P.stage[i];
    if (st === 2) updatePlant(i, stag);
    else if (st === 1) updateSeed(i, stag);
  }
}


//==========================================================================
// 6b. ANIMALS — struct of arrays, tile index rebuilt every tick.  [L25]
//==========================================================================
const AN = {
  max:0, hi:0, live:0,
  x:null, y:null, hd:null, sp:null, mass:null, energy:null, gut:null,
  age:null, stam:null, gen:null, up:null, tile:null, stage:null, tgt:null, act:null,
  lin:null, genome:null, free:null, freeN:0, rate:null, pursue:null, stall:null,
  risk:null,                       // EWMA of threat exposure, energy/tick [L47-3]
};
const AIDX = { start:null, items:null, cur:null };
let TOFF = null, TOFFD = null;   // tile offsets sorted by distance

function initAnimals(){
  const M = AN.max = CFG.maxAnimals;
  AN.x=new Float32Array(M); AN.y=new Float32Array(M);
  AN.hd=new Float32Array(M); AN.sp=new Float32Array(M);
  AN.mass=new Float32Array(M); AN.energy=new Float32Array(M);
  AN.gut=new Float32Array(M); AN.age=new Float32Array(M); AN.rate=new Float32Array(M);
  AN.risk=new Float32Array(M);                                      // [L47-3]
  AN.pursue=new Float32Array(M); AN.stall=new Float32Array(M);
  AN.stam=new Float32Array(M); AN.gen=new Float32Array(M); AN.up=new Float32Array(M);
  AN.tile=new Int32Array(M); AN.stage=new Uint8Array(M);
  AN.tgt=new Int32Array(M); AN.act=new Uint8Array(M); AN.lin=new Uint8Array(M);
  AN.genome=new Float32Array(M*AGENES);
  AN.free=new Int32Array(M);
  for (let i = 0; i < M; i++) AN.free[i] = M-1-i;
  AN.freeN = M; AN.hi = 0; AN.live = 0;
  // OCCUPIED-SLOT LIST, same idea and reason as P.occIdx above. Tracks any
  // occupied slot (ALIVE or CORPSE — both need indexing for buildAnimalIndex
  // and both get visited by updateAnimals), not just live animals. [L0.49-1]
  AN.occIdx=new Int32Array(M); AN.occPos=new Int32Array(M); AN.occN=0;
}
function allocAnimal(){
  if (AN.freeN <= 0) return -1;
  const i = AN.free[--AN.freeN];
  if (i >= AN.hi) AN.hi = i+1;
  AN.occPos[i] = AN.occN; AN.occIdx[AN.occN++] = i;      // [L0.49-1]
  return i;
}
// Frees a slot to the free list and drops it from the occupied-slot list.
// The single path off AN.occIdx, same role releaseSlot plays for plants —
// every direct "AN.free[AN.freeN++] = i" used to bypass this. [L0.49-1]
function freeAnimal(i){
  AN.stage[i] = 0; AN.free[AN.freeN++] = i;
  const pos = AN.occPos[i], last = AN.occIdx[--AN.occN];
  AN.occIdx[pos] = last; AN.occPos[last] = pos;
}
// Death returns body mass AND undigested gut to the tile.  [L26]
function killAnimal(i){
  W.detritus[AN.tile[i]] += AN.gut[i];
  AN.gut[i] = 0;
  AN.live--;
  if (AN.mass[i] > CFG.corpseMin){
    AN.stage[i] = CORPSE; AN.sp[i] = 0; AN.tgt[i] = -1; AN.age[i] = 0;
    W.corpses++;
  } else {
    W.detritus[AN.tile[i]] += AN.mass[i]*CFG.nutrientPerMass;
    AN.mass[i] = 0; freeAnimal(i);
  }
}
function decayCorpse(i){
  const d = Math.min(AN.mass[i], AN.mass[i]*CFG.k_corpseDecay + 1e-6);
  AN.mass[i] -= d; W.corpseRot += d;
  W.detritus[AN.tile[i]] += d*CFG.nutrientPerMass;
  if (AN.mass[i] <= CFG.corpseMin){
    W.detritus[AN.tile[i]] += AN.mass[i]*CFG.nutrientPerMass;
    AN.mass[i] = 0; freeAnimal(i); W.corpses--;
  }
}
function mutateAnimal(dst, src){          // see mutateInto [L47-5]
  const G = AN.genome;
  const rate = Math.max(CFG.mutationFloor, G[src+AG.mutationRate]);
  const scale = G[src+AG.mutationScale];
  G.copyWithin(dst, src, src+A_ACTIVE);
  if (rate >= CFG.mutFastMax){
    for (let k = 0; k < A_ACTIVE; k++)
      if (rng() < rate) G[dst+k] = clamp(G[src+k]+gauss()*ASIG[k]*scale, AMIN[k], AMAX[k]);
    return;
  }
  const lg = Math.log(1-rate);
  for (let k = (Math.log(1-rng())/lg)|0; k < A_ACTIVE; k += 1 + ((Math.log(1-rng())/lg)|0))
    G[dst+k] = clamp(G[src+k]+gauss()*ASIG[k]*scale, AMIN[k], AMAX[k]);
}
function buildTileOffsets(){
  const R = Math.ceil(60/W.tileSize)+1, a = [];
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++)
    a.push([dx, dy, Math.hypot(dx, dy)]);
  a.sort((u,v) => u[2]-v[2]);
  TOFF = new Int32Array(a.length*2); TOFFD = new Float32Array(a.length);
  for (let k = 0; k < a.length; k++){ TOFF[k*2]=a[k][0]; TOFF[k*2+1]=a[k][1]; TOFFD[k]=a[k][2]; }
}
function buildAnimalIndex(){
  while (AN.hi > 0 && !AN.stage[AN.hi-1]) AN.hi--;                   // [L47-4]
  const nT = W.n*W.n;
  if (!AIDX.start || AIDX.start.length !== nT+1){ AIDX.start = new Int32Array(nT+1); AIDX.cur = new Int32Array(nT); }
  if (!AIDX.items || AIDX.items.length < AN.max) AIDX.items = new Int32Array(AN.max);
  AIDX.start.fill(0);
  // O(occupied) via AN.occIdx instead of O(AN.hi) — this runs every tick,
  // unstaggered, so it was the single biggest beneficiary of AN.hi staying
  // pinned at a past population peak. [L0.49-1]
  for (let k = 0; k < AN.occN; k++){ const i = AN.occIdx[k]; if (AN.stage[i]) AIDX.start[AN.tile[i]+1]++; }
  for (let t = 0; t < nT; t++) AIDX.start[t+1] += AIDX.start[t];
  AIDX.cur.set(AIDX.start.subarray(0, nT));
  for (let k = 0; k < AN.occN; k++){ const i = AN.occIdx[k]; if (AN.stage[i]) AIDX.items[AIDX.cur[AN.tile[i]]++] = i; }
}
function seedAnimalFounders(count){
  const G = AN.genome;
  const pool = POOL.animal;                                     // [L37-3]
  const amorphs = pool ? null
    : drawMorphs(Math.max(1, CFG.founderMorphs|0), A_ACTIVE, ASTART, ASIG, AMIN, AMAX);
  for (let k = 0; k < count; k++){
    const i = allocAnimal(); if (i < 0) return;
    const g = i*AGENES;
    const mo = pool ? pool[(rng()*pool.length)|0] : amorphs[k % amorphs.length];
    if (pool){ for (let j = 0; j < A_ACTIVE; j++) G[g+j] = clamp(mo[j], AMIN[j], AMAX[j]); }
    else
    for (let j = 0; j < A_ACTIVE; j++)
      G[g+j] = clamp(mo[j] + gauss()*ASIG[j]*CFG.founderNoise, AMIN[j], AMAX[j]);
    AN.x[i] = rng()*W.size; AN.y[i] = rng()*W.size;
    if (!passable(tileOf(AN.x[i], AN.y[i]))){ freeAnimal(i); continue; }  // [L0.49-1]
    AN.tile[i] = tileOf(AN.x[i], AN.y[i]);
    AN.hd[i] = rng()*Math.PI*2; AN.sp[i] = 0;
    const bm = G[g+AG.size]*G[g+AG.birthMassFraction];
    const need = bm*CFG.nutrientPerMass*2;
    if (W.nutrient[AN.tile[i]] < need){ freeAnimal(i); continue; }        // [L0.49-1]
    W.nutrient[AN.tile[i]] -= need;          // matter has to come from somewhere
    AN.mass[i] = bm;
    AN.energy[i] = CFG.animalFounderEnergy;
    AN.gut[i] = bm*CFG.nutrientPerMass;
    AN.age[i] = 0; AN.stam[i] = 1; AN.gen[i] = 0; AN.up[i] = 0.05; AN.risk[i] = 0;
    AN.tgt[i] = -1; AN.act[i] = ACT_WANDER; AN.lin[i] = 0;
    AN.stage[i] = 1; AN.live++;
  }
}
// Upkeep composition, sampled from 1 plant in 64.  [L27]
const UPK = new Float64Array(9);
let UPKN = 0;
// FECUNDITY differential accumulators: the mean genome of everything that reproduced, offspring-weighted (1 birth in 8 is sampled).  [L28]
const SELP = { acc:null, n:0 }, SELA = { acc:null, n:0 };
function selAccum(A, G, base, act){
  if (!A.acc) return;
  for (let k = 0; k < act; k++) A.acc[k] += G[base+k];
  A.n++;
}
function wrapDelta(d){ return d - W.size*Math.round(d/W.size); }

// Net worth of one plant to one grazer, per tick of grazing.  [L29]
// CLIMBING NOW EXTENDS REACH. It only ever affected terrain drag, so it was
// decoration on a one-dimensional arms race that plants win outright: at
// v0.42 day 14695, effHeight 0.653 against reach 0.113 gave access 0.005 and
// pLocked 0.996 — total refuge, which starved the fauna to extinction in one
// of two long runs. Browse height is a second axis, it uses a gene that was
// already under weak positive selection (0.134 -> 0.346), and it is bounded by
// the k_climbC*climbing^2 cost that already exists. [L43-2]
function reachOf(g){
  const C = CFG, G = AN.genome;   // [L0.48-2]
  return C.k_reach*Math.pow(Math.max(0.05, G[g+AG.size]), C.reachMassPow)
         *(1 + C.k_climbReach*G[g+AG.climbing]);
}
// a length, so mass^(1/3) — same rule as reach. [L39-1]
function radiusOf(i){ return CFG.k_bodyRadius*Math.cbrt(Math.max(0.05, AN.mass[i])); }
function accessOf(j, reach){
  if (CFG.k_reach <= 0) return 1;
  // CUBIC, not quadratic. A Lorentzian starting at 1 decays immediately, so the first cut taxed every plant instead of protecting tall ones.  [L30]
  const r = reach || 1e-6, h = P.h[j]/r;               // cached height [L47-6]
  return 1/(1 + h*h*h);
}
// Energy per tick this animal would actually get from this plant, all three defences and reach included.  [L31]
function carrionDigest(carn){
  const C = CFG;   // [L0.48-2]
  return C.carrionFloor + (1 - C.carrionFloor)*carn;
}
function toxLoss(toxRaw, meal){
  return meal*CFG.toxMaxLoss*toxRaw/(toxRaw + meal + 1e-9);
}
// SATIATION. `AN.energy` was never bounded, so `energyCapacity` named a capacity it did not enforce — animals ran at three times their own cap and...  [L32]
function satiateBite(i, g, perMass){
  if (perMass <= 1e-9 || AN.up[i] <= 0) return Infinity;   // no upkeep yet, no cap yet
  const cap = AN.genome[g+AG.energyCapacity]*AN.up[i]*CFG.ticksPerDay;
  return Math.max(0, cap - AN.energy[i])/perMass;
}
function grazeYield(i, j, herb, fibreTol, toxRes, reach){
  const C = CFG;   // [L0.48-2]
  const pg = j*PGENES, def = P.defence[j], g = i*AGENES;
  const tough  = P.genome[pg+PG.toughness]*def;
  const digest = herb/(1 + C.k_fibreBite*P.genome[pg+PG.fibre]*def*(1-fibreTol));
  const meal   = C.tissueValue*Math.max(0, digest);
  const toxRaw = P.genome[pg+PG.toxicity]*def*C.k_toxinHarm/(1 + toxRes);  // [L47-1]
  let bite = C.k_intake*Math.pow(AN.genome[g+AG.metabolicRate], C.metPow)
             *AN.genome[g+AG.biteForce]*Math.pow(AN.mass[i], C.biteMassPow)
             /(1 + C.k_toughBite*tough)*accessOf(j, reach);
  bite = Math.min(bite, P.mass[j]);
  return Math.max(0, bite*(meal - toxLoss(toxRaw, meal)));
}
// MARGINAL VALUE THEOREM, properly: choose a patch by its expected gain, leave it by its marginal rate.  [L33]
function plantScore(j, d, herb, fibreTol, toxRes, pa, hunger){
  const C = CFG;   // [L0.48-2]
  const pg = j*PGENES, def = P.defence[j];
  const digest = herb/(1 + C.k_fibreBite*P.genome[pg+PG.fibre]*def*(1-fibreTol));
  const meal   = digest*C.tissueValue;
  const toxRaw = P.genome[pg+PG.toxicity]*def*C.k_toxinHarm/(1 + toxRes);  // [L47-1]
  const net    = meal - toxLoss(toxRaw, meal);        // energy per unit mass
  if (net <= 0) return 0;
  let bite = ABITEC/(1 + C.k_toughBite*P.genome[pg+PG.toughness]*def)
             *accessOf(j, AREACH);
  if (bite > P.mass[j]) bite = P.mass[j];
  if (bite <= 1e-9) return 0;
  // a patch is worth what the gut can hold of it, not what the plant weighs
  const patch = Math.min(P.mass[j], AGUT)*net, rate = bite*net;
  return patch/(d/ASPD + patch/rate)*pa*hunger;
}
// state of the animal currently deciding, set once per senseDecide so the
// score helper stays a leaf function in the hot neighbour loop
let AREACH = 1, ABITEC = 0, ASPD = 0.1, AGUT = 1, AATKC = 0;
// a target an animal has demonstrably failed to reach is excluded from the
// very next decision, or it simply re-picks the same unreachable plant
let BANNED = -1;

// ---- sense + decide. Scans tiles nearest-first and stops after senseCap
// detections, so senseRange has a saturating benefit against a quadratic cost.
function senseDecide(i){
  // C aliases CFG for this call — see updatePlant [L0.48-2]. This is the
  // single hottest function in the build by profile share (33.5% of JS
  // time with its inlined helpers), and had 24 direct CFG.* references
  // plus more inside plantScore/grazeYield/accessOf/reachOf/carrionDigest,
  // called up to senseCap times per candidate.
  const C = CFG;

      // balance between them was therefore set by the modeller, not by genes —

        // away in TIME, which is the whole point of running. [L47-2]

        // REVERTED: the floor is LOAD-BEARING, not a harmless asymmetry.

      // at what it cost to build. Absolute energy per tick, like everything

// shared by the arbiter and the act phase so both agree on when an animal
// is in its active part of the day
function onPhaseOf(g){
  let dp = Math.abs((W.tick % CFG.ticksPerDay)/CFG.ticksPerDay - AN.genome[g+AG.activityPhase]);
  if (dp > 0.5) dp = 1 - dp;

function updateAnimal(i){

    AN.sp[i] *= 0.7; moving = AN.sp[i] > 0.01;
    AN.stam[i] = Math.min(1, AN.stam[i] + CFG.staminaRecover*metT*(1.4 - 0.8*onPhaseOf(g)));

    const d = Math.sqrt(dx*dx+dy*dy);

                 /(1 + CFG.k_toughBite*tough)*acc;

    const d = Math.sqrt(dx*dx+dy*dy);

    steer(i, AN.x[i]-dx, AN.y[i]-dy, 1);

    const dx = wrapDelta(AN.x[tgt]-AN.x[i]), dy = wrapDelta(AN.y[tgt]-AN.y[i]);

    + CFG.k_bite*G[g+AG.biteForce]**2
    + CFG.k_camo*G[g+AG.camouflage]**2
    // Each gut is priced on ITS OWN, plus the old joint term. k_digest only
    // charged the EXCESS over carn+herb=1, so herbivory below 1.0 was free and
    // rails to 1.0 for nothing — 99% at max in both long runs. [L44-3]
    + CFG.k_gut*(G[g+AG.carnivory]**2 + G[g+AG.herbivory]**2)
    + CFG.k_digest*Math.max(0, G[g+AG.carnivory]+G[g+AG.herbivory]-1)**2
    + CFG.k_mixed*Math.max(0, G[g+AG.carnivory]*G[g+AG.herbivory] - CFG.mixedFree)
    + CFG.k_fibreC*G[g+AG.fibreTolerance]**2
    + CFG.k_toxinC*G[g+AG.toxinResistance]**2
    + CFG.k_thermal*G[g+AG.thermalTolerance]**2
    + CFG.k_climbC*G[g+AG.climbing]**2;
  // a_base IS NO LONGER MASS-SCALED. It sat inside the capability group and got
  // multiplied by m75/upkeepRefM75, so it was not a floor at all — it shrank
  // with the animal. Nothing then opposed shrinking: intake goes as mass^0.667
  // against upkeep mass^0.75, newborn provisioning is offspringInvestment*nbUp
  // so a tiny newborn gets the same DAYS of reserve as a big one, and v0.44's
  // maturity mass gate made large size slow to breed. Size duly collapsed
  // 5.07 -> 1.09 with 81% pinned at the minimum. A genuine fixed overhead is
  // why there is no mammal smaller than a shrew. It puts a floor under body
  // size without touching any benefit: roughly unchanged at mass 5, ~2.8x
  // heavier at mass 1. [L45-1]
  const upkeep = (CFG.a_base
    + capability*(m75/CFG.upkeepRefM75)
    + CFG.a_mass*m75
    + (moving ? CFG.k_move*mass*v*v : 0)
    + CFG.k_accel*mass*G[g+AG.acceleration]**2
    + CFG.k_turn*mass*G[g+AG.turnRate]**2
    + CFG.k_armourC*G[g+AG.armour]*mass
    + CFG.k_biteRangeC*G[g+AG.biteRange]**2*m75          // B5
    + CFG.k_storeC*G[g+AG.energyCapacity]*m75            // B6
    + CFG.k_longevityA*life*m75/(G[g+AG.senescenceRate]+0.2)
    )*G[g+AG.metabolicRate]*sen*(1 + winter*(1-G[g+AG.thermalTolerance]));
  AN.energy[i] -= upkeep;
  AN.up[i] = upkeep;
  W.aUpSum += upkeep; W.aTicks++; if (ate > 0) W.aFeedTicks++;
  AN.age[i] += 1;
  if (ate <= 0) AN.rate[i] -= AN.rate[i]*CFG.rateEwma;   // decay when not feeding
  if (AN.energy[i] <= 0 || AN.age[i] > life*3){
    // MUTUALLY EXCLUSIVE — see the plant version. This one has never fired
    // because nothing lives past `life`, which is itself the finding.
    if (AN.age[i] > life*3) W.aDeadAge++;
    else if (AN.age[i] > life) W.aDeadSen++;
    else W.aDeadStarve++;
    // age at death against maturity: if this sits near zero the population is
    // newborns dying before they ever feed, not adults being outcompeted
    W.aDeathAge += AN.age[i]; W.aDeathN++;
    let db = (AN.age[i]/Math.max(1, G[g+AG.maturityAge])*4)|0;
    if (db > 7) db = 7; if (db < 0) db = 0;
    DAGE[db]++;
    killAnimal(i); return;
  }

  // --- grow: needs energy AND matter, exactly like a plant
  const room = G[g+AG.size] - mass;
  const cap = Math.max(1e-6, G[g+AG.energyCapacity]*upkeep*CFG.ticksPerDay);
  // A8: GROWTH IS SUBORDINATE TO BREEDING ONCE MATURE.  [L47]
  const birth = G[g+AG.size]*G[g+AG.birthMassFraction];
  const nbUp = Math.max(1e-6, upkeep*Math.pow(birth/Math.max(1e-6, mass), 0.75));
  const invest = G[g+AG.offspringInvestment]*nbUp*CFG.ticksPerDay;
  const buildE = birth*CFG.energyPerMassA;
  const reproNeed = Math.max(G[g+AG.matingThreshold]*cap, invest + buildE + cap*0.2);
  // MASS GATE. maturityAge alone let an animal breed at age 300 while still
  // tiny and still emit full-size offspring (birth = size*birthMassFraction
  // reads the GENE, not the body), so early maturity was free and the gene sat
  // 100% at min in both long runs. [L44-5]
  const adult = AN.age[i] > G[g+AG.maturityAge]
                && mass >= CFG.maturityMassFrac*G[g+AG.size];
  const growGate = adult ? Math.max(cap*0.5, reproNeed) : cap*0.5;
  if (room > 0 && AN.energy[i] > growGate){
    const dM = Math.min((AN.energy[i]-growGate)/CFG.energyPerMassA,
                        AN.gut[i]/CFG.nutrientPerMass, room, (mass*0.02+0.01)*metT);
    if (dM > 0){
      AN.mass[i] = mass = mass + dM;
      AN.energy[i] -= dM*CFG.energyPerMassA;
      AN.gut[i] -= dM*CFG.nutrientPerMass;
    }
  }
  // undigested matter is excreted, not destroyed
  const gutCap = mass*CFG.nutrientPerMass*CFG.gutCapMult;
  if (AN.gut[i] > gutCap){ W.detritus[t] += AN.gut[i]-gutCap; AN.gut[i] = gutCap; }

  // --- reproduce (asexual + mutation in phase 3; crossover at phase 5)
  if (adult && AN.energy[i] > G[g+AG.matingThreshold]*cap){
    // birth / nbUp / invest / buildE are hoisted above the growth block (A8) so growGate can read the real clutch cost.  [L48]
    let want = G[g+AG.offspringCount]|0;
    while (want-- > 0){
      const need = birth*CFG.nutrientPerMass;
      if (AN.energy[i] < invest + buildE + cap*0.2 || AN.gut[i] < need) break;
      const c = allocAnimal(); if (c < 0) break;
      mutateAnimal(c*AGENES, g);
      AN.x[c] = AN.x[i]; AN.y[c] = AN.y[i]; AN.tile[c] = AN.tile[i];
      AN.hd[c] = rng()*Math.PI*2; AN.sp[c] = 0;
      AN.mass[c] = birth; AN.energy[c] = invest; AN.gut[c] = 0;
      AN.age[c] = 0; AN.stam[c] = 1; AN.gen[c] = AN.gen[i]+1; AN.risk[c] = 0;
      // satiateBite reads AN.up, and a recycled slot still holds the previous
      // occupant's upkeep. Seed it with the Kleiber estimate already computed.
      AN.up[c] = nbUp;
      AN.tgt[c] = -1; AN.act[c] = ACT_WANDER; AN.lin[c] = AN.lin[i];
      AN.stage[c] = 1; AN.live++;
      if ((W.aBorn++ & 7) === 0) selAccum(SELA, AN.genome, g, A_ACTIVE);
      AN.energy[i] -= invest + buildE; AN.gut[i] -= need;
    }
  }
}

function updateAnimals(){
  buildAnimalIndex();
  const phase = W.tick % CFG.animalThink;
  // O(occupied) via AN.occIdx instead of O(AN.hi). [L0.49-1] Think-scheduling
  // (i % CFG.animalThink === phase) still keys off each animal's own slot
  // index, unchanged from before — only the SET being scanned and its order
  // changed, not which tick any given animal thinks on. A death this tick
  // (this animal starving, or ATTACK/SCAVENGE killing a DIFFERENT occupied
  // slot elsewhere in the list, e.g. a scavenged corpse finishing decay) can
  // via swap-remove move a not-yet-visited slot to an already-visited
  // position (skipped this tick) or vice versa (visited twice, harmless —
  // decayCorpse and the stage checks are idempotent per tick). Bounded,
  // rare, order-only; verified via the same-seed comparison in LEDGER.md.
  for (let k = 0; k < AN.occN; k++){
    const i = AN.occIdx[k];
    if (!AN.stage[i]) continue;
    if (AN.stage[i] === CORPSE){ decayCorpse(i); continue; }
    if (i % CFG.animalThink === phase) senseDecide(i);
    updateAnimal(i);
  }
}

// SLOT COMPACTION. The free lists are LIFO, so after any churn a fresh
// organism can land on a high index while low ones sit free, and P.hi/AN.hi
// never come back down. Sorting the free list descending means allocSlot pops
// the LOWEST index first, which lets the high-water trim in rebuildCanopy and
// buildAnimalIndex actually bite. Order-only: no matter moves, no rng is
// drawn, nothing physical depends on which slot an organism occupies. [L47-4]
function compactFree(){
  if (P.freeN > 1){ const f = P.free.subarray(0, P.freeN); f.sort(); f.reverse(); }
  if (AN.freeN > 1){ const f = AN.free.subarray(0, AN.freeN); f.sort(); f.reverse(); }
}

function tick(){
  W.tick++;
  refreshTimeCache();          // must precede any plant or animal update [L42-3]
  updatePlants();
  updateAnimals();
  if (W.tick % CFG.diffuseEvery === 0){ diffuse(); decay(); }
  if (CFG.compactEvery > 0 && W.tick % CFG.compactEvery === 0) compactFree();  // [L47-4]
  if (W.tick % CFG.lineageEvery === 0) reclusterLineages();
  if (W.tick % CFG.statEvery === 0) collectStats();
  if (W.tick % LOG.every === 0){
    if (W.tick % CFG.statEvery !== 0) collectStats();
    logSample();
  }
  if (W.tick % TPD() === 0){
    const day = W.tick/TPD();
    // The nets are LIFE SUPPORT and were invisible in the log.  [L49]
    if (day <= CFG.reseedDays && P.live < CFG.reseedFloor){
      const need = CFG.reseedFloor - P.live;
      seedFounders(need); W.pReseed += need;
      if (W.pReseed === need) logEvent('plant-net-first', {n:need});
    }
    // grazers are introduced once the vegetation exists, then netted briefly
    if (day === CFG.animalStartDay) seedAnimalFounders(CFG.animalFounders);
    else if (day > CFG.animalStartDay && day <= CFG.animalStartDay + CFG.animalReseedDays
             && AN.live < CFG.animalFloor){
      const need = CFG.animalFloor - AN.live;
      seedAnimalFounders(need); W.aReseed += need;
      if (W.aReseed === need) logEvent('animal-net-first', {n:need, day:day});
    }
    if (day === CFG.animalStartDay + CFG.animalReseedDays) logEvent('animal-net-off', {n:W.aReseed});
  }
}

//==========================================================================
// 7. LINEAGES — instrumentation, NOT species. Both kingdoms.  [L50]
//==========================================================================
const MAXLIN = 12, LHN = 120;
const LINCOL = ['#7FC24A','#E0A23C','#D9704A','#C9558E','#8A6BD9','#4A86E0',
                '#3FB6B0','#8FA33C','#D9536B','#6FA3C4','#B08A5A','#9A9A88'];
// 44 x 34 = 1,496 names before the numeric suffix has to appear
const SYL1 = ['ka','ve','tor','mi','sa','lu','dra','no','pi','ze','gar','hy','ru','ba','fen','ol',
              'qua','thal','bri','sen','vor','ash','mel','cor','ith','nal','pyr','ost','wen','jul',
              'kes','arn','sol','tir','umb','yar','ele','zon','hal','mir','cae','dun','oph','vex'];
const SYL2 = ['ndra','lix','mor','tha','ven','sil','kor','nis','pha','dus','rin','sha',
              'thys','gan','vane','lor','myr','cta','ssos','beth','quin','dar','wyn','osi',
              'thra','lume','vash','ndil','cyne','ther','ral','skia','onyx','vell'];

function makeClusterSet(spec){
  const K = spec.genes.length;
  const set = {
    spec, K,
    gi:  new Int32Array(K), lo: new Float64Array(K), span: new Float64Array(K),
    cent:new Float64Array(MAXLIN*K), acc:new Float64Array(MAXLIN*K),
    pop: new Int32Array(MAXLIN),  prev: new Int32Array(MAXLIN),
    // which cluster this one budded off from, so a family tree can be drawn.
    // -1 means founder. Set once at creation and never rewritten.
    parent: new Int32Array(MAXLIN).fill(-1),
    fname: new Array(MAXLIN).fill(''),
    tree: [],                      // {n,p,t} — survives slot reuse

    alive:new Uint8Array(MAXLIN), born: new Float64Array(MAXLIN),
    hold: new Int32Array(MAXLIN),          // consecutive passes above minPop
    sA:  new Float64Array(MAXLIN), sB: new Float64Array(MAXLIN),
    name:new Array(MAXLIN).fill(''), order: [], n: 0,
    hist:new Float32Array(MAXLIN*LHN), hw: 0, hn: 0,
    vec: new Float64Array(K)
  };
  for (let k = 0; k < K; k++){
    const gi = spec.idx[spec.genes[k]];
    set.gi[k] = gi; set.lo[k] = spec.min[gi];
    set.span[k] = (spec.max[gi]-spec.min[gi]) || 1;
  }
  return set;
}
function linReset(S){
  S.alive.fill(0); S.pop.fill(0); S.prev.fill(0);
  S.name.fill(''); S.n = 0; S.order = []; S.hn = 0; S.hw = 0;
  if (S.hold) S.hold.fill(0);
  // Names were only de-duplicated against LIVE lineages, so a dead cluster's name went back in the pool:  [L51]
  S.used = Object.create(null);
}
function linName(S, a){
  let h = 2166136261;
  for (let k = 0; k < S.K; k++){ h ^= Math.round(S.cent[a*S.K+k]*97); h = Math.imul(h, 16777619); }
  h = h >>> 0;
  let nm = SYL1[h % SYL1.length] + SYL2[(h>>>5) % SYL2.length];
  nm = nm[0].toUpperCase() + nm.slice(1);
  // The base name is a hash of the centroid, so a morph that re-emerges in the same region of gene space keeps its family...  [L52]
  if (!S.used) S.used = Object.create(null);
  let out = nm, q = 2;
  while (S.used[out] || S.name.indexOf(out) >= 0) out = nm + ' ' + (q++);
  S.used[out] = 1;
  return out;
}
function recluster(S){
  const sp = S.spec, G = sp.genome(), hi = sp.hi(), lin = sp.lin(), K = S.K, split = CFG.lineageSplit;
  S.prev.set(S.pop);
  S.pop.fill(0); S.acc.fill(0); S.sA.fill(0); S.sB.fill(0);
  let created = 0, total = 0;
  for (let i = 0; i < hi; i++){
    if (!sp.alive(i)) continue;
    total++;
    const base = i*sp.stride;
    for (let k = 0; k < K; k++) S.vec[k] = (G[base+S.gi[k]] - S.lo[k])/S.span[k];
    let best = -1, bd = 1e9;
    for (let a = 0; a < MAXLIN; a++){
      if (!S.alive[a]) continue;
      let d = 0;
      for (let k = 0; k < K; k++){ const q = S.vec[k]-S.cent[a*K+k]; d += q*q; }
      d = Math.sqrt(d/K);
      if (d < bd){ bd = d; best = a; }
    }
    if ((best < 0 || bd > split) && created === 0){
      let slot = -1;
      for (let a = 0; a < MAXLIN; a++) if (!S.alive[a]){ slot = a; break; }
      if (slot >= 0){
        for (let k = 0; k < K; k++) S.cent[slot*K+k] = S.vec[k];
        // PROVISIONAL. No name, no tree entry, no place in linP until it has held minPop for lineageConfirm consecutive passes.  [L53]
        S.alive[slot] = 1; S.born[slot] = W.tick; S.name[slot] = '';
        S.hold[slot] = 0;
        // nearest CONFIRMED cluster is the parent: this genome budded off it
        S.parent[slot] = best; S.fname[slot] = best >= 0 ? S.name[best] : '';
        best = slot; created = 1;
      }
    }
    // Stickiness. Reassigning from scratch every pass let two nearby centroids in a continuous distribution trade hundreds of members back and forth,...  [L54]
    const cur = lin[i];
    if (created === 0 && cur !== best && cur >= 0 && cur < MAXLIN && S.alive[cur]){
      let dc = 0;
      for (let k = 0; k < K; k++){ const q = S.vec[k]-S.cent[cur*K+k]; dc += q*q; }
      if (Math.sqrt(dc/K) < bd*CFG.linStick) best = cur;
    }
    if (best < 0) continue;
    lin[i] = best; S.pop[best]++;
    for (let k = 0; k < K; k++) S.acc[best*K+k] += S.vec[k];
    S.sA[best] += sp.statA(i); S.sB[best] += sp.statB(i);
  }
  const minPop = Math.max(8, Math.floor(total*CFG.lineageMin));
  for (let a = 0; a < MAXLIN; a++){
    if (!S.alive[a]) continue;
    const q = S.pop[a];
    if (q === 0 || (q < minPop && W.tick - S.born[a] > CFG.lineageEvery)){
      S.alive[a] = 0; S.name[a] = ''; S.hold[a] = 0; S.pop[a] = 0; continue;
    }
    // a provisional cluster earns its name by holding, not by appearing
    if (!S.name[a]){
      S.hold[a] = q >= minPop ? S.hold[a]+1 : 0;
      if (S.hold[a] >= CFG.lineageConfirm){
        S.name[a] = linName(S, a);
        S.tree.push({ n:S.name[a], p:S.fname[a], t:W.tick });
        if (S.tree.length > 240) S.tree.shift();
      }
    }
    for (let k = 0; k < K; k++) S.cent[a*K+k] = S.acc[a*K+k]/q;
    S.sA[a] /= q; S.sB[a] /= q;
  }
  for (let a = 0; a < MAXLIN; a++){
    if (!S.alive[a]) continue;
    for (let b = a+1; b < MAXLIN; b++){
      if (!S.alive[b]) continue;
      let d = 0;
      for (let k = 0; k < K; k++){ const q = S.cent[a*K+k]-S.cent[b*K+k]; d += q*q; }
      if (Math.sqrt(d/K) < split*0.6){
        const keep = S.pop[a] >= S.pop[b] ? a : b, drop = keep === a ? b : a;
        S.pop[keep] += S.pop[drop]; S.alive[drop] = 0; S.name[drop] = ''; S.hold[drop] = 0;
        for (let i = 0; i < hi; i++) if (lin[i] === drop) lin[i] = keep;
        if (drop === a) break;
      }
    }
  }
  for (let i = 0; i < hi; i++){
    if (!sp.alive(i) || S.alive[lin[i]]) continue;
    const base = i*sp.stride;
    for (let k = 0; k < K; k++) S.vec[k] = (G[base+S.gi[k]] - S.lo[k])/S.span[k];
    let best = -1, bd = 1e9;
    for (let a = 0; a < MAXLIN; a++){
      if (!S.alive[a]) continue;
      let d = 0;
      for (let k = 0; k < K; k++){ const q = S.vec[k]-S.cent[a*K+k]; d += q*q; }
      if (d < bd){ bd = d; best = a; }
    }
    if (best >= 0) lin[i] = best;
  }
  for (let a = 0; a < MAXLIN; a++) S.hist[a*LHN + S.hw] = S.pop[a];
  S.hw = (S.hw+1) % LHN; if (S.hn < LHN) S.hn++;
  S.n = 0; S.order = [];
  for (let a = 0; a < MAXLIN; a++) if (S.alive[a] && S.name[a]){ S.n++; S.order.push(a); }
  S.order.sort((x,y) => S.pop[y] - S.pop[x]);
}

const HN = 260;
const HIST = { pop:new Float32Array(HN), anim:new Float32Array(HN), h:new Float32Array(HN), n:0, w:0 };
const ST = { pop:0, seeds:0, gen:0, h:0, eh:0, mass:0, spread:0, en:0, life:0, mut:0, shade:0,
             apop:0, agen:0, amass:0, aspeed:0, aherb:0, asense:0, atough:0 };
function clearHistory(){
  HIST.n = 0; HIST.w = 0;
  W.eaten = 0; W.grown = 0; W.abandons = 0;
  W.corpses = 0; W.aDeadKilled = 0; W.attacks = 0; W.scavenged = 0;
  W.fleshMass = 0; W.carrionMass = 0;
  W.pSeeded = 0; W.pGerm = 0; W.aBorn = 0;
  W.ePhoto = 0; W.ePlant = 0; W.eFlesh = 0; W.eCarrion = 0;
  W.limN = 0; W.limE = 0; W.limM = 0;
  W.eToxin = 0; W.corpseRot = 0; W.pSeedFail = 0;
  W.aUpSum = 0; W.aTicks = 0; W.aFeedTicks = 0;
  W.aDeathAge = 0; W.aDeathN = 0; DAGE.fill(0);
  W.accSum = 0; W.accN = 0; W.pMature = 0; W.pReseed = 0; W.aReseed = 0;
  W.seenA = 0; W.seenN = 0;
  UPK.fill(0); UPKN = 0;
  W.pDeadEat = 0; W.pDeadStarve = 0; W.pDeadAge = 0; W.pDeadSen = 0;
  W.aDeadStarve = 0; W.aDeadAge = 0; W.aDeadSen = 0;
