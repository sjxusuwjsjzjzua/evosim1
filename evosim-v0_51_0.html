}
function collectStats(){
  let n=0,h=0,eh=0,m=0,sp=0,gn=0,lf=0,mu=0,sh=0,en=0;
  for (let i = 0; i < P.hi; i++){
    if (P.stage[i] !== 2) continue;
    const g = i*PGENES;
    n++; h+=P.genome[g+PG.height]; eh+=effHeight(g,P.mass[i]);
    m+=P.mass[i]; sp+=P.genome[g+PG.canopySpread];
    gn+=P.gen[i]; lf+=P.genome[g+PG.lifespan]; mu+=P.genome[g+PG.mutationRate];
    sh+=P.genome[g+PG.shadeTolerance]; en+=P.energy[i];
  }
  const d = n || 1;
  ST.pop=n; ST.seeds=P.seeds; ST.h=h/d; ST.eh=eh/d; ST.mass=m/d; ST.spread=sp/d; ST.en=en/d;
  ST.gen=gn/d; ST.life=lf/d; ST.mut=mu/d; ST.shade=sh/d;
  let an=0,ag=0,am=0,asp=0,ah=0,ase=0;
  for (let i = 0; i < AN.hi; i++){
    // ALIVE only. This counted corpses for thirty versions: s3478 day 391 read
    // 208 animals of which 128 were corpses, on the HUD and in the log alike.
    if (AN.stage[i] !== ALIVE) continue;
    const g = i*AGENES;
    an++; ag+=AN.gen[i]; am+=AN.mass[i];
    asp+=AN.genome[g+AG.maxSpeed]; ah+=AN.genome[g+AG.herbivory]; ase+=AN.genome[g+AG.senseRange];
  }
  const ad = an || 1;
  ST.apop=an; ST.agen=ag/ad; ST.amass=am/ad; ST.aspeed=asp/ad; ST.aherb=ah/ad; ST.asense=ase/ad;
  let tg=0; for (let i = 0; i < P.hi; i++) if (P.stage[i]===2) tg += P.genome[i*PGENES+PG.toughness]*P.defence[i];
  ST.atough = tg/d;
  HIST.pop[HIST.w]=n; HIST.anim[HIST.w]=an; HIST.h[HIST.w]=ST.eh;
  HIST.w=(HIST.w+1)%HN; if (HIST.n < HN) HIST.n++;
  measure();
}

//==========================================================================
// 9. RENDER
//==========================================================================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d', {alpha:false});
let cssW=0, cssH=0, dpr=1, MODE=0, showGraph=true, showLin=true, colourMode=0;
const cam = {x:0, y:0, z:1};
let off=null, octx=null, img=null;

const BUCKETS = 6;
const HCOL = ['#2A4A2A','#356233','#417C36','#55993C','#77B84A','#A3D95F'];
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const HRGB = HCOL.map(hex2rgb), LRGB = LINCOL.map(hex2rgb);
const NB = Math.max(BUCKETS, MAXLIN);
const BUF = [], BUFN = new Int32Array(NB), LITC = new Array(NB).fill('#000');
for (let b = 0; b < NB; b++) BUF.push(new Float32Array(1));
const BUFCAP = 40000;   // per bucket; beyond this the surplus is invisible anyway
function ensureBuffers(){
  const need = Math.min(P.max, BUFCAP)*3;
  for (let b=0;b<NB;b++) if (BUF[b].length < need) BUF[b]=new Float32Array(need);
}

function resizeTileImage(){
  off = document.createElement('canvas'); off.width = off.height = W.n;
  octx = off.getContext('2d'); img = octx.createImageData(W.n, W.n);
}
function resizeCanvas(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cssW = window.innerWidth; cssH = window.innerHeight;
  cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
const minZoom = () => Math.max(cssW, cssH)/W.size;
function resetView(){ cam.x = W.size/2; cam.y = W.size/2; cam.z = minZoom(); }
function wrapCam(){
  cam.x = (cam.x % W.size + W.size) % W.size;
  cam.y = (cam.y % W.size + W.size) % W.size;
}

// ---- RENDER-ONLY lighting. Past ~0.4 sim-days/sec the day/night cycle is a
// strobe rather than information, so blend it toward steady daylight.
let strobe = 0;
function updateStrobe(tpsNow){
  const dps = tpsNow/TPD();
  strobe = clamp((dps - 0.08)/0.22, 0, 1);   // flat once a day takes under ~3s
}
function dispMul(){ return CFG.sunPeak*seasonF()*(sunElev()*(1-strobe) + 0.78*strobe); }
function dispWarm(){
  const e = sunElev()*(1-strobe) + 0.85*strobe;
  return e <= 0 ? 0 : Math.pow(1-e, 2.2);
}
function ambient(){ return 0.13 + 0.87*Math.min(1, dispMul()); }

function buildTileImage(){
  const n = W.n, d = img.data, mul = dispMul(), cap = CFG.nutrientCap;
  const wm = dispWarm();
  const tR = 1 + 0.42*wm, tG = 1 - 0.06*wm, tB = 1 - 0.42*wm;
  for (let y = 0; y < n; y++){
    const lf = W.latF[y];
    for (let x = 0; x < n; x++){
      const i = y*n+x, o = i*4;
      const L = W.lightBase[i]*lf*mul, N = Math.min(1.6, W.nutrient[i]/cap);
      let r,g,b;
      if (MODE === 0){
        const s = 0.10 + 0.90*Math.min(1.25, L);
        const A2 = W.arid[i], E = W.elev[i];
        // dark loam -> pale sand with dryness -> grey rock with altitude,
        // then a hillshade from the west slope so ranges read as ranges
        let br = 22+58*N, bg = 19+70*N, bb = 14+38*N;
        br += (172-br)*A2*0.80; bg += (146-bg)*A2*0.80; bb += (100-bb)*A2*0.80;
        const rock = clamp((E-CFG.foothill)/(1-CFG.foothill), 0, 1);
        br += (124-br)*rock*0.88; bg += (122-bg)*rock*0.88; bb += (126-bb)*rock*0.88;
        if (E > CFG.peakElev){
          const sn = Math.min(1, (E-CFG.peakElev)/0.12);
          br += (222-br)*sn; bg += (228-bg)*sn; bb += (236-bb)*sn;
        }
        const wI = y*n + (x === 0 ? n-1 : x-1);
        const sh = clamp(1 + (E - W.elev[wI])*3.2, 0.72, 1.30);
        r = (9 + br*s*sh)*tR; g = (13 + bg*s*sh)*tG; b = (19 + bb*s*sh)*tB;
        r += 4*(1-s); g += 7*(1-s); b += 16*(1-s);
      } else if (MODE === 1){
        const v = Math.min(1.3, L);
        r = 8+246*Math.pow(v,0.85); g = 12+228*Math.pow(v,1.0); b = 26+146*Math.pow(v,1.6);
      } else if (MODE === 2){
        r = 18+74*N; g = 16+128*N; b = 12+52*N;
      } else if (MODE === 3){
        const D = Math.min(1, W.detritus[i]/0.4);
        r = 16+124*D; g = 14+84*D; b = 12+36*D;
      } else {
        const E = W.elev[i];
        const rock = clamp((E-CFG.foothill)/(1-CFG.foothill), 0, 1);
        r = 20 + 200*rock + (E > CFG.peakElev ? 35 : 0);
        g = 26 + 190*rock + (E > CFG.peakElev ? 40 : 0);
        b = 30 + 170*rock + (E > CFG.peakElev ? 55 : 0);
        if (E <= CFG.foothill){ const f = W.fert[i]; r = 18+30*f; g = 24+86*f; b = 22+34*f; }
      }
      d[o]=r; d[o+1]=g; d[o+2]=b; d[o+3]=255;
    }
  }
  octx.putImageData(img, 0, 0);
}

function litColours(){
  const a = ambient(), wm = dispWarm();
  const tR = 1 + 0.30*wm, tG = 1 - 0.04*wm, tB = 1 - 0.30*wm;
  const src = colourMode === 1 ? LRGB : HRGB, nb = colourMode === 1 ? MAXLIN : BUCKETS;
  for (let b = 0; b < nb; b++){
    const c = src[b];
    const r = Math.min(255, c[0]*a*tR + 6*(1-a));
    const g = Math.min(255, c[1]*a*tG + 10*(1-a));
    const bl= Math.min(255, c[2]*a*tB + 22*(1-a));
    LITC[b] = 'rgb('+(r|0)+','+(g|0)+','+(bl|0)+')';
  }
}

// TILE-CULLED. This used to scan every slot up to P.hi once per wrap copy per
// frame, doing two sqrt and a plantShade for each live plant whether or not it
// was anywhere near the viewport. PIDX already buckets live plants by tile, and
// each wrap copy maps the world rect onto the screen exactly once, so the
// visible tile range is a clamp — no modulo, no wrap logic. Plants that
// germinated since the last canopy rebuild are missing from PIDX for up to
// plantStagger ticks and simply do not draw for that long. Cosmetic. [L47-6]
function drawPlants(offs){
  ensureBuffers(); BUFN.fill(0); litColours();
  const z = cam.z, M = P.hi, G = P.genome, pad = 24;
  const nb = colourMode === 1 ? MAXLIN : BUCKETS;
  const n = W.n, ts = W.tileSize;
  if (PIDX.start) for (let k = 0; k < offs.length; k += 2){
    const ox = offs[k], oy = offs[k+1];
    let tx0 = ((-pad-ox)/z/ts)|0, tx1 = ((cssW+pad-ox)/z/ts)|0;
    let ty0 = ((-pad-oy)/z/ts)|0, ty1 = ((cssH+pad-oy)/z/ts)|0;
    if (tx0 < 0) tx0 = 0;  if (ty0 < 0) ty0 = 0;
    if (tx1 > n-1) tx1 = n-1;  if (ty1 > n-1) ty1 = n-1;
    for (let ty = ty0; ty <= ty1; ty++){
      const row = ty*n;
      for (let tx = tx0; tx <= tx1; tx++){
        const t = row+tx;
        for (let q = PIDX.start[t]; q < PIDX.start[t+1]; q++){
          const i = PIDX.items[q];
          if (P.stage[i] !== 2) continue;
          if (selKind === 'plant' && P.lin[i] !== selLin) continue;
          const g = i*PGENES;
          let b;
          if (colourMode === 1) b = P.lin[i] % MAXLIN;
          else { b = (plantShade(i, g)*BUCKETS)|0; if (b >= BUCKETS) b = BUCKETS-1; if (b < 0) b = 0; }
          const sx = ox + P.x[i]*z, sy = oy + P.y[i]*z;
          if (sx < -pad || sy < -pad || sx > cssW+pad || sy > cssH+pad) continue;
          const r = Math.max(0.55, Math.sqrt((P.leaf[i] || leafArea(g, P.mass[i]))/Math.PI)*z);
          const buf = BUF[b], w = BUFN[b];
          if (w+3 <= buf.length){ buf[w]=sx; buf[w+1]=sy; buf[w+2]=r; BUFN[b]=w+3; }
        }
      }
    }
  }
  for (let b = 0; b < nb; b++){
    const cnt = BUFN[b]; if (!cnt) continue;
    ctx.fillStyle = LITC[b];
    const buf = BUF[b];
    ctx.beginPath();
    for (let k = 0; k < cnt; k += 3){
      const x = buf[k], y = buf[k+1], r = buf[k+2];
      if (r > 1.6){ ctx.moveTo(x+r, y); ctx.arc(x, y, r, 0, 6.28318); }
      else ctx.rect(x-r, y-r, r*2, r*2);
    }
    ctx.fill();
  }
  if (z > 0.6){
    ctx.fillStyle = 'rgba(214,190,120,'+(0.25+0.35*ambient()).toFixed(2)+')';
    ctx.beginPath();
    for (let i = 0; i < M; i++){
      if (P.stage[i] !== 1) continue;
      const px = P.x[i]*z, py = P.y[i]*z;
      for (let k = 0; k < offs.length; k += 2){
        const sx = offs[k]+px, sy = offs[k+1]+py;
        if (sx < 0 || sy < 0 || sx > cssW || sy > cssH) continue;
        ctx.rect(sx-0.8, sy-0.8, 1.6, 1.6);
      }
    }
    ctx.fill();
  }
}

// Trophic colouring, ready for phase 4: green herbivore through to red carnivore.  [L55]
function drawCorpse(i, z, amb, pad, offs){
  const r = Math.max(1.1, Math.pow(AN.mass[i], 0.34)*0.8*z);
  const px = AN.x[i]*z, py = AN.y[i]*z;
  ctx.fillStyle = 'rgb('+((110*amb+18)|0)+','+((96*amb+16)|0)+','+((86*amb+20)|0)+')';
  for (let k = 0; k < offs.length; k += 2){
    const sx = offs[k]+px, sy = offs[k+1]+py;
    if (sx < -pad || sy < -pad || sx > cssW+pad || sy > cssH+pad) continue;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.2832); ctx.fill();
  }
}
function drawAnimals(offs){
  if (!AN.hi) return;
  const z = cam.z, G = AN.genome, amb = ambient(), pad = 20;
  for (let i = 0; i < AN.hi; i++){
    if (!AN.stage[i]) continue;
    if (AN.stage[i] === CORPSE){ drawCorpse(i, z, amb, pad, offs); continue; }
    if (selKind === 'animal' && AN.lin[i] !== selLin) continue;
    const g = i*AGENES;
    const r = Math.max(1.2, Math.pow(AN.mass[i], 0.34)*0.9*z);
    const px = AN.x[i]*z, py = AN.y[i]*z;
    let cr, cg, cb;
    if (colourMode === 1){
      const c = LRGB[AN.lin[i] % MAXLIN];
      cr = c[0]*amb + 12; cg = c[1]*amb + 10; cb = c[2]*amb + 16;
    } else {
      // one ramp, different question: green end low, ember end high
      let u;
      if (colourMode === 2) u = Math.min(1, Math.sqrt(AN.mass[i]/26));
      else if (colourMode === 4) u = Math.min(1, G[g+AG.armour]);
      else if (colourMode === 0) u = Math.min(1, G[g+AG.maxSpeed]/3);
      else u = G[g+AG.carnivory];
      cr = (150 + 90*u)*amb + 12; cg = (140 - 70*u)*amb + 10; cb = (70 - 40*u)*amb + 16;
    }
    ctx.fillStyle = 'rgb('+(cr|0)+','+(cg|0)+','+(cb|0)+')';
    for (let k = 0; k < offs.length; k += 2){
      const sx = offs[k]+px, sy = offs[k+1]+py;
      if (sx < -pad || sy < -pad || sx > cssW+pad || sy > cssH+pad) continue;
      ctx.beginPath();
      if (r > 2.2){
        const h = AN.hd[i], nx = Math.cos(h)*r*1.7, ny = Math.sin(h)*r*1.7;
        ctx.moveTo(sx+nx, sy+ny);
        ctx.lineTo(sx - nx*0.5 - ny*0.7, sy - ny*0.5 + nx*0.7);
        ctx.lineTo(sx - nx*0.5 + ny*0.7, sy - ny*0.5 - nx*0.7);
        ctx.closePath();
      } else ctx.rect(sx-r, sy-r, r*2, r*2);
      ctx.fill();
    }
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function panel(x,y,w,h){
  ctx.fillStyle = 'rgba(10,16,20,.90)'; roundRect(x,y,w,h,9); ctx.fill();
  ctx.strokeStyle = 'rgba(38,55,63,.9)'; ctx.lineWidth = 1;
  roundRect(x+.5,y+.5,w-1,h-1,9); ctx.stroke();
}
// Compact at-a-glance overlay: top lineages of both kingdoms, with a share bar
// and a trend arrow. The full inspectable view is the Life drawer.
function drawLineagePanel(){
  if (!showLin || !PLIN) return;
  const blocks = [];
  if (PLIN.n) blocks.push(PLIN);
  if (ALIN.n) blocks.push(ALIN);
  if (!blocks.length) return;
  const w = 232, rh = 15, hd = 15;
  let h = 6;
  for (const S of blocks) h += hd + Math.min(4, S.order.length)*rh + 3;
  const x0 = 10, y0 = (document.getElementById('hud').offsetHeight || 110) + 10;
  panel(x0, y0, w, h);
  ctx.textBaseline = 'middle';
  let y = y0 + 12;
  for (const S of blocks){
    ctx.font = '600 8px system-ui,-apple-system,sans-serif';
    ctx.fillStyle = '#61757E';
    ctx.fillText(S.spec.label + '  ·  ' + S.n + ' lineage' + (S.n===1?'':'s'), x0+11, y);
    y += hd;
    const top = Math.max(1, S.pop[S.order[0]]);
    for (let r = 0; r < Math.min(4, S.order.length); r++){
      const a = S.order[r];
      const isSel = (selKind === S.spec.short && selLin === a);
      if (isSel){ ctx.fillStyle = 'rgba(127,194,74,.10)'; ctx.fillRect(x0+5, y-7, w-10, 14); }
      ctx.fillStyle = 'rgba(255,255,255,.04)';
      ctx.fillRect(x0+8, y-6, (w-20)*S.pop[a]/top, 12);
      ctx.fillStyle = LINCOL[a]; roundRect(x0+9, y-3.5, 7, 7, 1.5); ctx.fill();
      ctx.font = '10px ui-monospace,monospace';
      ctx.fillStyle = isSel ? '#FFFFFF' : '#DCE6E2';
      ctx.fillText(S.name[a], x0+22, y);
      ctx.fillStyle = '#8a99a1'; ctx.textAlign = 'right';
      ctx.fillText(String(S.pop[a]), x0+124, y); ctx.textAlign = 'left';
      const d = S.pop[a] - S.prev[a];
      ctx.fillStyle = d > 0 ? '#7FC24A' : d < 0 ? '#D9704A' : '#4a5a63';
      ctx.fillText(d > 0 ? '▲' : d < 0 ? '▼' : '·', x0+129, y);
      ctx.fillStyle = '#61757E';
      ctx.fillText(S.sA[a].toFixed(2).padStart(6), x0+143, y);
      ctx.fillText(S.sB[a].toFixed(2).padStart(6), x0+186, y);
      y += rh;
    }
    y += 3;
  }
  ctx.textBaseline = 'alphabetic';
}

function drawGraph(){
  if (!showGraph || HIST.n < 2) return;
  const w = 148, h = 60, x0 = 10, y0 = cssH - h - 120;
  panel(x0, y0, w, h);
  const ix = x0+8, iy = y0+16, iw = w-16, ih = h-24;
  ctx.strokeStyle = 'rgba(38,55,63,.55)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let k = 1; k < 3; k++){ const y = iy + ih*k/3; ctx.moveTo(ix, y); ctx.lineTo(ix+iw, y); }
  ctx.stroke();
  let pm = 1, hm = 0;
  for (let k = 0; k < HIST.n; k++){
    const idx = (HIST.w-HIST.n+k+HN)%HN;
    if (HIST.pop[idx] > pm) pm = HIST.pop[idx];
    if (HIST.h[idx] > hm) hm = HIST.h[idx];
  }
  const hTop = Math.max(0.05, hm*1.3);   // autoscale — height is small but is the test
  const path = (arr, lo, hi) => {
    const span = (hi-lo)||1;
    ctx.beginPath();
    for (let k = 0; k < HIST.n; k++){
      const idx = (HIST.w-HIST.n+k+HN)%HN;
      const x = ix + iw*k/(HIST.n-1);
      const y = iy + ih - ih*clamp((arr[idx]-lo)/span, 0, 1);
      k ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
  };
  path(HIST.pop, 0, pm); ctx.strokeStyle = 'rgba(111,163,196,.85)'; ctx.lineWidth = 1.2; ctx.stroke();
  let am = 1;
  for (let k = 0; k < HIST.n; k++){ const ix2=(HIST.w-HIST.n+k+HN)%HN; if (HIST.anim[ix2] > am) am = HIST.anim[ix2]; }
  path(HIST.anim, 0, am); ctx.strokeStyle = 'rgba(217,112,74,.9)'; ctx.lineWidth = 1.2; ctx.stroke();
  path(HIST.h, 0, hTop);
  ctx.lineTo(ix+iw, iy+ih); ctx.lineTo(ix, iy+ih); ctx.closePath();
  ctx.fillStyle = 'rgba(127,194,74,.13)'; ctx.fill();
  path(HIST.h, 0, hTop); ctx.strokeStyle = '#7FC24A'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.font = '600 8px system-ui,-apple-system,sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#6FA3C4'; ctx.fillText('PLANTS '+ST.pop, ix, y0+9);
  ctx.textAlign = 'center'; ctx.fillStyle = '#D9704A';
  ctx.fillText('GRAZERS '+ST.apop, ix+iw*0.5, y0+9);
  ctx.textAlign = 'right'; ctx.fillStyle = '#7FC24A';
  ctx.fillText('H '+ST.eh.toFixed(3), ix+iw, y0+9);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
function render(){
  buildTileImage();
  ctx.fillStyle = '#05080B'; ctx.fillRect(0,0,cssW,cssH);
  ctx.imageSmoothingEnabled = false;
  const z = cam.z, S = W.size, span = S*z;
  const ox = cssW/2 - cam.x*z, oy = cssH/2 - cam.y*z;
  const kx0 = Math.floor(-ox/span), kx1 = Math.floor((cssW-ox)/span);
  const ky0 = Math.floor(-oy/span), ky1 = Math.floor((cssH-oy)/span);
  const dw = Math.ceil(span)+1;
  const offs = [];
  for (let ky = ky0; ky <= ky1; ky++)
    for (let kx = kx0; kx <= kx1; kx++){
      ctx.drawImage(off, Math.round(ox+kx*span), Math.round(oy+ky*span), dw, dw);
      offs.push(ox+kx*span, oy+ky*span);
    }
  if (selKind){                       // selection filters, it does not delete
    const keep = selKind; selKind = null;
    ctx.globalAlpha = 0.18; drawPlants(offs); drawAnimals(offs); ctx.globalAlpha = 1;
    selKind = keep;
  }
  drawPlants(offs);
  drawAnimals(offs);
  drawLineagePanel();
  drawGraph();
}

//==========================================================================
// 10. INPUT
//==========================================================================
const ptrs = new Map(); let pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now()});
  pinch = null;
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const px = p.x, py = p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1){
    cam.x -= (e.clientX-px)/cam.z; cam.y -= (e.clientY-py)/cam.z; wrapCam();
  } else if (ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    if (pinch && pinch.d > 0){
      zoomAt(mx, my, cam.z*d/pinch.d);
      cam.x -= (mx-pinch.mx)/cam.z; cam.y -= (my-pinch.my)/cam.z; wrapCam();
    }
    pinch = {d,mx,my};
  }
});
function endPtr(e){
  const p = ptrs.get(e.pointerId);
  if (p && ptrs.size === 1 && performance.now()-p.t < 400 &&
      Math.hypot(p.x-p.x0, p.y-p.y0) < 8) probe(p.x, p.y);
  ptrs.delete(e.pointerId); pinch = null;
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => {
  e.preventDefault(); zoomAt(e.clientX, e.clientY, cam.z*Math.exp(-e.deltaY*0.0015));
}, {passive:false});
function zoomAt(sx, sy, nz){
  nz = clamp(nz, minZoom(), 14);
  const wx = cam.x + (sx-cssW/2)/cam.z, wy = cam.y + (sy-cssH/2)/cam.z;
  cam.z = nz;
  cam.x = wx - (sx-cssW/2)/cam.z; cam.y = wy - (sy-cssH/2)/cam.z;
  wrapCam();
}
let probeTile = null, probePlant = -1, probeAnimal = -1;
function probe(sx, sy){
  let wx = cam.x + (sx-cssW/2)/cam.z, wy = cam.y + (sy-cssH/2)/cam.z;
  wx = (wx % W.size + W.size) % W.size; wy = (wy % W.size + W.size) % W.size;
  probeTile = tileOf(wx, wy);
  let best = -1, bd = 64/(cam.z*cam.z) + 16;
  for (let i = 0; i < P.hi; i++){
    if (P.stage[i] !== 2) continue;
    let dx = P.x[i]-wx, dy = P.y[i]-wy;
    dx -= W.size*Math.round(dx/W.size); dy -= W.size*Math.round(dy/W.size);
    const d = dx*dx+dy*dy;
    if (d < bd){ bd = d; best = i; }
  }
  probePlant = best;
  // animals are picked on their own radius; a grazer standing on a plant was
  // previously uninspectable because only the plant was ever tested
  let ba = -1, bda = 64/(cam.z*cam.z) + 20;
  for (let i = 0; i < AN.hi; i++){
    if (!AN.stage[i]) continue;
    let dx = AN.x[i]-wx, dy = AN.y[i]-wy;
    dx -= W.size*Math.round(dx/W.size); dy -= W.size*Math.round(dy/W.size);
    const d = dx*dx+dy*dy;
    if (d < bda){ bda = d; ba = i; }
  }
  probeAnimal = ba;
}

function kingdomMean(sp, gi){
  const G = sp.genome(), hi = sp.hi();
  let n = 0, sum = 0;
  for (let i = 0; i < hi; i++) if (sp.alive(i)){ n++; sum += G[i*sp.stride+gi]; }
  return n ? sum/n : 0;
}
// A lineage described in words. Built from the cluster centroid against the kingdom mean, so it says what makes THIS lineage different, not what...  [L56]
function linTrait(v, mean, lo, hi){
  if (mean > 0 && v > mean*1.3) return hi;
  if (mean > 0 && v < mean*0.75) return lo;
  return null;
}
function linGene(S, a, name){
  const sp = S.spec, gi = sp.idx[name];
  if (gi === undefined) return null;
  const lo = sp.min[gi], span = (sp.max[gi]-lo) || 1;
  for (let k = 0; k < S.K; k++) if (S.gi[k] === gi) return S.cent[a*S.K+k]*span + lo;
  return kingdomMean(sp, gi);
}
function describeLin(S, a){
  if (!S || a < 0 || !S.alive[a]) return '';
  const sp = S.spec, w = [], G = (n) => linGene(S, a, n), M = (n) => kingdomMean(sp, sp.idx[n]);
  if (sp.short === 'animal'){
    const c = G('carnivory'), h = G('herbivory');
    w.push(c === null ? 'unknown diet'
      : c < 0.15 ? 'herbivore' : c < 0.4 ? 'mostly herbivorous'
      : c < 0.6 ? 'omnivore'  : c < 0.85 ? 'mostly carnivorous' : 'carnivore');
    const add = (n, lo, hi) => { const t = linTrait(G(n), M(n), lo, hi); if (t) w.push(t); };
    add('size','small','large'); add('maxSpeed','slow','fast');
    add('senseRange','short-sighted','keen-sensed'); add('armour',null,'armoured');
    add('aggression','timid','aggressive'); add('offspringCount','few young','prolific');
  } else {
    const add = (n, lo, hi) => { const t = linTrait(G(n), M(n), lo, hi); if (t) w.push(t); };
    add('height','low-growing','tall'); add('maxMass','slight','massive');
    add('toxicity',null,'toxic'); add('toughness',null,'tough');
    add('seedCount','few-seeded','prolific'); add('shadeTolerance',null,'shade-tolerant');
    add('regrowthRate',null,'fast-regrowing');
    if (!w.length) w.push('unremarkable');
  }
  return w.filter(Boolean).slice(0, 5).join(', ');
}
// Ancestry is walked over the persistent tree log, not over cluster slots,
// because slots get recycled and would otherwise rewrite history.
function ancestryOf(S, a){
  const chain = [];
  let nm = S.fname[a], guard = 0;
  while (nm && guard++ < 12){
    chain.push(nm);
    const rec = S.tree.find(r => r.n === nm);
    nm = rec ? rec.p : '';
  }
  return chain;
}

          let val = null;
          for (let k = 0; k < S.K; k++) if (S.gi[k] === gi) val = S.cent[a*S.K+k]*span + lo;

const CARNBINS = 12;
const CARNHIST = new Int32Array(CARNBINS);
const DAGEBINS = 8;

const HGTBINS = 12;

const LOG = { every:480, n:0, col:null, gene:[], geneEvery:20, geneCap:64, k:0,

function logReset(){

function logSample(){

  }

  // searching as plants get scarce, so it has to be measurable.
  let aG = 0, aW = 0, aA = 0, aR = 0, aE = 0, na = 0, aRe = 0, aRt = 0;
  let aAt = 0, aSc = 0, aFl = 0, aCarn = 0, carnMax = 0, ncorpse = 0, cmass = 0, aHerbG = 0;
  let aAgeS = 0, gutS = 0, aSizeS = 0, aTrS = 0, aJuv = 0, aMat = 0, aElevS = 0, aClimbS = 0;

    aAgeS += AN.age[i]; gutS += AN.gut[i]; MASSA.push(AN.mass[i]);
    aSizeS += AN.genome[i*AGENES+AG.size]; aTrS += AN.genome[i*AGENES+AG.toxinResistance];
    aElevS += W.elev[AN.tile[i]]; aClimbS += AN.genome[i*AGENES+AG.climbing];
    { const gg = i*AGENES;
      if (AN.age[i] < AN.genome[gg+AG.maturityAge]
          || AN.mass[i] < CFG.maturityMassFrac*AN.genome[gg+AG.size]) aJuv++; else aMat++; }
    const a = AN.act[i];
    if (a === ACT_GRAZE) aG++; else if (a === ACT_WANDER) aW++;
    else if (a === ACT_APPROACH) aA++; else if (a === ACT_ATTACK) aAt++;
    else if (a === ACT_SCAVENGE) aSc++; else if (a === ACT_FLEE) aFl++; else aR++;

  // cost — the direct read on whether provisioning is viable
  let seedES = 0, nsd = 0;

  for (let i = 0; i < P.hi; i++){
    if (P.stage[i] !== 2) continue;
    npl++; pAgeS += P.age[i]; MASSP.push(P.mass[i]);
    pFertS += W.fert[P.tile[i]]; pElevS += W.elev[P.tile[i]];
    // REALIZED defence, not the gene: what the plant actually paid for
    pToxS += P.genome[i*PGENES+PG.toxicity]*P.defence[i];
    pFibS += P.genome[i*PGENES+PG.fibre]*P.defence[i];
    // adults carry the canopy; the seedling churn is four times the count and none of the leaf area, and reading them as one...  [L60]
    const gpm = i*PGENES;

        Math.min(P.genome[gpm+PG.maturityMass], P.genome[gpm+PG.maxMass]))) nAdult++;
    const eh = effHeight(i*PGENES, P.mass[i]);
    if (medR > 0 && eh > medR) esc++;
    if (medR > 0){ const m = P.mass[i]; totM += m; lockM += m*(1 - accessOf(i, medR)); }

  const pq = q => MASSP.length ? MASSP[Math.min(MASSP.length-1,(q*MASSP.length)|0)] : 0;
  const aq = q => MASSA.length ? MASSA[Math.min(MASSA.length-1,(q*MASSA.length)|0)] : 0;
  const v = [W.tick, ST.pop, ST.seeds, ST.apop, W.lai, W.matter, W.soilSum, W.detSum,
             W.bioSum, ST.mass, ST.gen, ST.eh, ST.atough, ST.amass, ST.agen, ST.aspeed,
             ST.aherb, ST.asense, W.eaten, W.grown, caps,
             PLIN ? PLIN.n : 0, ALIN ? ALIN.n : 0,
             aG, aW, aA, aR, W.abandons,
             W.pDeadEat, W.pDeadStarve, W.pDeadAge, W.aDeadStarve, W.aDeadAge,
             na ? aE/na : 0, na ? aRe/na : 0, npl ? esc/npl : 0, na ? aRt/na : 0,
             aAt, aSc, aFl, ncorpse, cmass,
             W.attacks, W.scavenged, W.aDeadKilled, na ? aCarn/na : 0, carnMax,
             W.fleshMass, W.carrionMass, na ? aHerbG/na : 0,
             W.pSeeded, W.pGerm, W.aBorn,
             W.ePhoto, W.ePlant, W.eFlesh, W.eCarrion,
             W.limN, W.limE, W.limM,
             npl ? pAgeS/npl/TPD() : 0, na ? aAgeS/na/TPD() : 0, gutS,
             pq(0.10), pq(0.50), pq(0.90), aq(0.50), aq(0.90),
             W.eToxin, W.corpseRot,
             npl ? pToxS/npl : 0, npl ? pFibS/npl : 0,
             na ? aSizeS/na : 0, na ? aTrS/na : 0,
             W.pSeedFail, nsd ? seedES/nsd : 0,
             W.aTicks ? W.aUpSum/W.aTicks : 0,
             W.aTicks ? W.aFeedTicks/W.aTicks : 0,
             W.aDeathN ? W.aDeathAge/W.aDeathN/TPD() : 0,
             na ? aJuv/na : 0, aMat,
             W.habFrac, npl ? pFertS/npl : 0, npl ? pElevS/npl : 0,
             na ? aElevS/na : 0, na ? aClimbS/na : 0,
             nAdult,
             W.habFrac ? W.occTiles/(W.habFrac*W.n*W.n) : 0,
             W.occTiles ? npl/W.occTiles : 0,
             W.pMature, W.accN ? W.accSum/W.accN : 0, W.pDeadSen,
             W.pReseed, W.aReseed,
             W.seenN ? W.seenA/W.seenN : 0,

  W.aUpSum = 0; W.aTicks = 0; W.aFeedTicks = 0;
  W.aDeathAge = 0; W.aDeathN = 0; W.accSum = 0; W.accN = 0;
  W.seenA = 0; W.seenN = 0;
  if ((LOG.k % LOG.linEvery) === 0) logLineages();
  if (caps && !LOG.capSeen){ LOG.capSeen = caps; logEvent('cap-binds', {caps:caps}); }
  if (!ST.pop && LOG.hadPlants && !LOG.pGone){ LOG.pGone = 1; logEvent('plants-extinct'); }
  if (!ST.apop && LOG.hadAnimals && !LOG.aGone){
    LOG.aGone = 1; LOG.aGoneTick = W.tick; logEvent('animals-extinct');
  }

  // at day ~3900 — half the run producing nothing. If the fauna has been gone
  // for haltAfterDays with no reseed, stop. [L43-1] The `!CFG.animalReseedDays`

// Per-gene mean, spread and bound-occupancy. Occupancy at a bound with no spread is the pinning failure of section 6.1, and it is only visible here.  [L62]
function selRow(A, act, baseMean){
  const out = [];
  for (let k = 0; k < act; k++)
    out.push(A.n ? +(A.acc[k]/A.n - baseMean[k]).toFixed(6) : 0);
  return { n:A.n*8, s:out };      // n scaled back up: 1 birth in 8 is sampled
}
function geneRow(isP){
  const G = isP ? P.genome : AN.genome, st = isP ? P.stage : AN.stage;
  const hi = isP ? P.hi : AN.hi, stride = isP ? PGENES : AGENES;
  const act = isP ? P_ACTIVE : A_ACTIVE;
  const MN = isP ? PMIN : AMIN, MX = isP ? PMAX : AMAX;
  const mean = new Float64Array(act), sq = new Float64Array(act);
  const atMin = new Float64Array(act), atMax = new Float64Array(act);
  // A SECOND MEAN OVER MATURE INDIVIDUALS ONLY. `sel` is parents minus a baseline;  [L63]
  const mmean = new Float64Array(act);
  let n = 0, nMat = 0;
  for (let i = 0; i < hi; i++){
    if (isP ? P.stage[i] !== 2 : !st[i]) continue;
    n++;
    const base = i*stride;
    const mature = isP ? P.mass[i] >= G[base+PG.maturityMass]
                       : (AN.age[i] >= G[base+AG.maturityAge]
                          && AN.mass[i] >= CFG.maturityMassFrac*G[base+AG.size]);
    if (mature) nMat++;
    for (let k = 0; k < act; k++){
      const v = G[base+k], span = (MX[k]-MN[k]) || 1;
      mean[k] += v; sq[k] += v*v;
      if (mature) mmean[k] += v;
      if (v > MN[k] + span*0.97) atMax[k]++;
      if (v < MN[k] + span*0.03) atMin[k]++;
    }
  }

  const r5 = x => +x.toFixed(5);

  for (let k = 0; k < act; k++){
    const m = mean[k]/d;
    om.push(r5(m));
    omm.push(r5(nMat ? mmean[k]/dm : m));
    os.push(r5(Math.sqrt(Math.max(0, sq[k]/d - m*m))));
    oa.push(r5(atMin[k]/d));
    ob.push(r5(atMax[k]/d));
  }
  const A = isP ? SELP : SELA;
  const sel = selRow(A, act, omm);           // baseline is the MATURE pool
  if (A.acc){ A.acc.fill(0); A.n = 0; }     // window, not cumulative
  return { n:n, nMature:nMat, mean:om, matureMean:omm,
           sd:os, atMin:oa, atMax:ob, selN:sel.n, sel:sel.s };
}
function logGenes(){
  if (LOG.gene.length >= LOG.geneCap){
    const keep = [];
    for (let i = 0; i < LOG.gene.length; i += 2) keep.push(LOG.gene[i]);
    LOG.gene = keep; LOG.geneEvery *= 2;
  }
  LOG.gene.push({ t:W.tick, plant:geneRow(true), animal:geneRow(false) });
  LOG.carn.push({ t:W.tick, bins:Array.from(CARNHIST) });
  LOG.hgt.push({ t:W.tick, bins:Array.from(HGTHIST) });
  LOG.dage.push({ t:W.tick, bins:Array.from(DAGE) }); DAGE.fill(0);
  // upkeep composition, averaged over the sampled plants since the last snapshot
  const un = UPKN || 1;
  LOG.upk.push({ t:W.tick, n:UPKN, terms:{
    base:+(UPK[0]/un).toFixed(6), mass:+(UPK[1]/un).toFixed(6),
    leaf:+(UPK[2]/un).toFixed(6), height:+(UPK[3]/un).toFixed(6),
    root:+(UPK[4]/un).toFixed(6), regrow:+(UPK[5]/un).toFixed(6),
    photoCost:+(UPK[6]/un).toFixed(6), longevity:+(UPK[7]/un).toFixed(6),
    gain:+(UPK[8]/un).toFixed(6) } });
  UPK.fill(0); UPKN = 0;
}

// Named lineage tracks and discrete events. The lineage panel names clusters from a hash of their centroid, so the same...  [L64]
function logLineages(){
  if (LOG.lin.length >= LOG.linCap){
    const keep = [];
    for (let i = 0; i < LOG.lin.length; i += 2) keep.push(LOG.lin[i]);
    LOG.lin = keep; LOG.linEvery *= 2;
  }
  const row = { t:W.tick, p:[], a:[] };
  for (const [set, key, seen, kind] of [[PLIN,'p',LOG.seenP,'plant'],
                                        [ALIN,'a',LOG.seenA,'animal']]){
    if (!set) continue;
    let kpop = 0;
    for (let c = 0; c < MAXLIN; c++) if (set.alive[c]) kpop += set.pop[c];
    for (let c = 0; c < MAXLIN; c++){
      if (!set.alive[c]) continue;
      // the centroid genes too, so a lineage's character and its drift over
      // time can be read straight off the log instead of inferred from means
      const cg = [];
      for (let k = 0; k < set.K; k++){
        const gi2 = set.gi[k], lo2 = set.spec.min[gi2];
        const sp2 = (set.spec.max[gi2] - lo2) || 1;
        cg.push(+(set.cent[c*set.K+k]*sp2 + lo2).toFixed(4));
      }
      row[key].push([set.name[c], set.pop[c], set.fname[c], cg]);
      // A single outlier that the clusterer named for two passes is not a
      // lineage. Require a real share of the kingdom, three samples running.
      const share = set.pop[c]/Math.max(1, kpop);
      const nm2 = set.name[c];
      if (share < 0.01){ if (seen[nm2] === undefined) seen[nm2] = 0; continue; }
      if (seen[nm2] === undefined || seen[nm2] === 0){ seen[nm2] = -2; continue; }
      if (seen[nm2] === -2){ seen[nm2] = -3; continue; }
      if (seen[nm2] === -3){
        seen[nm2] = W.tick;
        LOG.events.push({ t:W.tick, e:'lineage-appears', kind:kind, name:nm2 });
      }
    }
    for (const nm in seen){
      // <=0 means never announced (provisional, or already ended)
      if (seen[nm] <= 0) continue;
      let live = false;
      for (let c = 0; c < MAXLIN; c++) if (set.alive[c] && set.name[c] === nm) live = true;
      if (!live){ LOG.events.push({ t:W.tick, e:'lineage-ends', kind:kind, name:nm }); seen[nm] = -1; }
    }
  }
  LOG.lin.push(row);
}
function logEvent(e, extra){
  LOG.events.push(Object.assign({ t:W.tick, e:e }, extra || {}));
}

function geneNames(map){ const a = []; for (const k in map) a[map[k]] = k; return a; }

// CFG PATCH — the whole point of v0.37. A tuning iteration is now a 2KB file, not a 177KB rebuild of the app.  [L65]
const CFG0 = Object.assign({}, CFG);
function saveCfg(){
  const patch = {};
  for (const k in CFG) if (CFG[k] !== CFG0[k]) patch[k] = CFG[k];
  download({ kind:'evosim-cfg', formatVersion:FORMAT_VERSION, version:VERSION,
             base:VERSION, cfg:patch },
           `evosim-cfg-${Object.keys(patch).length}k.json`);

// FOUNDER POOL — a sample of the standing genomes, so the next run can start from evolved genetics instead of re-deriving basic viability from START.  [L66]
function poolOf(count, hi, stride, active, alive, genome){
  const out = [];
  let seen = 0;
  for (let i = 0; i < hi; i++){
    if (!alive(i)) continue;
    const row = () => { const r = new Array(active);
      for (let j = 0; j < active; j++) r[j] = +genome[i*stride+j].toFixed(5); return r; };
    if (out.length < count) out.push(row());
    else { const r = (rng()*(seen+1))|0; if (r < count) out[r] = row(); }
    seen++;
  }
  return out;
}
function savePool(){
  const n = CFG.poolSize|0;
  const plant  = poolOf(n, P.hi, PGENES, P_ACTIVE, i => P.stage[i] === 2, P.genome);
  const animal = poolOf(n, AN.hi, AGENES, A_ACTIVE, i => AN.stage[i] === ALIVE, AN.genome);
  download({ kind:'evosim-pool', formatVersion:FORMAT_VERSION, version:VERSION,
             seed:W.seed, tick:W.tick, day:Math.round(W.tick/TPD()),
             geneNames:{ plant:geneNames(PG), animal:geneNames(AG) },
             plant:plant, animal:animal },
           `evosim-pool-s${W.seed}-d${Math.round(W.tick/TPD())}.json`);
}
$('fin').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (d.formatVersion !== FORMAT_VERSION)
        return alert('Save is formatVersion '+d.formatVersion+'; this build reads '+FORMAT_VERSION+'.');

      // ---- three file kinds now, dispatched on what is actually present ----

      // FOUNDER POOL: install and rebuild, so the pool is used from tick 0.
      if (d.kind === 'evosim-pool' || (d.plant && d.animal && !d.cfg)){
        POOL.plant  = (d.plant  || []).map(r => Float32Array.from(r));
        POOL.animal = (d.animal || []).map(r => Float32Array.from(r));
        if (!POOL.plant.length)  POOL.plant  = null;
        if (!POOL.animal.length) POOL.animal = null;
        // Pools store ACTIVE-length rows, never padding, so a pool exported
        // before the v0.46 stride cut still loads. Validate on active count
        // only — never on PGENES/AGENES. [L46-1]
        const badP = POOL.plant  && POOL.plant[0].length  !== P_ACTIVE;
        const badA = POOL.animal && POOL.animal[0].length !== A_ACTIVE;
        if (badP || badA){
          POOL.plant = POOL.animal = null;
          return alert('Pool gene count does not match this build.');
        }
        buildWorld(); buildDrawer(); refreshSpeed(); logReset();
        return alert('Founder pool loaded: '+(POOL.plant?POOL.plant.length:0)+' plant, '+
                     (POOL.animal?POOL.animal.length:0)+' animal genomes from day '+(d.day||'?')+
                     '.\nWorld rebuilt from this pool.');
      }

      // CFG PATCH: no terrain arrays, so there is nothing to restore — assign
      // the constants and rebuild the world from the seed. [L37-1]
      if (!d.lightBase){
        if (!d.cfg) return alert('No cfg block and no world in that file.');
        Object.assign(CFG, d.cfg);
        buildWorld(); buildDrawer(); refreshSpeed(); logReset();
        return alert('Config applied ('+Object.keys(d.cfg).length+' constants). World rebuilt.');
      }

      // FULL WORLD SNAPSHOT (terrain + soil; organisms are still phase 6)
      Object.assign(CFG, d.cfg);
      W.n = d.n; W.size = CFG.worldSize; W.tileSize = W.size/W.n; W.tileArea = W.tileSize*W.tileSize;
      W.seed = d.seed; W.tick = d.tick;
      W.lightBase = Float32Array.from(d.lightBase);
      W.nutrient  = Float64Array.from(d.nutrient);
      W.detritus  = Float64Array.from(d.detritus || new Float64Array(W.n*W.n));
      if (d.elev && d.arid){
        W.elev = Float32Array.from(d.elev); W.arid = Float32Array.from(d.arid);
      } else if (!W.elev || W.elev.length !== W.n*W.n){
        W.elev = new Float32Array(W.n*W.n); W.arid = new Float32Array(W.n*W.n);
      }
      rebuildFertility();
      W.scratch   = new Float64Array(W.n*W.n);
      W.canopy    = new Float32Array(W.n*W.n*BANDS);
      W.cover     = new Float32Array(W.n*W.n);                        // [L47-6]
      W.canopyW   = new Float32Array(W.n*W.n*BANDS);
      srand(d.rngState || d.seed);
      rebuildLatitude(); resizeTileImage();
      buildTileOffsets();
      initPlants(); initLineages(); seedFounders(CFG.founders); rebuildCanopy();
      initAnimals(); buildAnimalIndex();
      reclusterLineages(); collectStats(); clearHistory();
      W.matter0 = d.matter0 || W.matter;
      resetView(); buildDrawer(); refreshSpeed();
    } catch (err){ alert('Could not read that file: '+err.message); }
  };
  rd.readAsText(f); e.target.value = '';
});

//==========================================================================
// 14. MAIN LOOP — one budgeted path for every speed
//==========================================================================
let last=0, acc=0, tickAcc=0, frameAcc=0, statT=0, tps=0, fps=0;
const elArc=$('arcmark'), elArcBar=$('arc'), elProbe=$('probe'), elPBody=$('pBody');
const elHud=$('hud'), elSeason=$('vSeason'), elWarn=$('warnRow');
const gFlora=$('gFlora'), gFauna=$('gFauna'), gWorld=$('gWorld');
// Only the expanded sheet is rebuilt, and only while it is open, so the
// closed HUD costs three textContent writes a frame instead of an innerHTML.
let hudOpen = false;
$('hbTog').addEventListener('click', () => {
  hudOpen = !hudOpen; elHud.classList.toggle('open', hudOpen);
});
$('pClose').addEventListener('click', () => {
  probeTile = null; probePlant = -1; probeAnimal = -1; elProbe.classList.remove('on');
});
const SEASONCOL = ['#7FC24A','#D9C24A','#D9704A','#6FA3C4'];
const ACTNAME = ['resting','wandering','grazing','following','attacking','scavenging','fleeing'];
function row(label, val, cls){
  return '<div class="r"><span>'+label+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+val+'</b></div>';
}
function nfm(v){ return v >= 10000 ? (v/1000).toFixed(1)+'k' : String(v); }
const vDate=$('vDate'), vPop=$('vPop'), vLai=$('vLai'), vAn=$('vAn'), vRate=$('vRate');

let lastRender = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.25, (now-last)/1000); last = now;
  if (!paused){
    acc += dt*tpsTarget();
    const budget = performance.now() + 14;
    let done = 0;
    while (acc >= 1){
      tick(); acc--; done++;
      // WAS every 16 ticks: one slow batch could overshoot a 14 ms budget to
      // well past 100 ms and the frame hitched instead of throttling. [L47-6]
      if ((done & 3) === 0 && performance.now() > budget){ acc = 0; break; }
    }
    tickAcc += done;
  }
  // RENDER THROTTLE. Above watch speed the display is already lying (see
  // updateStrobe), and drawing 20k plants at 60 Hz was spending the majority
  // of the frame on a picture nobody is reading. At fastRenderMs the same
  // wall-clock second buys several times the sim-days. [L47-6]
  if (!paused && tpsTarget() > CFG.watchTPS*1.5){
    if (now - lastRender >= CFG.fastRenderMs){ render(); lastRender = now; frameAcc++; }
  } else { render(); lastRender = now; frameAcc++; }
  if (now - statT > 400){
    const s = (now-statT)/1000;
    tps = tickAcc/s; fps = frameAcc/s; tickAcc = frameAcc = 0; statT = now;
    updateStrobe(tps);
    updateHUD();
  }
  elArc.style.left = (dayPhase()*100).toFixed(2)+'%';
  elArcBar.style.opacity = (1 - 0.75*strobe).toFixed(2);
}
function updateHUD(){
  const t = W.tick, tpd = TPD();
  const d = Math.floor(t/tpd) % CFG.daysPerYear, yr = Math.floor(t/(tpd*CFG.daysPerYear));
  const hr = Math.floor((t % tpd)/(tpd/24));
  const atCap = P.freeN === 0, atCapA = AN.freeN === 0;
  const drift = W.matter0 ? (W.matter - W.matter0)/W.matter0*100 : 0;
  const sn = Math.floor(yearPhase()*4)%4;

  // --- always visible: date, three numbers. Nothing else.
  vDate.textContent = 'y'+yr+' d'+d + (strobe > 0.6 ? '' : '  '+String(hr).padStart(2,'0')+':00');
  elSeason.style.background = SEASONCOL[sn];
  // measured throughput, not the slider's request — they diverge under load
  vRate.textContent = tps < 1 ? 'paused' : tps.toFixed(0)+' t/s · '+rateLabel(tps);
  vPop.textContent = nfm(ST.pop) + (atCap ? '\u25B2' : '');
  vAn.textContent  = nfm(ST.apop) + (atCapA ? '\u25B2' : '');
  vLai.textContent = W.lai.toFixed(2);

  // --- inspector card, only when something is selected
  if (probeTile !== null){
    const i = probeTile, ty = (i/W.n)|0, tx = i%W.n;
    let lai = 0; for (let b = 0; b < BANDS; b++) lai += W.canopy[i*BANDS+b];
    let s = '<em>tile '+tx+','+ty+'</em>   light '+lightAt(tx,ty).toFixed(3)+
            '   soil '+W.nutrient[i].toFixed(2)+'   lai '+(lai/W.tileArea).toFixed(2);
    if (probePlant >= 0 && P.stage[probePlant] === 2){
      const g = probePlant*PGENES, G = P.genome, m = P.mass[probePlant];
      const ln = (PLIN && PLIN.name[P.lin[probePlant]]) || '\u2014';
      s += '\n\n<u>'+ln+'</u>  <em>plant</em>  gen '+(P.gen[probePlant]|0)+
           '\n'+describeLin(PLIN, P.lin[probePlant])+
           '\nmass '+m.toFixed(1)+' / '+G[g+PG.maxMass].toFixed(0)+
           '   leaf '+leafArea(g,m).toFixed(1)+'   energy '+P.energy[probePlant].toFixed(0)+
           '   age '+(P.age[probePlant]/tpd).toFixed(1)+'d'+
           '\nheight '+effHeight(g,m).toFixed(3)+' (gene '+G[g+PG.height].toFixed(2)+')'+
           '   spread '+G[g+PG.canopySpread].toFixed(2)+'   eff '+G[g+PG.photoEfficiency].toFixed(2)+
           '\ndefence: tough '+G[g+PG.toughness].toFixed(2)+'  toxic '+G[g+PG.toxicity].toFixed(2)+
           '  fibre '+G[g+PG.fibre].toFixed(2)+'  regrow '+G[g+PG.regrowthRate].toFixed(2)+
           (P.bit[probePlant] > 0 && W.tick-P.bit[probePlant] < tpd*CFG.regrowDays
              ? '\n<em>recently grazed \u2014 regrowing at a discount</em>' : '');
    }
    if (probeAnimal >= 0 && AN.stage[probeAnimal]){
      const i = probeAnimal, g = i*AGENES, G = AN.genome;
      if (AN.stage[i] === CORPSE){
        s += '\n\n<em>corpse</em>  mass '+AN.mass[i].toFixed(2)+'  \u2014 rotting into the soil, and edible';
      } else {
        const ln = (ALIN && ALIN.name[AN.lin[i]]) || '\u2014';
        const cap = Math.max(1e-6, G[g+AG.energyCapacity]*AN.up[i]*tpd);
        s += '\n\n<u>'+ln+'</u>  <em>'+ACTNAME[AN.act[i]]+'</em>  gen '+(AN.gen[i]|0)+
             '\n'+describeLin(ALIN, AN.lin[i])+
             '\nmass '+AN.mass[i].toFixed(2)+' / '+G[g+AG.size].toFixed(1)+
             '   energy '+AN.energy[i].toFixed(0)+' ('+(100*AN.energy[i]/cap).toFixed(0)+'% full)'+
             '\nstamina '+(100*AN.stam[i]).toFixed(0)+'%   age '+(AN.age[i]/tpd).toFixed(1)+'d'+
             '   intake '+AN.rate[i].toFixed(3)+'/tick'+
             '\ndiet: herbivory '+G[g+AG.herbivory].toFixed(2)+'  carnivory '+G[g+AG.carnivory].toFixed(2)+
             '\nspeed '+G[g+AG.maxSpeed].toFixed(2)+'  sense '+G[g+AG.senseRange].toFixed(0)+
             '  bite '+G[g+AG.biteForce].toFixed(2)+'  armour '+G[g+AG.armour].toFixed(2)+
             '\naggression '+G[g+AG.aggression].toFixed(2)+'  fear '+G[g+AG.fearThreshold].toFixed(2)+
             '  reach '+reachOf(g).toFixed(3);
      }
    }
    elPBody.innerHTML = s;
    elProbe.classList.add('on');
  } else elProbe.classList.remove('on');

  if (!hudOpen) return;                       // nothing below this costs anything when closed

  gFlora.innerHTML =
    row('Population', ST.pop.toLocaleString(), 'leaf') +
    row('Generation', ST.gen.toFixed(1)) +
    row('Mean mass', ST.mass.toFixed(1)) +
    row('Seed bank', ST.seeds.toLocaleString()) +
    row('Canopy LAI', W.lai.toFixed(2), 'sky') +
    row('Height', ST.eh.toFixed(3)) +
    row('Height gene', ST.h.toFixed(2)) +
    row('Defence', ST.atough.toFixed(2)) +
    row('Lineages', PLIN ? PLIN.n : 0);

  gFauna.innerHTML =
    row('Population', ST.apop.toLocaleString(), 'amb') +
    row('Generation', ST.agen.toFixed(1)) +
    row('Mean mass', ST.amass.toFixed(1)) +
    row('Speed', ST.aspeed.toFixed(2)) +
    row('Herbivory', ST.aherb.toFixed(2)) +
    row('Sense range', ST.asense.toFixed(0)) +
    row('Corpses', W.corpses|0) +
    row('Kills', (W.aDeadKilled|0).toLocaleString()) +
    row('Lineages', ALIN ? ALIN.n : 0);

  gWorld.innerHTML =
    row('Season', SEASONS[sn]) +
    row('Speed', tps.toFixed(0)+' t/s') +
    row('Sim rate', rateLabel(tps)) +
    row('Frames', fps.toFixed(0)+' fps') +
    row('Soil', W.soilSum.toFixed(0)) +
    row('Detritus', W.detSum.toFixed(0)) +
    row('Biomass', (W.bioSum*CFG.nutrientPerMass).toFixed(0)) +
    row('Matter', W.matter.toFixed(0)) +
    '<div class="r wide"><span>Matter ledger drift</span><b class="' +
      (Math.abs(drift) > 0.5 ? 'warn' : 'leaf') + '">' +
      (drift >= 0 ? '+' : '') + drift.toFixed(3) + '%</b></div>';

  let w = '';
  if (atCap)  w += '<div class="chip">Flora at slot cap</div>';
  if (atCapA) w += '<div class="chip">Fauna at slot cap</div>';
  if (Math.abs(drift) > 0.5) w += '<div class="chip">Matter drifting</div>';
  if (!ST.pop) w += '<div class="chip">Flora extinct</div>';
  else if (!ST.apop && W.tick > CFG.animalStartDay*tpd) w += '<div class="chip">Fauna extinct</div>';
  elWarn.innerHTML = w;
}

window.addEventListener('resize', () => {
  const f = cam.z/minZoom(); resizeCanvas(); cam.z = clamp(f*minZoom(), minZoom(), 14);
});
resizeCanvas();
buildWorld();
buildDrawer();
refreshSpeed();
$('bGraph').classList.add('on');
requestAnimationFrame(frame);
</script>
</body>
</html>
