// Steep ground is slow ground unless you can climb it. Below the foothills
// terrain is free; above peakElev nothing passes at any climbing skill.
// Remap a field so its values are its own RANKS, i.e. exactly uniform on
// 0..1. Value noise clusters around its mean and its extremes move with the
// seed, so a fixed threshold cut a different fraction of every world — 94%
// habitable in one run, 43% in the next. After this, every threshold is a
// share of the map and terrain proportions are identical across seeds while
// the terrain itself stays completely different.
function rankNormalise(f){
  const n = f.length;
  const idx = new Int32Array(n);
  for (let i = 0; i < n; i++) idx[i] = i;
  const arr = Array.from(idx).sort((a, b) => f[a] - f[b]);
  for (let r = 0; r < n; r++) f[arr[r]] = n > 1 ? r/(n-1) : 0;
}
function terrainDrag(t, climb){
  const e = W.elev[t];
  if (e <= CFG.foothill) return 1;
  const u = (e - CFG.foothill)/(1 - CFG.foothill);
  return Math.max(0.06, 1 - u*(1 - climb)*CFG.k_climbSlow);
}
function passable(t){ return W.elev[t] < CFG.peakElev; }
function tileOf(x, y){
  const n = W.n;
  let tx = (x/W.tileSize)|0, ty = (y/W.tileSize)|0;
  if (tx < 0) tx = 0; else if (tx >= n) tx = n-1;
  if (ty < 0) ty = 0; else if (ty >= n) ty = n-1;
  return ty*n + tx;
}

// Fertility gates germination and scales growth. Zero above the tree line.
// Derived entirely from elev and arid, so a load can rebuild it rather than
// inheriting whatever fertility the previous world left in memory.
// Habitable is fert > germFertMin, the same threshold germination uses — it
// was 0.10 against a germFertMin of 0.08, so habFrac understated the world.
function rebuildFertility(){
  const n = W.n;
  if (!W.fert || W.fert.length !== n*n) W.fert = new Float32Array(n*n);
  let hab = 0;
  for (let i = 0; i < n*n; i++){
    const e = W.elev[i];
    let alt = 1;
    if (e >= CFG.treeLine) alt = 0;
    else if (e > CFG.foothill){
      const u = (e - CFG.foothill)/(CFG.treeLine - CFG.foothill);
      alt = Math.max(0, 1 - u*u*CFG.altBite);
    }
    W.fert[i] = clamp((1 - W.arid[i]*CFG.aridBite)*alt, 0, 1);
    if (W.fert[i] > CFG.germFertMin) hab++;
  }
  W.habFrac = hab/(n*n);
}

function buildWorld(){
  const n = W.n = CFG.tiles;
  W.size = CFG.worldSize;
  W.tileSize = W.size/n;
  W.tileArea = W.tileSize*W.tileSize;
  W.seed = CFG.seed;
  W.tick = Math.floor(CFG.ticksPerDay*0.30);
  srand(CFG.seed);

  const nz = valueNoise(n, 4, 3, 0.5);
  W.lightBase = new Float32Array(n*n);
  for (let i = 0; i < n*n; i++) W.lightBase[i] = 1 - CFG.lightNoiseAmp*(1 - nz[i]);

  // ---- terrain. Elevation is RIDGED noise: 1-|2v-1| peaks along the 0.5
  // contour of a smooth field, and contours are lines, so the high ground
  // comes out as ranges instead of blobs. Aridity is an independent field,
  // so you get dry lowlands and wet uplands rather than one gradient.
  const ez = valueNoise(n, 2, 3, 0.45);
  W.elev = new Float32Array(n*n);
  for (let i = 0; i < n*n; i++){
    const ridge = 1 - Math.abs(2*ez[i] - 1);
    W.elev[i] = clamp(Math.pow(ridge, CFG.ridgeSharp)*CFG.elevAmp, 0, 1);
  }
  rankNormalise(W.elev);
  const az = valueNoise(n, 3, 3, 0.5);
  W.arid = new Float32Array(n*n);
  for (let i = 0; i < n*n; i++) W.arid[i] = az[i];
  rankNormalise(W.arid);
  if (CFG.aridAmp !== 1) for (let i = 0; i < n*n; i++) W.arid[i] = clamp(W.arid[i]*CFG.aridAmp, 0, 1);

  rebuildFertility();

  const nz2 = valueNoise(n, 3, 3, 0.55);
  W.nutrient = new Float64Array(n*n);
  const a = CFG.nutrientNoiseAmp;
  for (let i = 0; i < n*n; i++)
    W.nutrient[i] = clamp(CFG.nutrientStart*(1 - a + 2*a*nz2[i])*W.fert[i],
                          0, CFG.nutrientCap);

  W.scratch  = new Float64Array(n*n);
  W.detritus = new Float64Array(n*n);
  W.canopy   = new Float32Array(n*n*BANDS);
  W.canopyW  = new Float32Array(n*n*BANDS);

  rebuildLatitude(); resizeTileImage(); buildTileOffsets();
  initPlants(); initLineages(); seedFounders(CFG.founders); rebuildCanopy();
  initAnimals(); buildAnimalIndex();
  reclusterLineages(); collectStats(); clearHistory();
  W.matter0 = W.matter;
  resetView();
}

function rebuildLatitude(){
  const n = W.n; W.latF = new Float32Array(n);
  for (let y = 0; y < n; y++)
    W.latF[y] = 1 - CFG.latitudeBand*(1 - Math.cos(2*Math.PI*y/n))/2;
}
// Symmetric pairwise flux, weighted by the POORER of the two tiles. Written
// this way rather than as a Laplacian because every flux is added to one
// tile and subtracted from the other in the same statement, so a variable
// rate cannot break conservation the way a per-tile stencil would. Soil
// therefore creeps through barren ground instead of equalising across it,
// and a desert stays soil-poor rather than quietly filling from its
// neighbours with nutrient nothing there can use.
function diffuse(){
  const n = W.n, a = W.nutrient, f = W.fert, r = CFG.diffuseRate;
  const floor = CFG.diffuseFloor;
  for (let y = 0; y < n; y++){
    const yc = y*n, ys = ((y+1)%n)*n;
    for (let x = 0; x < n; x++){
      const i = yc+x, xe = (x+1)%n;
      const je = yc+xe, jsx = ys+x;
      let w = r*(floor + (1-floor)*Math.min(f[i], f[je]));
      let q = w*(a[i] - a[je]);
      a[i] -= q; a[je] += q;
      w = r*(floor + (1-floor)*Math.min(f[i], f[jsx]));
      q = w*(a[i] - a[jsx]);
      a[i] -= q; a[jsx] += q;
    }
  }
}
function decay(){
  const d = W.detritus, u = W.nutrient, r = CFG.decayRate*CFG.diffuseEvery;
  for (let i = 0; i < d.length; i++) if (d[i] > 0){ const m = d[i]*r; d[i] -= m; u[i] += m; }
}
function measure(){
  let s = 0, dt = 0;
  for (let i = 0; i < W.nutrient.length; i++){ s += W.nutrient[i]; dt += W.detritus[i]; }
  let bio = 0;
  for (let i = 0; i < P.hi; i++) if (P.stage[i] === 2) bio += P.mass[i];
  let abio = 0, agut = 0;
  for (let i = 0; i < AN.hi; i++) if (AN.stage[i]){ abio += AN.mass[i]; agut += AN.gut[i]; }
  W.soilSum = s; W.detSum = dt; W.bioSum = bio; W.aBio = abio;
  W.matter = s + dt + (bio+abio)*CFG.nutrientPerMass + agut;
  let tot = 0, occ = 0;
  for (let t = 0; t < W.n*W.n; t++){
    let l = 0;
    for (let b = 0; b < BANDS; b++) l += W.canopy[t*BANDS+b];
    if (l > 0){ tot += l/W.tileArea; occ++; }
  }
  // LAI is the mean over OCCUPIED tiles, so it says nothing about how much of
  // the world is bare. occTiles is the other half of that number.
  W.lai = occ ? tot/occ : 0; W.occTiles = occ;
}

//==========================================================================
// 5. TIME + LIGHT
//==========================================================================
const TPD = () => CFG.ticksPerDay;
const TPY = () => CFG.ticksPerDay*CFG.daysPerYear;
const SEASONS = ['Spring','Summer','Autumn','Winter'];
function dayPhase(){ return (W.tick % TPD())/TPD(); }
function yearPhase(){ return (W.tick % TPY())/TPY(); }
function sunElev(){ return Math.max(0, Math.sin(2*Math.PI*(dayPhase() - 0.25))); }
function seasonF(){ return Math.max(0, 1 + CFG.seasonAmp*Math.sin(2*Math.PI*yearPhase())); }
function lightMul(){ return CFG.sunPeak*sunElev()*seasonF(); }
function lightAt(tx, ty){ return W.lightBase[ty*W.n+tx]*W.latF[ty]*lightMul(); }

//==========================================================================
// 6. PLANTS
//==========================================================================
const P = {
  max:0, hi:0, live:0, seeds:0,   // hi = exclusive bound on slots ever used
  x:null, y:null, mass:null, energy:null, repro:null, age:null, gen:null,
  timer:null, tile:null, stage:null, lin:null, defence:null, bit:null, genome:null, free:null, freeN:0,
};

function initPlants(){
  const M = P.max = CFG.maxPlants;
  P.x=new Float32Array(M); P.y=new Float32Array(M);
  P.mass=new Float32Array(M); P.energy=new Float32Array(M);
  P.repro=new Float32Array(M); P.age=new Float32Array(M);
  P.gen=new Float32Array(M); P.timer=new Float32Array(M);
  P.tile=new Int32Array(M); P.stage=new Uint8Array(M); P.lin=new Uint8Array(M);
  P.defence=new Float32Array(M); P.bit=new Float32Array(M);
  P.genome=new Float32Array(M*PGENES);
  P.free=new Int32Array(M);
  for (let i = 0; i < M; i++) P.free[i] = M-1-i;
  P.freeN = M; P.hi = 0; P.live = 0; P.seeds = 0;
}
function allocSlot(){
  if (P.freeN <= 0) return -1;
  const i = P.free[--P.freeN];
  if (i >= P.hi) P.hi = i+1;
  return i;
}
function releaseSlot(i){
  if (P.stage[i] === 2) P.live--; else if (P.stage[i] === 1) P.seeds--;
  P.stage[i] = 0; P.free[P.freeN++] = i;
}
function killPlant(i){
  P.bit[i] = 0;
  W.detritus[P.tile[i]] += P.mass[i]*CFG.nutrientPerMass;
  P.mass[i] = 0; releaseSlot(i);
}
function mutateInto(dstBase, srcBase){
  const G = P.genome;
  const rate = Math.max(CFG.mutationFloor, G[srcBase+PG.mutationRate]);
  const scale = G[srcBase+PG.mutationScale];
  for (let k = 0; k < P_ACTIVE; k++){
    let v = G[srcBase+k];
    if (rng() < rate) v += gauss()*PSIG[k]*scale;
    G[dstBase+k] = clamp(v, PMIN[k], PMAX[k]);
  }
}
// A world used to start as one genome stamped out N times, so every lineage
// it ever had was invented by mutation from a single point. Now it starts
// from several distinct morphs. Draws are centred on the ancestral value and
// scaled by morphSpread rather than being uniform over the range, so the
// founders are varied without being nonsense.
function drawMorphs(nMorph, ACTIVE, START, SIG, MIN, MAX){
  const out = [];
  for (let m = 0; m < nMorph; m++){
    const v = new Float32Array(ACTIVE);
    for (let j = 0; j < ACTIVE; j++){
      // sigmas, not range fractions: a gene table already says how far a
      // meaningful step is for each gene, and the ranges do not agree
      v[j] = m === 0 ? START[j]
           : clamp(START[j] + gauss()*SIG[j]*CFG.morphSpread, MIN[j], MAX[j]);
    }
    out.push(v);
  }
  return out;
}
function seedFounders(count){
  const G = P.genome;
  const morphs = drawMorphs(Math.max(1, CFG.founderMorphs|0), P_ACTIVE, PSTART, PSIG, PMIN, PMAX);
  for (let k = 0; k < count; k++){
    const i = allocSlot(); if (i < 0) return;
    const g = i*PGENES;
    const mo = morphs[k % morphs.length];
    for (let j = 0; j < P_ACTIVE; j++)
      G[g+j] = clamp(mo[j] + gauss()*PSIG[j]*CFG.founderNoise, PMIN[j], PMAX[j]);
    P.x[i] = rng()*W.size; P.y[i] = rng()*W.size;
    const t = P.tile[i] = tileOf(P.x[i], P.y[i]);
    if (W.fert[t] < CFG.germFertMin){ P.free[P.freeN++] = i; continue; }
    const need = CFG.seedlingMass*CFG.nutrientPerMass;
    if (W.nutrient[t] < need){ P.free[P.freeN++] = i; continue; }
    W.nutrient[t] -= need;
    P.mass[i] = CFG.seedlingMass; P.energy[i] = CFG.founderEnergy;
    P.repro[i]=0; P.age[i]=0; P.gen[i]=0; P.timer[i]=0; P.lin[i]=0;
    P.stage[i] = 2; P.live++;
  }
}
function spawnSeed(parent, energy, disp){
  if (P.seeds >= P.max*CFG.seedSlotFraction) return false;
  const i = allocSlot(); if (i < 0) return false;
  const g = i*PGENES;
  mutateInto(g, parent*PGENES);
  const ang = rng()*Math.PI*2, d = Math.sqrt(rng())*disp;
  let x = P.x[parent] + Math.cos(ang)*d, y = P.y[parent] + Math.sin(ang)*d;
  x = (x % W.size + W.size) % W.size; y = (y % W.size + W.size) % W.size;
  P.x[i]=x; P.y[i]=y; P.tile[i]=tileOf(x,y);
  P.energy[i]=energy; P.mass[i]=0; P.repro[i]=0; P.age[i]=0;
  P.gen[i] = P.gen[parent]+1;
  P.lin[i] = P.lin[parent];
  P.timer[i] = P.genome[g+PG.germinationDelay];
  P.stage[i] = 1; P.seeds++;
  return true;
}

// Realized height. A seedling has no trunk, so height must be earned with mass.
// This is the asymmetry that lets big plants shade small ones out of existence.
function effHeight(g, mass){
  // sqrt, not m/(m+k): a saturating form flattens the size hierarchy and
  // proportional light sharing returns. This keeps height tracking mass.
  const f = mass < CFG.k_heightMass ? Math.sqrt(mass/CFG.k_heightMass) : 1;
  return P.genome[g+PG.height]*f;
}
// Leaf area actually carried: the canopy it wants, capped by the mass holding it
// up, minus what the stem takes. Tall plants trade canopy area for reach.
function leafArea(g, mass){
  const sp = P.genome[g+PG.canopySpread];
  const want = Math.PI*sp*sp;
  const support = CFG.k_leafPerMass*mass/(1 + CFG.k_stem*effHeight(g, mass));
  // Smooth saturation, not min(). A clamp leaves a linear ramp below it and
  // a dead flat landscape above, and evolution cannot climb flat ground.
  return support*(1 - Math.exp(-want/Math.max(1e-6, support)));
}

// Plants never move, so their index is rebuilt only with the canopy pass.
const PIDX = { start:null, items:null, cur:null };
function buildPlantIndex(){
  const nT = W.n*W.n;
  if (!PIDX.start || PIDX.start.length !== nT+1){ PIDX.start = new Int32Array(nT+1); PIDX.cur = new Int32Array(nT); }
  if (!PIDX.items || PIDX.items.length < P.max) PIDX.items = new Int32Array(P.max);
  PIDX.start.fill(0);
  for (let i = 0; i < P.hi; i++) if (P.stage[i] === 2) PIDX.start[P.tile[i]+1]++;
  for (let t = 0; t < nT; t++) PIDX.start[t+1] += PIDX.start[t];
  PIDX.cur.set(PIDX.start.subarray(0, nT));
  for (let i = 0; i < P.hi; i++) if (P.stage[i] === 2) PIDX.items[PIDX.cur[P.tile[i]]++] = i;
}
function laiOf(t){
  let l = 0; for (let b = 0; b < BANDS; b++) l += W.canopy[t*BANDS+b];
  return l/W.tileArea;
}

function rebuildCanopy(){
  const c = W.canopy, cw = W.canopyW, G = P.genome;
  c.fill(0); cw.fill(0);
  for (let i = 0; i < P.hi; i++){
    if (P.stage[i] !== 2) continue;
    const g = i*PGENES, h = effHeight(g, P.mass[i]);
    let b = (h*BANDS)|0; if (b >= BANDS) b = BANDS-1;
    const frac = h*BANDS - b;
    const lf = leafArea(g, P.mass[i]);
    const base = P.tile[i]*BANDS + b;
    c[base] += lf;
    cw[base] += lf*(1+frac);        // taller within a band takes a larger share
  }
  buildPlantIndex();
}

function updateSeed(i, step){
  P.timer[i] -= step;
  P.energy[i] -= CFG.k_seedDecay*step;
  if (P.energy[i] <= 0){ releaseSlot(i); return; }
  if (P.timer[i] > 0) return;
  const t = P.tile[i], need = CFG.seedlingMass*CFG.nutrientPerMass;
  // Building tissue costs energy everywhere else in this model; it has to
  // cost energy here too, or a seed mints biomass and the whole plant
  // economy is a fiction. A seed that cannot pay never will — its energy
  // only decays — so it dies rather than squatting on a slot forever.
  // nothing germinates on bare rock or above the tree line
  if (W.fert[t] < CFG.germFertMin){ W.pSeedFail++; releaseSlot(i); return; }
  const buildE = CFG.seedlingMass*CFG.energyPerMass*CFG.germCostMult;
  if (P.energy[i] <= buildE){ W.pSeedFail++; releaseSlot(i); return; }
  if (W.nutrient[t] < need) return;
  W.nutrient[t] -= need;
  P.energy[i] -= buildE;
  P.mass[i] = CFG.seedlingMass; P.age[i] = 0; W.pGerm++;
  W.grown += CFG.seedlingMass;   // recruitment IS production; omitting it
                                 // made eaten/grown meaningless once the
                                 // world ran on seedlings
  P.stage[i] = 2; P.seeds--; P.live++;
}

function updatePlant(i, step){
  const G = P.genome, g = i*PGENES, t = P.tile[i], n = W.n, A = W.tileArea;
  const ty = (t/n)|0;
  const mass = P.mass[i];
  const leaf = leafArea(g, mass);
  const h = effHeight(g, mass);            // realized, not genetic
  const m75 = Math.pow(mass, 0.75);
  const pe0 = G[g+PG.photoEfficiency];

  // LIGHT: layered Beer-Lambert, top band first, continuous within a band.
  let myBand = (h*BANDS)|0; if (myBand >= BANDS) myBand = BANDS-1;
  const myW = leaf*(1 + (h*BANDS - myBand));
  const cb = t*BANDS;
  let remaining = 1, myFrac = 0, relLight = 1;
  for (let b = BANDS-1; b >= 0; b--){
    let bl = W.canopy[cb+b], bw = W.canopyW[cb+b];
    if (b === myBand){ if (bl < leaf) bl = leaf; if (bw < myW) bw = myW; }
    if (bl <= 0) continue;
    const inter = remaining*(1 - Math.exp(-CFG.k_shade*bl/A));
    if (b === myBand){ relLight = remaining; myFrac = inter*(myW/bw); }
    remaining -= inter;
    if (remaining <= 0){ remaining = 0; break; }
  }
  const tol = G[g+PG.shadeTolerance];
  const photoEff = pe0
                 * (1 - CFG.k_shadeCost*tol)
                 * (1 + tol*(1-relLight)*CFG.k_shadeGain);
  const light = W.lightBase[t]*W.latF[ty]*lightMul();
  // Poor ground is poor ground: dryness and altitude scale what a plant can
  // actually make of the light it catches.
  const gain = light*A*myFrac*photoEff*CFG.k_photo*W.fert[t];

  const life = G[g+PG.lifespan];
  let sen = 1;
  if (P.age[i] > life) sen = Math.min(20, 1 + G[g+PG.senescenceRate]*(P.age[i]-life)/life);

  const upkeep = (CFG.k_base
    + CFG.k_mass*m75
    + CFG.k_leaf*leaf
    + CFG.k_height*h*h*mass
    + CFG.k_root*G[g+PG.rootDepth]*G[g+PG.rootDepth]*mass   // B1: quadratic
    + CFG.k_regrowCost*G[g+PG.regrowthRate]*G[g+PG.regrowthRate]*mass
    + CFG.k_photoCost*pe0*pe0*leaf      // quadratic, or efficiency pins to a rail
    // B2+B3: disposable soma, as the animals have always had. Without the
    // senescence divisor, lifespan was linear/linear and senescenceRate was a
    // tax with no benefit at all — both pinned to their minima, measurably.
    + CFG.k_longevity*life*m75/(G[g+PG.senescenceRate] + 0.2))*sen;
  if ((i & 63) === 0){
    UPK[0] += CFG.k_base*sen;              UPK[1] += CFG.k_mass*m75*sen;
    UPK[2] += CFG.k_leaf*leaf*sen;         UPK[3] += CFG.k_height*h*h*mass*sen;
    UPK[4] += CFG.k_root*G[g+PG.rootDepth]*G[g+PG.rootDepth]*mass*sen;
    UPK[5] += CFG.k_regrowCost*G[g+PG.regrowthRate]*G[g+PG.regrowthRate]*mass*sen;
    UPK[6] += CFG.k_photoCost*pe0*pe0*leaf*sen;
    UPK[7] += CFG.k_longevity*life*m75/(G[g+PG.senescenceRate]+0.2)*sen; UPK[8] += gain;
    UPKN++;
  }

  P.energy[i] += (gain - upkeep)*step;
  W.ePhoto += gain*step;
  P.age[i] += step;
  if (P.energy[i] <= 0 || P.age[i] > life*3){
    // a cropped plant dies by the ordinary energy test, so recent grazing
    // is what distinguishes "eaten" from "shaded out"
    if (P.age[i] > life*3) W.pDeadAge++;
    // Senescence kills by multiplying upkeep until the energy test fails, so
    // it was being logged as starvation and pDeadAge (past 3x lifespan) never
    // fired once in 59 sim-years. Plant lifespan looked like a pure tax.
    if (P.bit[i] > 0 && W.tick - P.bit[i] < CFG.ticksPerDay*2) W.pDeadEat++;
    else if (P.age[i] > life) W.pDeadSen++;
    else W.pDeadStarve++;
    killPlant(i); return;
  }

  const ageFrac = clamp(P.age[i]/life, 0, 1);
  const sea = Math.sin(2*Math.PI*yearPhase());
  let a0 = G[g+PG.allocGrowth]  + G[g+PG.ageShiftGrowth]*ageFrac  + G[g+PG.seasonShiftGrowth]*sea;
  let a1 = G[g+PG.allocDefence] + G[g+PG.ageShiftDefence]*ageFrac + G[g+PG.seasonShiftDefence]*sea;
  let a2 = G[g+PG.allocRepro]   + G[g+PG.ageShiftRepro]*ageFrac   + G[g+PG.seasonShiftRepro]*sea;
  let a3 = G[g+PG.allocStorage] + G[g+PG.ageShiftStorage]*ageFrac + G[g+PG.seasonShiftStorage]*sea;
  if (a0<0) a0=0; if (a1<0) a1=0; if (a2<0) a2=0; if (a3<0) a3=0;
  // a plant must at least double from a seedling before it can breed, or
  // maturityMass evolves below seedlingMass and every sprout is born adult
  const matM = Math.max(CFG.seedlingMass*2,
                        Math.min(G[g+PG.maturityMass], G[g+PG.maxMass]));
  const mature = P.mass[i] >= matM;
  if (!mature){ a0 += a2; a2 = 0; }
  const sum = a0+a1+a2+a3;
  if (sum > 0){ a0/=sum; a1/=sum; a2/=sum; a3/=sum; } else { a3 = 1; }

  const reserve = a3*CFG.k_storage*upkeep*CFG.ticksPerDay;
  const surplus = P.energy[i] - reserve;
  if (surplus > 0){
    const room = G[g+PG.maxMass] - mass;
    const gEn = surplus*a0;
    if (room > 0 && gEn > 0){
      const cap = CFG.k_uptake*G[g+PG.rootDepth]*Math.pow(mass,0.75)*step;
      const nAvail = Math.min(cap, W.nutrient[t]);
      // Compensatory regrowth: a recently cropped plant rebuilds cheaply,
      // because the roots and meristems it is regrowing from are still there.
      const epm = (P.bit[i] > 0 && W.tick - P.bit[i] < CFG.ticksPerDay*CFG.regrowDays)
        ? CFG.energyPerMass*(1 - CFG.k_regrow*G[g+PG.regrowthRate])
        : CFG.energyPerMass;
      const byE = gEn/epm, byN = nAvail/CFG.nutrientPerMass;
      const dM = Math.min(byE, byN, room);
      // which of the three actually bound? light-limited and nutrient-limited
      // worlds behave completely differently and I could not tell them apart
      if (dM === byN) W.limN++; else if (dM === room) W.limM++; else W.limE++;
      if (dM > 0){
        P.mass[i] = mass + dM; W.grown += dM;
        P.energy[i] -= dM*epm;
        W.nutrient[t] -= dM*CFG.nutrientPerMass;
      }
    }
    // DEFENCE. allocDefence finally has a job: realized defence is what the
    // plant actually paid for, over what its genes ask for. Costs are quadratic
    // in each gene per 6.1, and scale with the mass being protected.
    const dEn = surplus*a1;
    if (dEn > 0){
      P.energy[i] -= dEn;
      const tg = G[g+PG.toughness], tx = G[g+PG.toxicity], fb = G[g+PG.fibre];
      const need = (CFG.k_toughCost*tg*tg + CFG.k_toxCost*tx*tx + CFG.k_fibreCost*fb*fb)*mass*step;
      const got = need > 1e-9 ? clamp(dEn/need, 0, 1) : 1;
      P.defence[i] = P.defence[i]*0.75 + got*0.25;
    } else P.defence[i] *= 0.9;
    const rEn = surplus*a2; if (rEn > 0){ P.energy[i] -= rEn; P.repro[i] += rEn; }
  }

  // Recruitment survival — pMature against pGerm. Zero net recruitment while
  // eaten/grown read a healthy 0.48 was the failure the log could not show.
  if (!mature && P.mass[i] >= matM) W.pMature++;

  if (mature && P.repro[i] > 0){
    const sE = G[g+PG.seedEnergy], disp = G[g+PG.dispersalRange];
    const costPer = sE + CFG.k_disperse*disp*disp;   // B7: quadratic
    let want = Math.min(G[g+PG.seedCount]|0, (P.repro[i]/costPer)|0);
    while (want-- > 0){
      if (!spawnSeed(i, sE, disp)) break;
      P.repro[i] -= costPer;
      // every 8th, so the accumulator costs a fraction of a gene copy per seed
      if ((W.pSeeded++ & 7) === 0) selAccum(SELP, P.genome, g, P_ACTIVE);
    }
  }
}

function updatePlants(){
  const stag = CFG.plantStagger, phase = W.tick % stag;
  if (phase === 0) rebuildCanopy();
  for (let i = phase; i < P.hi; i += stag){
    const st = P.stage[i];
    if (st === 2) updatePlant(i, stag);
    else if (st === 1) updateSeed(i, stag);
  }
}


//==========================================================================
// 6b. ANIMALS — struct of arrays, tile index rebuilt every tick.
//     Phase 3 is herbivory only: GRAZE / APPROACH / REST / WANDER. Attacking,
//     corpses, carrion and mating wait for phases 4-5; those genes drift.
//==========================================================================
const AN = {
  max:0, hi:0, live:0,
  x:null, y:null, hd:null, sp:null, mass:null, energy:null, gut:null,
  age:null, stam:null, gen:null, up:null, tile:null, stage:null, tgt:null, act:null,
  lin:null, genome:null, free:null, freeN:0, rate:null, pursue:null, stall:null,
};
const AIDX = { start:null, items:null, cur:null };
let TOFF = null, TOFFD = null;   // tile offsets sorted by distance

function initAnimals(){
  const M = AN.max = CFG.maxAnimals;
  AN.x=new Float32Array(M); AN.y=new Float32Array(M);
  AN.hd=new Float32Array(M); AN.sp=new Float32Array(M);
  AN.mass=new Float32Array(M); AN.energy=new Float32Array(M);
  AN.gut=new Float32Array(M); AN.age=new Float32Array(M); AN.rate=new Float32Array(M);
  AN.pursue=new Float32Array(M); AN.stall=new Float32Array(M);
  AN.stam=new Float32Array(M); AN.gen=new Float32Array(M); AN.up=new Float32Array(M);
  AN.tile=new Int32Array(M); AN.stage=new Uint8Array(M);
  AN.tgt=new Int32Array(M); AN.act=new Uint8Array(M); AN.lin=new Uint8Array(M);
  AN.genome=new Float32Array(M*AGENES);
  AN.free=new Int32Array(M);
  for (let i = 0; i < M; i++) AN.free[i] = M-1-i;
  AN.freeN = M; AN.hi = 0; AN.live = 0;
}
function allocAnimal(){
  if (AN.freeN <= 0) return -1;
  const i = AN.free[--AN.freeN];
  if (i >= AN.hi) AN.hi = i+1;
  return i;
}
// Death returns body mass AND undigested gut to the tile. Matter closes here.
// Death leaves a body. Scavenging is the stepping stone to predation, so
// there has to be something to scavenge. Gut contents go straight to the
// soil; the flesh stays until it rots or is eaten. Matter is conserved on
// both paths — nothing here creates or destroys mass.
function killAnimal(i){
  W.detritus[AN.tile[i]] += AN.gut[i];
  AN.gut[i] = 0;
  AN.live--;
  if (AN.mass[i] > CFG.corpseMin){
    AN.stage[i] = CORPSE; AN.sp[i] = 0; AN.tgt[i] = -1; AN.age[i] = 0;
    W.corpses++;
  } else {
    W.detritus[AN.tile[i]] += AN.mass[i]*CFG.nutrientPerMass;
    AN.mass[i] = 0; AN.stage[i] = 0; AN.free[AN.freeN++] = i;
  }
}
function decayCorpse(i){
  const d = Math.min(AN.mass[i], AN.mass[i]*CFG.k_corpseDecay + 1e-6);
  AN.mass[i] -= d; W.corpseRot += d;
  W.detritus[AN.tile[i]] += d*CFG.nutrientPerMass;
  if (AN.mass[i] <= CFG.corpseMin){
    W.detritus[AN.tile[i]] += AN.mass[i]*CFG.nutrientPerMass;
    AN.mass[i] = 0; AN.stage[i] = 0; AN.free[AN.freeN++] = i; W.corpses--;
  }
}
function mutateAnimal(dst, src){
  const G = AN.genome;
  const rate = Math.max(CFG.mutationFloor, G[src+AG.mutationRate]);
  const scale = G[src+AG.mutationScale];
  for (let k = 0; k < A_ACTIVE; k++){
    let v = G[src+k];
    if (rng() < rate) v += gauss()*ASIG[k]*scale;
    G[dst+k] = clamp(v, AMIN[k], AMAX[k]);
  }
}
function buildTileOffsets(){
  const R = Math.ceil(60/W.tileSize)+1, a = [];
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++)
    a.push([dx, dy, Math.hypot(dx, dy)]);
  a.sort((u,v) => u[2]-v[2]);
  TOFF = new Int32Array(a.length*2); TOFFD = new Float32Array(a.length);
  for (let k = 0; k < a.length; k++){ TOFF[k*2]=a[k][0]; TOFF[k*2+1]=a[k][1]; TOFFD[k]=a[k][2]; }
}
function buildAnimalIndex(){
  const nT = W.n*W.n;
  if (!AIDX.start || AIDX.start.length !== nT+1){ AIDX.start = new Int32Array(nT+1); AIDX.cur = new Int32Array(nT); }
  if (!AIDX.items || AIDX.items.length < AN.max) AIDX.items = new Int32Array(AN.max);
  AIDX.start.fill(0);
  for (let i = 0; i < AN.hi; i++) if (AN.stage[i]) AIDX.start[AN.tile[i]+1]++;
  for (let t = 0; t < nT; t++) AIDX.start[t+1] += AIDX.start[t];
  AIDX.cur.set(AIDX.start.subarray(0, nT));
  for (let i = 0; i < AN.hi; i++) if (AN.stage[i]) AIDX.items[AIDX.cur[AN.tile[i]]++] = i;
}
function seedAnimalFounders(count){
  const G = AN.genome;
  const amorphs = drawMorphs(Math.max(1, CFG.founderMorphs|0), A_ACTIVE, ASTART, ASIG, AMIN, AMAX);
  for (let k = 0; k < count; k++){
    const i = allocAnimal(); if (i < 0) return;
    const g = i*AGENES;
    const mo = amorphs[k % amorphs.length];
    for (let j = 0; j < A_ACTIVE; j++)
      G[g+j] = clamp(mo[j] + gauss()*ASIG[j]*CFG.founderNoise, AMIN[j], AMAX[j]);
    AN.x[i] = rng()*W.size; AN.y[i] = rng()*W.size;
    if (!passable(tileOf(AN.x[i], AN.y[i]))){ AN.free[AN.freeN++] = i; continue; }
    AN.tile[i] = tileOf(AN.x[i], AN.y[i]);
    AN.hd[i] = rng()*Math.PI*2; AN.sp[i] = 0;
    const bm = G[g+AG.size]*G[g+AG.birthMassFraction];
    const need = bm*CFG.nutrientPerMass*2;
    if (W.nutrient[AN.tile[i]] < need){ AN.free[AN.freeN++] = i; continue; }
    W.nutrient[AN.tile[i]] -= need;          // matter has to come from somewhere
    AN.mass[i] = bm;
    AN.energy[i] = CFG.animalFounderEnergy;
    AN.gut[i] = bm*CFG.nutrientPerMass;
    AN.age[i] = 0; AN.stam[i] = 1; AN.gen[i] = 0; AN.up[i] = 0.05;
    AN.tgt[i] = -1; AN.act[i] = ACT_WANDER; AN.lin[i] = 0;
    AN.stage[i] = 1; AN.live++;
  }
}
// Upkeep composition, sampled from 1 plant in 64. I had to reconstruct this
// arithmetic by hand to find out that height cost 9% of upkeep and bought
// total grazing immunity; the log should never make that necessary again.
const UPK = new Float64Array(9);
let UPKN = 0;
// Selection differential accumulators: the mean genome of everything that
// actually reproduced. Minus the population mean, that is the breeder's
// equation selection differential S, and it shows which way a gene is being
// pushed now rather than after the mean has already moved.
const SELP = { acc:null, n:0 }, SELA = { acc:null, n:0 };
function selAccum(A, G, base, act){
  if (!A.acc) return;
  for (let k = 0; k < act; k++) A.acc[k] += G[base+k];
  A.n++;
}
function wrapDelta(d){ return d - W.size*Math.round(d/W.size); }

// Net worth of one plant to one grazer, per tick of grazing. Used both when
// choosing a target and when deciding whether to keep the current one, so
// the two can never disagree. Carries all three defences:
//   toughness -> bite RATE, fibre -> digestion, toxicity -> harm.
// How much of a plant a given animal can physically get at. A seedling is
// wholly available to anything; a tall plant keeps its crown out of reach.
// Graded rather than binary so height has a gradient to climb.
// LINEAR in size, so the biggest animals can browse the tallest plants.
// A sublinear exponent puts a ceiling on reach that plant height simply
// walks past, and then every plant is safe forever.
function reachOf(g){ return CFG.k_reach*Math.max(0.05, AN.genome[g+AG.size]); }
function accessOf(j, reach){
  if (CFG.k_reach <= 0) return 1;
  // CUBIC, not quadratic. A Lorentzian starting at 1 decays immediately, so
  // the first cut taxed every plant instead of protecting tall ones.
  // The SHAPE was never the problem; the SCALE was. At k_reach 0.0175 the
  // population sat at h/r 6.6, out on the dead tail where access is 0.003 and
  // nothing an animal can do about its own body changes that. Everything it
  // ate was a seedling, where access is ~1 and flat, so size saw only cost
  // and fell 2.96 -> 1.63, which made the tail worse. k_reach 0.060 puts the
  // operating point near h/r 1-2, where this curve has its steepest gradient
  // and the arms race is live in both directions.
  const r = reach || 1e-6, h = effHeight(j*PGENES, P.mass[j])/r;
  return 1/(1 + h*h*h);
}
// Energy per tick this animal would actually get from this plant, all three
// defences and reach included. The arbiter and the MVT test share it, so
// what an animal chooses and what it then earns can never disagree.
// Poison saturates: it can spoil a meal, not bankrupt the eater. Shared by
// the target score, the MVT yield and the bite, which were three separate
// expressions of the same idea and could quietly disagree with each other.
// CARRION DIGESTIBILITY. A SLOPE, NOT A CLAMP (design 6.1). Same 0.30 at
// carnivory 0 and the same 1.0 at carnivory 1 as max(carn, floor) gave, but
// with a gradient the whole way, so the first rung of the 7.2 ladder exists.
function carrionDigest(carn){
  return CFG.carrionFloor + (1 - CFG.carrionFloor)*carn;
}
function toxLoss(toxRaw, meal){
  return meal*CFG.toxMaxLoss*toxRaw/(toxRaw + meal + 1e-9);
}
// SATIATION. `AN.energy` was never bounded, so `energyCapacity` named a
// capacity it did not enforce — animals ran at three times their own cap and
// went on eating. `hunger` scales the arbiter SCORE, never the BITE, so a full
// animal that still ranks GRAZE highest ate at full rate forever and grazing
// pressure had no upper limit of any kind. A bite may now deliver only the
// energy there is room to store; the mass stays on the plant otherwise, which
// keeps both ledgers honest. `perMass` is the energy one unit of that food is
// worth to THIS animal, so a bad digester is limited less, not more.
function satiateBite(i, g, perMass){
  if (perMass <= 1e-9 || AN.up[i] <= 0) return Infinity;   // no upkeep yet, no cap yet
  const cap = AN.genome[g+AG.energyCapacity]*AN.up[i]*CFG.ticksPerDay;
  return Math.max(0, cap - AN.energy[i])/perMass;
}
function grazeYield(i, j, herb, fibreTol, toxRes, reach){
  const pg = j*PGENES, def = P.defence[j], g = i*AGENES;
  const tough  = P.genome[pg+PG.toughness]*def;
  const digest = herb/(1 + CFG.k_fibreBite*P.genome[pg+PG.fibre]*def*(1-fibreTol));
  const meal   = CFG.tissueValue*Math.max(0, digest);
  const toxRaw = P.genome[pg+PG.toxicity]*def*(1-toxRes)*CFG.k_toxinHarm;
  let bite = CFG.k_intake*Math.pow(AN.genome[g+AG.metabolicRate], CFG.metPow)
             *AN.genome[g+AG.biteForce]*Math.pow(AN.mass[i], CFG.biteMassPow)
             /(1 + CFG.k_toughBite*tough)*accessOf(j, reach);
  bite = Math.min(bite, P.mass[j]);
  return Math.max(0, bite*(meal - toxLoss(toxRaw, meal)));
}
// MARGINAL VALUE THEOREM, properly: choose a patch by its expected gain,
// leave it by its marginal rate. gain = patch/(travel + patch/rate), which
// tends to the rate for a big patch and to patch/travel for a small one.
// This shares every expression with grazeYield, which the previous version
// only CLAIMED to do: it scored a plant by min(1, mass/10) while the yield is
// bite-rate limited, so animals walked to big plants they could not eat and
// abandoned them 2.25 million times — 6.3 per animal per day.
// UNITS WARNING. Since v0.32 this returns an MVT gain in ENERGY PER TICK,
// while SCAVENGE, ATTACK, APPROACH, WANDER and REST all return dimensionless
// weights. They happen to balance within a factor of two at the current
// constants. Any change to tissueValue, gutCapMult or k_intake rescales GRAZE
// against every other action silently. If the arbiter ever needs retuning,
// put all seven scores in the same currency first.
function plantScore(j, d, herb, fibreTol, toxRes, pa, hunger){
  const pg = j*PGENES, def = P.defence[j];
  const digest = herb/(1 + CFG.k_fibreBite*P.genome[pg+PG.fibre]*def*(1-fibreTol));
  const meal   = digest*CFG.tissueValue;
  const toxRaw = P.genome[pg+PG.toxicity]*def*(1-toxRes)*CFG.k_toxinHarm;
  const net    = meal - toxLoss(toxRaw, meal);        // energy per unit mass
  if (net <= 0) return 0;
  let bite = ABITEC/(1 + CFG.k_toughBite*P.genome[pg+PG.toughness]*def)
             *accessOf(j, AREACH);
  if (bite > P.mass[j]) bite = P.mass[j];
  if (bite <= 1e-9) return 0;
  // a patch is worth what the gut can hold of it, not what the plant weighs
  const patch = Math.min(P.mass[j], AGUT)*net, rate = bite*net;
  return patch/(d/ASPD + patch/rate)*pa*hunger;
}
// state of the animal currently deciding, set once per senseDecide so the
// score helper stays a leaf function in the hot neighbour loop
let AREACH = 1, ABITEC = 0, ASPD = 0.1, AGUT = 1;
// a target an animal has demonstrably failed to reach is excluded from the
// very next decision, or it simply re-picks the same unreachable plant
let BANNED = -1;

// ---- sense + decide. Scans tiles nearest-first and stops after senseCap
// detections, so senseRange has a saturating benefit against a quadratic cost.
function senseDecide(i){
  const G = AN.genome, g = i*AGENES;
  const sr = G[g+AG.senseRange], sr2 = sr*sr;
  const ax = AN.x[i], ay = AN.y[i], mass = AN.mass[i];
  // capacity is DAYS OF UPKEEP, not mass. Denominating it in mass gave a founder
  // a capacity of 3.75 against 40 starting energy, so it converted its entire
  // reserve into body mass and starved — the v0.3.1 plant bug, other kingdom.
  const cap = Math.max(1e-6, G[g+AG.energyCapacity]*AN.up[i]*CFG.ticksPerDay);
  const hunger = clamp(1 - AN.energy[i]/cap, 0, 1)*G[g+AG.hungerUrgency] + 0.05;
  // C2: an animal has a preferred time of day. On-phase it senses well;
  // off-phase it rests better (applied in updateAnimal). Diurnal versus
  // nocturnal becomes a real niche axis, and it is a pure tradeoff.
  let dp = Math.abs((W.tick % CFG.ticksPerDay)/CFG.ticksPerDay - G[g+AG.activityPhase]);
  if (dp > 0.5) dp = 1 - dp;
  const onPhase = 1 - dp*2;
  const acuity = G[g+AG.senseAcuity]*(0.55 + 0.45*onPhase), herb = G[g+AG.herbivory];
  const fibreTol = G[g+AG.fibreTolerance], toxRes = G[g+AG.toxinResistance];
  const carn = G[g+AG.carnivory];
  AREACH = reachOf(g);
  ABITEC = CFG.k_intake*Math.pow(G[g+AG.metabolicRate], CFG.metPow)
           *G[g+AG.biteForce]*Math.pow(mass, CFG.biteMassPow);
  ASPD = Math.max(0.02, G[g+AG.maxSpeed]);
  AGUT = Math.max(1e-3, mass*CFG.gutCapMult);
  BANNED = -1;
  if (AN.stall[i] > CFG.stallLimit){        // give up on what you cannot reach
    BANNED = AN.tgt[i]; AN.tgt[i] = -1; AN.stall[i] = 0; AN.pursue[i] = 0;
  }
  // A hunt has to survive re-deciding. pursuitPersistence has sat unread in
  // the genome since phase 3; without it an attacker abandons every target
  // within a think-tick and can never finish one.
  if (AN.pursue[i] > 0){
    AN.pursue[i] -= CFG.animalThink;
    const p = AN.tgt[i];
    if (AN.act[i] === ACT_ATTACK && p >= 0 && AN.stage[p] === ALIVE
        && AN.stam[i] > G[g+AG.restThreshold]) return;
    AN.pursue[i] = 0;
  }
  const tx0 = (ax/W.tileSize)|0, ty0 = (ay/W.tileSize)|0;
  let bestS = 0, bestT = -1, bestAct = ACT_WANDER, found = 0, foundA = 0;
  // Plants and animals get SEPARATE detection budgets. Sharing one cap meant
  // a few plants in the nearest tile exhausted it before any animal was ever
  // looked at, so in a green world no animal could see another one at all —
  // and scavenging, the stepping stone to predation, could never start.

  for (let c = 0; c < TOFFD.length && (found < CFG.senseCap || foundA < CFG.senseCap); c++){
    if ((TOFFD[c]-1)*W.tileSize > sr) break;
    const tx = ((tx0+TOFF[c*2]) % W.n + W.n) % W.n;
    const ty = ((ty0+TOFF[c*2+1]) % W.n + W.n) % W.n;
    const t = ty*W.n + tx;
    const cover = Math.min(1, laiOf(t)*CFG.coverFactor);
    for (let k = PIDX.start[t]; k < PIDX.start[t+1] && found < CFG.senseCap; k++){
      const j = PIDX.items[k];
      if (P.stage[j] !== 2) continue;
      const dx = wrapDelta(P.x[j]-ax), dy = wrapDelta(P.y[j]-ay);
      const d2 = dx*dx+dy*dy; if (d2 > sr2) continue;
      const d = Math.sqrt(d2);
      // A plant's visibility scales with its bulk. Without this term a
      // 0.5-mass seedling was exactly as findable as a 184-mass tree, and
      // since seedlings were the only thing in reach, every recruit died.
      const pm = P.mass[j], vis = pm/(pm + CFG.visMass);
      if (rng() > clamp((sr-d)/sr, 0, 1)*acuity*(1-cover*0.6)*vis) continue;
      found++;
      if (j === BANNED) continue;
      const sc = plantScore(j, d, herb, fibreTol, toxRes, G[g+AG.plantAttraction], hunger);
      if (sc > bestS){ bestS = sc; bestT = j; bestAct = ACT_GRAZE; }
    }
    // Animals are always scanned now, not only when social. Four things can
    // be scored off one detection: herd-mate, prey, corpse, threat. Which one
    // wins is decided entirely by genes — there is no predator flag anywhere.
    for (let k = AIDX.start[t]; k < AIDX.start[t+1] && foundA < CFG.senseCap; k++){
      const j = AIDX.items[k];
      if (j === i || !AN.stage[j]) continue;   // corpses included: scavengers need them
      const dx = wrapDelta(AN.x[j]-ax), dy = wrapDelta(AN.y[j]-ay);
      const d2 = dx*dx+dy*dy; if (d2 > sr2) continue;
      const d = Math.sqrt(d2);
      const og = j*AGENES;
      // camouflage finally does something: it is a detection roll, not a
      // damage reduction. Until phase 4 it was a cost with no benefit.
      // C3: sitting still hides you. An ambusher pays for it in ground covered.
      const still = AN.sp[j] < 0.02 ? G[og+AG.ambushTendency] : 0;
      const hide = AN.stage[j] === CORPSE ? 0
                 : Math.min(0.95, G[og+AG.camouflage] + still*(1-G[og+AG.camouflage]));
      if (rng() > clamp((sr-d)/sr, 0, 1)*acuity*(1-hide)*(1-cover*0.6)) continue;
      foundA++;
      const omass = AN.mass[j];

      if (AN.stage[j] === CORPSE){
        // carrion: no armour, no retaliation, no chase. The cheap door into
        // meat-eating, which is why carnivory can get off the ground at all.
        const val = carrionDigest(carn)*CFG.meatValue*CFG.carrionValue
                    *Math.min(1, omass/8);
        const sc = val*G[g+AG.carrionAttraction]*hunger/(1 + d*0.04);
        if (sc > bestS){ bestS = sc; bestT = j; bestAct = ACT_SCAVENGE; }
        continue;
      }

      let td = 0;
      for (let q = 0; q < 3; q++){ const dd = G[g+AG.tag0+q]-G[og+AG.tag0+q]; td += dd*dd; }
      const kin = 1 - Math.sqrt(td/3);

      if (G[g+AG.socialAttraction] > 0.02){
        const sc = G[g+AG.socialAttraction]*(1 - G[g+AG.kinRecognition]*(1-kin))*0.35;
        if (sc > bestS){ bestS = sc; bestT = j; bestAct = ACT_APPROACH; }
      }

      // prey. sizeMatch is a Gaussian on the mass ratio, so specialists on
      // small prey, generalists and giant-killers all fall out of one term.
      const ratio = omass/Math.max(0.05, mass);
      const z = (ratio - G[g+AG.preySizeRatio])/Math.max(0.05, G[g+AG.preySizeTolerance]);
      const sizeMatch = Math.exp(-z*z);
      // C1: meatAttraction WEIGHTS the value of meat rather than gating the
      // action. Gating it multiplied two near-zero genes and made attack
      // unreachable; a 0.5-1.5 weight cannot do that.
      const meat = carn*CFG.meatValue*(0.5 + G[g+AG.meatAttraction])
                   *Math.min(1, omass/8)/(1 + CFG.k_armEff*G[og+AG.armour]);
      const risk = G[og+AG.biteForce]*G[og+AG.aggression]*CFG.k_retal;
      // aggression alone gates this (design 7). Multiplying by meatAttraction
      // as well squared a near-zero founding value and made attack unreachable.
      const sc = Math.max(0, meat - risk)*G[g+AG.aggression]*sizeMatch
                 *(1 - G[g+AG.kinRecognition]*kin)*hunger/(1 + d*0.04);
      if (sc > bestS){ bestS = sc; bestT = j; bestAct = ACT_ATTACK; }

      // threat. Being small and near something armed and hungry outranks food.
      const threat = G[og+AG.biteForce]*G[og+AG.carnivory]*G[og+AG.aggression]
                     *Math.min(4, omass/Math.max(0.05, mass));
      const fs = threat*G[g+AG.fearThreshold]*2.2/(1 + d*0.25);
      if (fs > bestS){ bestS = fs; bestT = j; bestAct = ACT_FLEE; }
    }
  }
  if (AN.stam[i] < G[g+AG.restThreshold]) { bestAct = ACT_REST; bestT = -1; bestS = 1e9; }
  else if (bestT < 0){ bestAct = ACT_WANDER; }
  // Marginal value theorem: stay while this plant beats your own running
  // mean intake. Comparing against the best plant in VIEW was noise, since
  // detection is stochastic; comparing against your own recent earnings is
  // both principled and self-damping, because a poor world lowers the bar.
  const cur = AN.tgt[i];
  if (AN.act[i] === ACT_GRAZE && cur >= 0 && P.stage[cur] === 2 && cur !== bestT){
    if (grazeYield(i, cur, herb, fibreTol, toxRes, AREACH) >= AN.rate[i]*CFG.mvtLeave) return;
    W.abandons++;
  }
  if (bestAct === ACT_ATTACK && bestT !== AN.tgt[i]) AN.pursue[i] = G[g+AG.pursuitPersistence];
  W.seenA += foundA; W.seenN++;
  AN.act[i] = bestAct; AN.tgt[i] = bestT;
}

// shared by the arbiter and the act phase so both agree on when an animal
// is in its active part of the day
function onPhaseOf(g){
  let dp = Math.abs((W.tick % CFG.ticksPerDay)/CFG.ticksPerDay - AN.genome[g+AG.activityPhase]);
  if (dp > 0.5) dp = 1 - dp;
  return 1 - dp*2;
}
function steer(i, tx, ty, frac){
  const G = AN.genome, g = i*AGENES, mass = AN.mass[i];
  const dx = wrapDelta(tx-AN.x[i]), dy = wrapDelta(ty-AN.y[i]);
  const want = Math.atan2(dy, dx);
  const turnCap = G[g+AG.turnRate]*CFG.turnScale/(1 + mass*CFG.massTurnPenalty);
  let dh = want - AN.hd[i];
  while (dh > Math.PI) dh -= 2*Math.PI;
  while (dh < -Math.PI) dh += 2*Math.PI;
  AN.hd[i] += clamp(dh, -turnCap, turnCap);
  const accCap = G[g+AG.acceleration]*CFG.accelScale;
  // Turning radius is speed/turnCap. If it exceeds the distance to the
  // target the animal orbits forever and starves — which is exactly what
  // they were doing. Cap approach speed so the circle fits: you must slow
  // down to turn tightly, which is how turning actually works.
  const dist = Math.sqrt(dx*dx + dy*dy);
  let want2 = G[g+AG.maxSpeed]*frac;
  if (turnCap > 1e-5) want2 = Math.min(want2, Math.max(0.02, dist*turnCap));
  AN.sp[i] += clamp(want2 - AN.sp[i], -accCap, accCap);
}

function updateAnimal(i){
  const G = AN.genome, g = i*AGENES;
  let mass = AN.mass[i];
  const t = AN.tile[i];
  // B4: metabolism buys throughput. Sublinear here, linear in upkeep below.
  const metT = Math.pow(G[g+AG.metabolicRate], CFG.metPow);

  // --- act
  const act = AN.act[i], tgt = AN.tgt[i];
  let moving = true, ate = 0;
  if (act === ACT_REST){
    AN.sp[i] *= 0.7; moving = AN.sp[i] > 0.01;
    AN.stam[i] = Math.min(1, AN.stam[i] + CFG.staminaRecover*metT*(1.4 - 0.8*onPhaseOf(g)));
  } else if (act === ACT_GRAZE && tgt >= 0 && P.stage[tgt] === 2){
    const dx = wrapDelta(P.x[tgt]-AN.x[i]), dy = wrapDelta(P.y[tgt]-AN.y[i]);
    const d = Math.sqrt(dx*dx+dy*dy);
    const reach = G[g+AG.biteRange] + Math.sqrt(leafArea(tgt*PGENES, P.mass[tgt])/Math.PI);
    if (d > reach){ steer(i, P.x[tgt], P.y[tgt], 1); AN.stall[i]++; }
    else {
      AN.stall[i] = 0;
      AN.sp[i] *= 0.5; moving = false;
      const pg = tgt*PGENES, def = P.defence[tgt];
      const tough = P.genome[pg+PG.toughness]*def;
      // realised access, logged: pEscape is a binary against median reach,
      // this is the browse fraction actually achieved, which is the number
      // that says whether the standing crop is food or scenery
      const acc = accessOf(tgt, reachOf(g));
      W.accSum += acc; W.accN++;
      const digest = G[g+AG.herbivory]/(1 + CFG.k_fibreBite*P.genome[pg+PG.fibre]*def*(1-G[g+AG.fibreTolerance]));
      let bite = CFG.k_intake*metT*G[g+AG.biteForce]*Math.pow(mass, CFG.biteMassPow)
                 /(1 + CFG.k_toughBite*tough)*acc;
      bite = Math.min(bite, P.mass[tgt], satiateBite(i, g, CFG.tissueValue*Math.max(0, digest)));
      if (bite > 0){
        P.mass[tgt] -= bite; W.eaten += bite; P.bit[tgt] = W.tick;
        AN.gut[i] += bite*CFG.nutrientPerMass;
        AN.energy[i] += bite*CFG.tissueValue*Math.max(0, digest);
        W.ePlant += bite*CFG.tissueValue*Math.max(0, digest);
        const meal   = CFG.tissueValue*Math.max(0, digest);
        const toxRaw = P.genome[pg+PG.toxicity]*def*(1-G[g+AG.toxinResistance])*CFG.k_toxinHarm;
        const tox    = bite*toxLoss(toxRaw, meal);
        AN.energy[i] -= tox; W.eToxin += tox;
        ate = bite;
        // net of poison, or the animal scores a toxic plant honestly and then
        // remembers it as clean, and the MVT test never learns to avoid it
        AN.rate[i] += (bite*CFG.tissueValue*Math.max(0, digest) - tox - AN.rate[i])*CFG.rateEwma;
        if (P.mass[tgt] < CFG.seedlingMass*0.3){ W.pDeadEat++; killPlant(tgt); }
      }
    }
  } else if (act === ACT_ATTACK && tgt >= 0 && AN.stage[tgt] === ALIVE){
    const dx = wrapDelta(AN.x[tgt]-AN.x[i]), dy = wrapDelta(AN.y[tgt]-AN.y[i]);
    const d = Math.sqrt(dx*dx+dy*dy);
    if (d > G[g+AG.biteRange]) steer(i, AN.x[tgt], AN.y[tgt], 1);
    else {
      const og = tgt*AGENES;
      // armour's BENEFIT saturates, its cost is linear — section 6.1
      const dmg = CFG.k_attack*metT*G[g+AG.biteForce]*Math.pow(mass, 0.75)*(0.8+rng()*0.4)
                  /(1 + CFG.k_armEff*G[og+AG.armour]);
      const flesh = Math.min(dmg, AN.mass[tgt],
                             satiateBite(i, g, CFG.meatValue*G[g+AG.carnivory]));
      if (flesh > 0){
        AN.mass[tgt] -= flesh;
        AN.gut[i] += flesh*CFG.nutrientPerMass;
        const gainE = flesh*CFG.meatValue*G[g+AG.carnivory];
        AN.energy[i] += gainE;
        ate = flesh; W.attacks++; W.fleshMass += flesh; W.eFlesh += gainE;
        AN.rate[i] += (gainE - AN.rate[i])*CFG.rateEwma;
        // it fights back, in proportion to what it is carrying
        AN.energy[i] -= G[og+AG.biteForce]*G[og+AG.aggression]*CFG.k_retal;
        AN.stam[i] = Math.max(0, AN.stam[i] - CFG.staminaDrain*2);
        moving = false; AN.sp[i] *= 0.5;
        if (AN.mass[tgt] <= CFG.corpseMin){ W.aDeadKilled++; killAnimal(tgt); }
      }
    }
  } else if (act === ACT_SCAVENGE && tgt >= 0 && AN.stage[tgt] === CORPSE){
    const dx = wrapDelta(AN.x[tgt]-AN.x[i]), dy = wrapDelta(AN.y[tgt]-AN.y[i]);
    const d = Math.sqrt(dx*dx+dy*dy);
    if (d > G[g+AG.biteRange]) steer(i, AN.x[tgt], AN.y[tgt], 1);
    else {
      moving = false; AN.sp[i] *= 0.5;
      const carVal = CFG.meatValue*CFG.carrionValue*carrionDigest(G[g+AG.carnivory]);
      const bite = Math.min(CFG.k_attack*metT*G[g+AG.biteForce]*Math.pow(mass, 0.75),
                            AN.mass[tgt], satiateBite(i, g, carVal));
      if (bite > 0){
        AN.mass[tgt] -= bite;
        AN.gut[i] += bite*CFG.nutrientPerMass;
        const gainE = bite*carVal;
        AN.energy[i] += gainE;
        ate = bite; W.scavenged++; W.carrionMass += bite; W.eCarrion += gainE;
        AN.rate[i] += (gainE - AN.rate[i])*CFG.rateEwma;
        if (AN.mass[tgt] <= CFG.corpseMin){
          W.detritus[AN.tile[tgt]] += AN.mass[tgt]*CFG.nutrientPerMass;
          AN.mass[tgt] = 0; AN.stage[tgt] = 0;
          AN.free[AN.freeN++] = tgt; W.corpses--;
        }
      }
    }
  } else if (act === ACT_FLEE && tgt >= 0 && AN.stage[tgt] === ALIVE){
    const dx = wrapDelta(AN.x[tgt]-AN.x[i]), dy = wrapDelta(AN.y[tgt]-AN.y[i]);
    steer(i, AN.x[i]-dx, AN.y[i]-dy, 1);
    AN.sp[i] = Math.min(G[g+AG.maxSpeed], AN.sp[i] + 0.06);
  } else if (act === ACT_APPROACH && tgt >= 0 && AN.stage[tgt] === ALIVE){
    const dx = wrapDelta(AN.x[tgt]-AN.x[i]), dy = wrapDelta(AN.y[tgt]-AN.y[i]);
    const d = Math.sqrt(dx*dx+dy*dy);
    if (d > G[g+AG.socialRadius]) steer(i, AN.x[tgt], AN.y[tgt], 0.6);
    else { AN.sp[i] *= 0.85; moving = AN.sp[i] > 0.01; }
  } else {
    AN.hd[i] += (rng()-0.5)*0.25*G[g+AG.explorationBias];
    AN.sp[i] += clamp(G[g+AG.maxSpeed]*0.45 - AN.sp[i], -0.05, 0.05);
  }

  // --- move. Steep ground drags, peaks are a wall. An animal that walks
  // into a mountain turns along it rather than sticking, so ranges deflect
  // movement instead of collecting a rim of trapped animals.
  if (AN.sp[i] > 0){
    const drag = terrainDrag(t, G[g+AG.climbing]);
    const step = AN.sp[i]*drag;
    const nx = (AN.x[i] + Math.cos(AN.hd[i])*step + W.size) % W.size;
    const ny = (AN.y[i] + Math.sin(AN.hd[i])*step + W.size) % W.size;
    const nt = tileOf(nx, ny);
    if (passable(nt)){
      AN.x[i] = nx; AN.y[i] = ny; AN.tile[i] = nt;
    } else {
      AN.hd[i] += (rng() < 0.5 ? -1 : 1)*(0.6 + rng()*0.8);
      AN.sp[i] *= 0.3;
    }
  }
  const v = AN.sp[i];
  if (v > 0.02) AN.stam[i] = Math.max(0, AN.stam[i] - CFG.staminaDrain*v/Math.max(0.01, G[g+AG.maxSpeed]));
  else AN.stam[i] = Math.min(1, AN.stam[i] + CFG.staminaRecover*0.5);

  // --- metabolise (design 6.3). Every term curves up faster than its benefit.
  const m75 = Math.pow(mass, 0.75);
  const life = G[g+AG.lifespan];
  let sen = 1;
  if (AN.age[i] > life) sen = Math.min(20, 1 + G[g+AG.senescenceRate]*(AN.age[i]-life)/life);
  const winter = Math.max(0, -Math.sin(2*Math.PI*yearPhase()))*CFG.seasonAmp;
  // Capability costs: the price of OWNING an organ, which in a real body
  // scales with the body. Left flat, these are a tax that a juvenile cannot
  // pay out of m^0.75 of an adult intake — and 73-85% of deaths were
  // juveniles. k_bite is in here rather than /sqrt(mass); see the header.
  const capability = CFG.a_base
    + CFG.k_sense*G[g+AG.senseRange]**2*G[g+AG.senseAcuity]**2
    + CFG.k_bite*G[g+AG.biteForce]**2
    + CFG.k_camo*G[g+AG.camouflage]**2
    + CFG.k_digest*Math.max(0, G[g+AG.carnivory]+G[g+AG.herbivory]-1)**2
    + CFG.k_mixed*Math.max(0, G[g+AG.carnivory]*G[g+AG.herbivory] - CFG.mixedFree)
    + CFG.k_fibreC*G[g+AG.fibreTolerance]**2
    + CFG.k_toxinC*G[g+AG.toxinResistance]**2
    + CFG.k_thermal*G[g+AG.thermalTolerance]**2
    + CFG.k_climbC*G[g+AG.climbing]**2;
  const upkeep = (capability*(m75/CFG.upkeepRefM75)
    + CFG.a_mass*m75
    + (moving ? CFG.k_move*mass*v*v : 0)
    + CFG.k_accel*mass*G[g+AG.acceleration]**2
    + CFG.k_turn*mass*G[g+AG.turnRate]**2
    + CFG.k_armourC*G[g+AG.armour]*mass
    + CFG.k_biteRangeC*G[g+AG.biteRange]**2*m75          // B5
    + CFG.k_storeC*G[g+AG.energyCapacity]*m75            // B6
    + CFG.k_longevityA*life*m75/(G[g+AG.senescenceRate]+0.2)
    )*G[g+AG.metabolicRate]*sen*(1 + winter*(1-G[g+AG.thermalTolerance]));
  AN.energy[i] -= upkeep;
  AN.up[i] = upkeep;
  W.aUpSum += upkeep; W.aTicks++; if (ate > 0) W.aFeedTicks++;
  AN.age[i] += 1;
  if (ate <= 0) AN.rate[i] -= AN.rate[i]*CFG.rateEwma;   // decay when not feeding
  if (AN.energy[i] <= 0 || AN.age[i] > life*3){
    if (AN.age[i] > life*3) W.aDeadAge++;
    if (AN.age[i] > life) W.aDeadSen++; else W.aDeadStarve++;
    // age at death against maturity: if this sits near zero the population is
    // newborns dying before they ever feed, not adults being outcompeted
    W.aDeathAge += AN.age[i]; W.aDeathN++;
    let db = (AN.age[i]/Math.max(1, G[g+AG.maturityAge])*4)|0;
    if (db > 7) db = 7; if (db < 0) db = 0;
    DAGE[db]++;
    killAnimal(i); return;
  }

  // --- grow: needs energy AND matter, exactly like a plant
  const room = G[g+AG.size] - mass;
  const cap = Math.max(1e-6, G[g+AG.energyCapacity]*upkeep*CFG.ticksPerDay);
  // A8: GROWTH IS SUBORDINATE TO BREEDING ONCE MATURE. Growth used to fire at
  // cap*0.5 while reproduction waited for matingThreshold*cap, and matingThreshold
  // sat at its 0.60 founder value in all three v0.35 seeds. Growth therefore
  // triggered at a strictly lower energy than breeding and drained the pool every
  // time it filled — and since it can absorb ~6 energy/tick against an observed
  // surplus of ~0.03, it took all of it. mass/size stuck at 0.53-0.75, so room>0
  // was permanently true and reproduction was unreachable: mean standing energy
  // was below even the growth gate in 2 of 3 seeds, lifetime output 0.33-1.00.
  // Juveniles grow at the old gate; adults may only grow on energy ABOVE the full
  // reproductive requirement. This also gives `size` a second, demographic cost —
  // a bigger adult size is a longer juvenile period spent at risk of starving
  // before breeding once — which is the term that was missing from the runaway.
  // The true bar is the whole clutch cost, not matingThreshold alone: an adult
  // parked between the two would otherwise grow itself back down to the lower
  // one forever and never fund a single birth. Hoisted so both gates read it.
  const birth = G[g+AG.size]*G[g+AG.birthMassFraction];
  const nbUp = Math.max(1e-6, upkeep*Math.pow(birth/Math.max(1e-6, mass), 0.75));
  const invest = G[g+AG.offspringInvestment]*nbUp*CFG.ticksPerDay;
  const buildE = birth*CFG.energyPerMassA;
  const reproNeed = Math.max(G[g+AG.matingThreshold]*cap, invest + buildE + cap*0.2);
  const growGate = (AN.age[i] > G[g+AG.maturityAge]) ? Math.max(cap*0.5, reproNeed)
                                                     : cap*0.5;
  if (room > 0 && AN.energy[i] > growGate){
    const dM = Math.min((AN.energy[i]-growGate)/CFG.energyPerMassA,
                        AN.gut[i]/CFG.nutrientPerMass, room, (mass*0.02+0.01)*metT);
    if (dM > 0){
      AN.mass[i] = mass = mass + dM;
      AN.energy[i] -= dM*CFG.energyPerMassA;
      AN.gut[i] -= dM*CFG.nutrientPerMass;
    }
  }
  // undigested matter is excreted, not destroyed
  const gutCap = mass*CFG.nutrientPerMass*CFG.gutCapMult;
  if (AN.gut[i] > gutCap){ W.detritus[t] += AN.gut[i]-gutCap; AN.gut[i] = gutCap; }

  // --- reproduce (asexual + mutation in phase 3; crossover at phase 5)
  if (AN.age[i] > G[g+AG.maturityAge] && AN.energy[i] > G[g+AG.matingThreshold]*cap){
    // birth / nbUp / invest / buildE are hoisted above the growth block (A8) so
    // growGate can read the real clutch cost. Kept here as comments only.
    // RESERVES ARE UPKEEP-DAYS, NOT ENERGY. Plant storage and the animal
    // energy cap were both fixed versions ago; this was the one site
    // left in raw energy, and selection duly drove it to 0.763 against an
    // upkeep of 0.0423 — eighteen ticks of life for a newborn. 84% of all
    // animal deaths landed in the first quarter of maturity and aBorn tracked
    // aDeadStarve exactly. The newborn's own upkeep is the parent's by
    // Kleiber, which is the only estimate available before it exists.
    // A1: building a body costs energy here exactly as it does when a plant
    // grows or a seed germinates. Taking the matter from the gut closed the
    // matter ledger and hid this for thirty versions, but the tissue was
    // being minted free, and free offspring are why the fauna was nothing
    // but newborns starving faster than they could be replaced.
    let want = G[g+AG.offspringCount]|0;
    while (want-- > 0){
      const need = birth*CFG.nutrientPerMass;
      if (AN.energy[i] < invest + buildE + cap*0.2 || AN.gut[i] < need) break;
      const c = allocAnimal(); if (c < 0) break;
      mutateAnimal(c*AGENES, g);
      AN.x[c] = AN.x[i]; AN.y[c] = AN.y[i]; AN.tile[c] = AN.tile[i];
      AN.hd[c] = rng()*Math.PI*2; AN.sp[c] = 0;
      AN.mass[c] = birth; AN.energy[c] = invest; AN.gut[c] = 0;
      AN.age[c] = 0; AN.stam[c] = 1; AN.gen[c] = AN.gen[i]+1;
      // satiateBite reads AN.up, and a recycled slot still holds the previous
      // occupant's upkeep. Seed it with the Kleiber estimate already computed.
      AN.up[c] = nbUp;
      AN.tgt[c] = -1; AN.act[c] = ACT_WANDER; AN.lin[c] = AN.lin[i];
      AN.stage[c] = 1; AN.live++;
      if ((W.aBorn++ & 7) === 0) selAccum(SELA, AN.genome, g, A_ACTIVE);
      AN.energy[i] -= invest + buildE; AN.gut[i] -= need;
    }
  }
}

function updateAnimals(){
  buildAnimalIndex();
  const phase = W.tick % CFG.animalThink;
  for (let i = 0; i < AN.hi; i++){
    if (!AN.stage[i]) continue;
    if (AN.stage[i] === CORPSE){ decayCorpse(i); continue; }
    if (i % CFG.animalThink === phase) senseDecide(i);
    updateAnimal(i);
  }
}

function tick(){
  W.tick++;
  updatePlants();
  updateAnimals();
  if (W.tick % CFG.diffuseEvery === 0){ diffuse(); decay(); }
  if (W.tick % CFG.lineageEvery === 0) reclusterLineages();
  if (W.tick % CFG.statEvery === 0) collectStats();
  if (W.tick % LOG.every === 0){
    if (W.tick % CFG.statEvery !== 0) collectStats();
    logSample();
  }
  if (W.tick % TPD() === 0){
    const day = W.tick/TPD();
    // The nets are LIFE SUPPORT and were invisible in the log. Three runs held
    // 135-190 animals to the day the net expired and then died, which reads
    // exactly like a population living off carrion. Count every propped body.
    if (day <= CFG.reseedDays && P.live < CFG.reseedFloor){
      const need = CFG.reseedFloor - P.live;
      seedFounders(need); W.pReseed += need;
      if (W.pReseed === need) logEvent('plant-net-first', {n:need});
    }
    // grazers are introduced once the vegetation exists, then netted briefly
    if (day === CFG.animalStartDay) seedAnimalFounders(CFG.animalFounders);
    else if (day > CFG.animalStartDay && day <= CFG.animalStartDay + CFG.animalReseedDays
             && AN.live < CFG.animalFloor){
      const need = CFG.animalFloor - AN.live;
      seedAnimalFounders(need); W.aReseed += need;
      if (W.aReseed === need) logEvent('animal-net-first', {n:need, day:day});
    }
    if (day === CFG.animalStartDay + CFG.animalReseedDays) logEvent('animal-net-off', {n:W.aReseed});
  }
}

//==========================================================================
// 7. LINEAGES — instrumentation, NOT species. Both kingdoms.
//    Online centroid clustering over a morphology subset. Reproduction is
//    clonal until phase 5, so there are no reproductive barriers to draw a
//    boundary at; phase 5 swaps the distance test for the reproductive one and
//    the bookkeeping here stays. Labelled "lineages", never "species".
//==========================================================================
const MAXLIN = 12, LHN = 120;
const LINCOL = ['#7FC24A','#E0A23C','#D9704A','#C9558E','#8A6BD9','#4A86E0',
                '#3FB6B0','#8FA33C','#D9536B','#6FA3C4','#B08A5A','#9A9A88'];
// 44 x 34 = 1,496 names before the numeric suffix has to appear
const SYL1 = ['ka','ve','tor','mi','sa','lu','dra','no','pi','ze','gar','hy','ru','ba','fen','ol',
              'qua','thal','bri','sen','vor','ash','mel','cor','ith','nal','pyr','ost','wen','jul',
              'kes','arn','sol','tir','umb','yar','ele','zon','hal','mir','cae','dun','oph','vex'];
const SYL2 = ['ndra','lix','mor','tha','ven','sil','kor','nis','pha','dus','rin','sha',
              'thys','gan','vane','lor','myr','cta','ssos','beth','quin','dar','wyn','osi',
              'thra','lume','vash','ndil','cyne','ther','ral','skia','onyx','vell'];

function makeClusterSet(spec){
  const K = spec.genes.length;
  const set = {
    spec, K,
    gi:  new Int32Array(K), lo: new Float64Array(K), span: new Float64Array(K),
    cent:new Float64Array(MAXLIN*K), acc:new Float64Array(MAXLIN*K),
    pop: new Int32Array(MAXLIN),  prev: new Int32Array(MAXLIN),
    // which cluster this one budded off from, so a family tree can be drawn.
    // -1 means founder. Set once at creation and never rewritten.
    parent: new Int32Array(MAXLIN).fill(-1),
    fname: new Array(MAXLIN).fill(''),
    tree: [],                      // {n,p,t} — survives slot reuse

    alive:new Uint8Array(MAXLIN), born: new Float64Array(MAXLIN),
    hold: new Int32Array(MAXLIN),          // consecutive passes above minPop
    sA:  new Float64Array(MAXLIN), sB: new Float64Array(MAXLIN),
    name:new Array(MAXLIN).fill(''), order: [], n: 0,
    hist:new Float32Array(MAXLIN*LHN), hw: 0, hn: 0,
    vec: new Float64Array(K)
  };
  for (let k = 0; k < K; k++){
    const gi = spec.idx[spec.genes[k]];
    set.gi[k] = gi; set.lo[k] = spec.min[gi];
    set.span[k] = (spec.max[gi]-spec.min[gi]) || 1;
  }
  return set;
}
function linReset(S){
  S.alive.fill(0); S.pop.fill(0); S.prev.fill(0);
  S.name.fill(''); S.n = 0; S.order = []; S.hn = 0; S.hw = 0;
  if (S.hold) S.hold.fill(0);
  // Names were only de-duplicated against LIVE lineages, so a dead cluster's
  // name went back in the pool: 240 tree entries under 85 names, 'Melthys'
  // fourteen times. The tree exists to record ancestry and could not tell two
  // clusters apart. `used` persists for the life of the run.
  S.used = Object.create(null);
}
function linName(S, a){
  let h = 2166136261;
  for (let k = 0; k < S.K; k++){ h ^= Math.round(S.cent[a*S.K+k]*97); h = Math.imul(h, 16777619); }
  h = h >>> 0;
  let nm = SYL1[h % SYL1.length] + SYL2[(h>>>5) % SYL2.length];
  nm = nm[0].toUpperCase() + nm.slice(1);
  // The base name is a hash of the centroid, so a morph that re-emerges in the
  // same region of gene space keeps its family name and the serial says which
  // instance it is.
  if (!S.used) S.used = Object.create(null);
  let out = nm, q = 2;
  while (S.used[out] || S.name.indexOf(out) >= 0) out = nm + ' ' + (q++);
  S.used[out] = 1;
  return out;
}
function recluster(S){
  const sp = S.spec, G = sp.genome(), hi = sp.hi(), lin = sp.lin(), K = S.K, split = CFG.lineageSplit;
  S.prev.set(S.pop);
  S.pop.fill(0); S.acc.fill(0); S.sA.fill(0); S.sB.fill(0);
  let created = 0, total = 0;
  for (let i = 0; i < hi; i++){
    if (!sp.alive(i)) continue;
    total++;
    const base = i*sp.stride;
    for (let k = 0; k < K; k++) S.vec[k] = (G[base+S.gi[k]] - S.lo[k])/S.span[k];
    let best = -1, bd = 1e9;
    for (let a = 0; a < MAXLIN; a++){
      if (!S.alive[a]) continue;
      let d = 0;
      for (let k = 0; k < K; k++){ const q = S.vec[k]-S.cent[a*K+k]; d += q*q; }
      d = Math.sqrt(d/K);
      if (d < bd){ bd = d; best = a; }
    }
    if ((best < 0 || bd > split) && created === 0){
      let slot = -1;
      for (let a = 0; a < MAXLIN; a++) if (!S.alive[a]){ slot = a; break; }
      if (slot >= 0){
        for (let k = 0; k < K; k++) S.cent[slot*K+k] = S.vec[k];
        // PROVISIONAL. No name, no tree entry, no place in linP until it has
        // held minPop for lineageConfirm consecutive passes. A cluster seeded
        // from one outlier genome and published in the same instant is how the
        // tree came to record "Corvell from Nother" eleven separate times.
        S.alive[slot] = 1; S.born[slot] = W.tick; S.name[slot] = '';
        S.hold[slot] = 0;
        // nearest CONFIRMED cluster is the parent: this genome budded off it
        S.parent[slot] = best; S.fname[slot] = best >= 0 ? S.name[best] : '';
        best = slot; created = 1;
      }
    }
    // Stickiness. Reassigning from scratch every pass let two nearby
    // centroids in a continuous distribution trade hundreds of members back
    // and forth, which is why a named lineage swung between hundreds and
    // zero. You keep your lineage unless something is clearly closer.
    const cur = lin[i];
    if (created === 0 && cur !== best && cur >= 0 && cur < MAXLIN && S.alive[cur]){
      let dc = 0;
      for (let k = 0; k < K; k++){ const q = S.vec[k]-S.cent[cur*K+k]; dc += q*q; }
      if (Math.sqrt(dc/K) < bd*CFG.linStick) best = cur;
    }
    if (best < 0) continue;
    lin[i] = best; S.pop[best]++;
    for (let k = 0; k < K; k++) S.acc[best*K+k] += S.vec[k];
    S.sA[best] += sp.statA(i); S.sB[best] += sp.statB(i);
  }
  const minPop = Math.max(8, Math.floor(total*CFG.lineageMin));
  for (let a = 0; a < MAXLIN; a++){
    if (!S.alive[a]) continue;
    const q = S.pop[a];
    if (q === 0 || (q < minPop && W.tick - S.born[a] > CFG.lineageEvery)){
      S.alive[a] = 0; S.name[a] = ''; S.hold[a] = 0; S.pop[a] = 0; continue;
    }
    // a provisional cluster earns its name by holding, not by appearing
    if (!S.name[a]){
      S.hold[a] = q >= minPop ? S.hold[a]+1 : 0;
      if (S.hold[a] >= CFG.lineageConfirm){
        S.name[a] = linName(S, a);
        S.tree.push({ n:S.name[a], p:S.fname[a], t:W.tick });
        if (S.tree.length > 240) S.tree.shift();
      }
    }
    for (let k = 0; k < K; k++) S.cent[a*K+k] = S.acc[a*K+k]/q;
    S.sA[a] /= q; S.sB[a] /= q;
  }
  for (let a = 0; a < MAXLIN; a++){
    if (!S.alive[a]) continue;
    for (let b = a+1; b < MAXLIN; b++){
      if (!S.alive[b]) continue;
      let d = 0;
      for (let k = 0; k < K; k++){ const q = S.cent[a*K+k]-S.cent[b*K+k]; d += q*q; }
      if (Math.sqrt(d/K) < split*0.6){
        const keep = S.pop[a] >= S.pop[b] ? a : b, drop = keep === a ? b : a;
        S.pop[keep] += S.pop[drop]; S.alive[drop] = 0; S.name[drop] = ''; S.hold[drop] = 0;
        for (let i = 0; i < hi; i++) if (lin[i] === drop) lin[i] = keep;
        if (drop === a) break;
      }
    }
  }
  for (let i = 0; i < hi; i++){
    if (!sp.alive(i) || S.alive[lin[i]]) continue;
    const base = i*sp.stride;
    for (let k = 0; k < K; k++) S.vec[k] = (G[base+S.gi[k]] - S.lo[k])/S.span[k];
    let best = -1, bd = 1e9;
    for (let a = 0; a < MAXLIN; a++){
      if (!S.alive[a]) continue;
      let d = 0;
      for (let k = 0; k < K; k++){ const q = S.vec[k]-S.cent[a*K+k]; d += q*q; }
      if (d < bd){ bd = d; best = a; }
    }
    if (best >= 0) lin[i] = best;
  }
  for (let a = 0; a < MAXLIN; a++) S.hist[a*LHN + S.hw] = S.pop[a];
  S.hw = (S.hw+1) % LHN; if (S.hn < LHN) S.hn++;
  S.n = 0; S.order = [];
  for (let a = 0; a < MAXLIN; a++) if (S.alive[a] && S.name[a]){ S.n++; S.order.push(a); }
  S.order.sort((x,y) => S.pop[y] - S.pop[x]);
}

function collectStats(){
  let n=0,h=0,eh=0,m=0,sp=0,gn=0,lf=0,mu=0,sh=0,en=0;
  for (let i = 0; i < P.hi; i++){
    if (P.stage[i] !== 2) continue;
    const g = i*PGENES;
    n++; h+=P.genome[g+PG.height]; eh+=effHeight(g,P.mass[i]);
    m+=P.mass[i]; sp+=P.genome[g+PG.canopySpread];
    gn+=P.gen[i]; lf+=P.genome[g+PG.lifespan]; mu+=P.genome[g+PG.mutationRate];
    sh+=P.genome[g+PG.shadeTolerance]; en+=P.energy[i];
  }
  const d = n || 1;
  ST.pop=n; ST.seeds=P.seeds; ST.h=h/d; ST.eh=eh/d; ST.mass=m/d; ST.spread=sp/d; ST.en=en/d;
  ST.gen=gn/d; ST.life=lf/d; ST.mut=mu/d; ST.shade=sh/d;
  let an=0,ag=0,am=0,asp=0,ah=0,ase=0;
  for (let i = 0; i < AN.hi; i++){
    // ALIVE only. This counted corpses for thirty versions: s3478 day 391 read
    // 208 animals of which 128 were corpses, on the HUD and in the log alike.
    if (AN.stage[i] !== ALIVE) continue;
    const g = i*AGENES;
    an++; ag+=AN.gen[i]; am+=AN.mass[i];
    asp+=AN.genome[g+AG.maxSpeed]; ah+=AN.genome[g+AG.herbivory]; ase+=AN.genome[g+AG.senseRange];
  }
  const ad = an || 1;
  ST.apop=an; ST.agen=ag/ad; ST.amass=am/ad; ST.aspeed=asp/ad; ST.aherb=ah/ad; ST.asense=ase/ad;
  let tg=0; for (let i = 0; i < P.hi; i++) if (P.stage[i]===2) tg += P.genome[i*PGENES+PG.toughness]*P.defence[i];
  ST.atough = tg/d;
  HIST.pop[HIST.w]=n; HIST.anim[HIST.w]=an; HIST.h[HIST.w]=ST.eh;
  HIST.w=(HIST.w+1)%HN; if (HIST.n < HN) HIST.n++;
  measure();
}
