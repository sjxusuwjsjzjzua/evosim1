<!--
  EVOLUTION SIMULATOR — single self-contained HTML file, canvas 2D, no build step
  version 0.36.0  ·  2026-08-06  ·  formatVersion 36

  Version history is in CHANGELOG.md. Per-gene accounting is in GENE-LEDGER.md.
  The spec is DESIGN.md; section numbers there are referenced from code comments
  (`design 6.1`) and are stable. Current state and open questions: STATE.md.

  INVARIANTS. Every one of these was learned by breaking it, most of them twice.

   1. MATTER IS A CLOSED STOCK, ENERGY IS AN OPEN FLOW. Capping a field is a
      sink. float32 is a sink — soil, detritus and scratch are f64.
   2. A CLOSED MATTER LEDGER DOES NOT PROVE A CLOSED ENERGY LEDGER. Germination
      and animal birth both minted free tissue for dozens of versions while
      matter closed perfectly. Charge energyPerMass at every site that makes
      mass.
   3. COST MUST CURVE UP FASTER THAN BENEFIT, or the gene pins to a bound and
      its tradeoff is fictional. Prefer a saturating form to a clamp: a clamp
      leaves a linear ramp below it and dead flat ground above.
   4. EVERY UPKEEP TERM SCALES WITH mass^0.75. A flat term is a tax that kills
      juveniles.
   5. RESERVES ARE DENOMINATED IN UPKEEP-DAYS, NOT ENERGY OR MASS. Missed in
      both kingdoms, and again in offspringInvestment as late as v0.32.
   6. CHECK ACHIEVABLE RANGES, NOT JUST FORMULA SHAPES. A correct mechanism at
      the wrong scale does nothing: reach vs height, seed dormancy, rootDepth,
      k_heightMass — twice.
   7. NEVER CALIBRATE A CONSTANT AGAINST A STATISTIC MEASURED IN A BROKEN RUN.
      k_reach 0.060 came from a mean height measured in a collapsed flora.
   8. WHATEVER CAPS THE POPULATION IS WHAT DOES THE SELECTING. Slot pools are a
      balance parameter, not a memory setting.
   9. COMPETITION MUST BE ASYMMETRIC or no organism size is preferred. Height is
      earned with mass; reach is linear in size.
  10. NEVER MULTIPLY TWO GATE GENES in a behaviour score.
  11. NOTHING ABOUT TROPHIC ROLES IS HARDCODED. No predator flag, no herbivore
      class. Roles emerge from digestion genes and energy costs.
  12. THE SYSTEM IS CHAOTIC. A single-seed A/B once gave identical plant counts
      and 4x the animals. Believe nothing that does not repeat across seeds.
  13. GENE COUNT AND ORDER ARE FROZEN: plant 39 active + 32 padding = 71,
      animal 54 active + 31 padding = 85. Changing either invalidates every
      save and fossil record and must be flagged loudly. Add at the first
      padding index.
  14. A SYNTAX CHECK IS NOT A CORRECTNESS CHECK and a call check is not an
      identifier check. Run check.js after every edit.
  15. GROWTH MUST NOT OUTBID BREEDING. Any allocation gate that fires at a lower
      energy than reproduction takes the whole surplus, because growth absorbs
      ~6 energy/tick against a surplus of ~0.03. v0.35 gated growth at cap*0.5
      and breeding at matingThreshold*cap (0.60) and the fauna simply never bred
      — mass/size stuck at 0.53-0.75, lifetime output 0.33-1.00, R0 < 1.
  16. A CLAMPED GENE RANGE IS A SELECTION PRESSURE. mutateAnimal clamps, so a
      drifting gene walks to the MIDDLE of its declared range, not to its
      founder. Any range set wide "to be safe" and asymmetric about the founder
      will drag that gene whenever Ne is small. size .2-40 pulled toward 20.1.
      Check the midpoint of every range you widen.

  v0.35.0: provisional lineage clusters (a cluster earns a name only after
  holding minPop for lineageConfirm passes — the tree was recording phantoms);
  new pLocked column (refuge measured by BIOMASS, not plant count) and
  aDeadSen; header history moved to CHANGELOG.md. v0.34.0's carrion changes are
  untouched and still unrun.
-->
<html lang="en">
<head>

<style>

  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  #arc{position:fixed;top:0;left:0;right:0;height:3px;z-index:3;transition:opacity .4s;

<script>
'use strict';
//==========================================================================
// 1. CONFIG — everything tunable lives here. EVERY k_ IS A GUESS.
//==========================================================================
const VERSION = '0.36.0', FORMAT_VERSION = 36;

const CFG = {
  // ---- world (rebuild required) ----
  seed: 1337,
  worldSize: 768,      // 23 tiles x 16 units - keep this ratio at 16
  tiles: 48,             // tileArea 256 — leaf beyond this is wasted
  maxPlants: 90000,

  // ---- time ----
  ticksPerDay: 480,
  daysPerYear: 40,
  watchTPS: 30,

  // ---- light ----
  sunPeak: 1.00,
  // --- terrain -------------------------------------------------------
  elevAmp: 1.00,         // scales the whole elevation field
  ridgeSharp: 1.35,      // >1 sharpens ridges into ranges
  germFertMin: 0.08,     // fertility below which a seed simply cannot start
  foothill: 0.68,        // SHARE OF THE MAP that is ordinary lowland
  treeLine: 0.88,        // above this share, nothing germinates (12% of map)
  peakElev: 0.94,        // absolute wall: nothing crosses (top 6% of map)
  altBite: 0.85,         // how hard altitude hits plant growth
  aridAmp: 1.00,         // scales the aridity field
  aridBite: 0.75,        // how hard dryness hits fertility
  k_climbSlow: 0.92,     // speed lost on steep ground by a non-climber
  k_climbC: 0.010,       // x climbing^2, in the capability group
  lightNoiseAmp: 0.45,
  latitudeBand: 0.25,
  seasonAmp: 0.35,

  // ---- soil ----
  nutrientCap: 12.00,     // INIT ONLY. Field is uncapped at runtime (matter ledger)
  nutrientStart: 6.00,   // per TILE — scales with tile area, not world area
  nutrientNoiseAmp: 0.60,
  diffuseFloor: 0.08,    // minimum share of the diffusion rate on dead ground
  diffuseRate: 0.12,
  diffuseEvery: 8,
  decayRate: 0.004,

  // ---- plant energy ----
  k_photo: 0.100,       // a tile only yields light x area — this sets the ceiling
  k_base: 0.00040,
  k_mass: 0.00075,
  k_leaf: 0.00050,
  k_height: 0.00120,
  k_root: 0.00035,
  k_photoCost: 0.01000,  // x eff^2 x leaf — quadratic, or eff pins to a rail
  k_longevity: 8e-9,     // x lifespan x mass^0.75 — kept scale-neutral
  k_shade: 1.50,
  k_shadeCost: 0.45,
  k_shadeGain: 1.50,
  k_uptake: 0.00003,   // see B1: was ~100x oversupplied, rootDepth did nothing
  k_storage: 12.0,
  k_disperse: 0.07,    // now x disp^2, so ancestral 12 costs about the same
  k_seedDecay: 0.00004,  // seeds must outlast a dormancy of up to a year
  germCostMult: 1.00,    // x seedlingMass x energyPerMass, charged to the seed
                         // at germination. 0 restores the old free-tissue bug.
  k_leafPerMass: 3.00,   // leaf area one unit of mass can hold up
  k_heightMass: 40.0,    // mass at which a plant realizes its full genetic height.
                         // WAS 250, which no plant ever reaches: realised mass
                         // runs 6-90 and P90 12-115, so sqrt(m/250) stayed at
                         // 0.05-0.68 and 97% of every flora sat in canopy band
                         // 0. Eight bands of layered Beer-Lambert with one band
                         // occupied is not layered light, and height was 0-1%
                         // of plant upkeep because nobody could afford to be
                         // tall enough for it to matter.
  k_stem: 1.50,          // canopy given up per unit of realized height

  // ---- matter / growth ----
  energyPerMass: 60.0,   // energy to build one unit of mass — sets generation time
  k_regrow: 0.55,        // fraction of build cost waived at regrowthRate 1
  k_regrowCost: 0.0010,  // x regrowthRate^2 x mass, paid always. QUADRATIC:
                         // linear/linear would pin this gene to its bound.
  regrowDays: 6,         // how long after a bite the discount applies
  nutrientPerMass: 0.012,
  seedlingMass: 0.50,    // seedlings must be big enough to carry real leaf

  mutationFloor: 0.004,

  // ---- founding / reseed net ----
  founders: 650,
  founderMorphs: 6,      // distinct starting genomes per kingdom, not one
  morphSpread: 3.5,      // how far a morph may sit from the ancestral value,
                         // in MUTATION SIGMAS. Scaling by gene range instead
                         // drew seedEnergy below the germination cost and made
                         // whole morphs sterile. 0 = old single-ancestor behaviour.
  founderNoise: 0.8,
  founderEnergy: 30,
  reseedDays: 200,       // the opening net now has to cover a few generations
  reseedFloor: 135,

  seedSlotFraction: 0.60,

  // ---- lineage clustering (instrumentation, not biology) ----
  lineageSplit: 0.13,
  lineageMin: 0.02,
  lineageEvery: 960,
  lineageConfirm: 5,     // reclusters a new cluster must hold minPop before it
                         // is named and recorded. Without it an outlier genome
                         // spawned a named lineage instantly, took a slice of
                         // its neighbour for one pass and died: 70 plant names
                         // in 50 years of which 35 lived a single snapshot, and
                         // a tree of 240 entries under 107 distinct pairs.
                         // 5 passes at lineageEvery 960 is 10 sim-days.

  plantStagger: 8,
  statEvery: 240,

  // ---- animals (phase 3) ----
  maxAnimals: 40000,
  animalFounders: 650,
  animalFounderEnergy: 80,
  animalStartDay: 260,    // grazers arrive once there is vegetation to graze
  animalReseedDays: 60,  // opening net, then off permanently. WAS 200, which
                         // held every fauna at the floor until day 460 and made
                         // three consecutive extinctions look like survival.
  animalFloor: 135,
  animalThink: 4,        // ticks between sense+decide; movement is every tick
  senseCap: 8,           // detections examined per think — saturates senseRange
  k_reach: 0.025,        // reach = k_reach * size, against effHeight.
                         // 0 disables height-limited browsing entirely.
                         // ANCHORED, NOT GUESSED: 0.025 = 1/AMAX(size), so the
                         // largest animal the gene table allows can just browse
                         // a plant at full genetic height. Design 6.4 requires
                         // the arms race to be winnable at both extremes and
                         // that fixes the constant. 0.060 came from calibrating
                         // against a mean effHeight measured in a COLLAPSED
                         // world — a sparse stand of old survivors — and gave
                         // aAccess 0.66-0.98 and pEscape 0.00 in three seeds.
  visMass: 4.0,          // plant mass at which a plant is half as findable as
                         // an infinite one. Detection had NO size term, so a
                         // 0.5-mass seedling was as visible as a 184-mass
                         // tree — which is why 100% of recruitment was eaten.
  mvtLeave: 1.0,         // leave a plant yielding less than this x the
                         // animal's own running mean intake. Tuning knob.
  rateEwma: 0.002,       // smoothing on that running mean (~1 sim-day)
  coverFactor: 0.40,     // how much canopy hides a target
  tissueValue: 25.0,     // energy per unit plant mass eaten, before digestion
  meatValue: 24.0,       // energy per unit animal mass. MUST stay well under
                         // energyPerMassA or a trophic level loses nothing and
                         // animal biomass recirculates instead of decaying.
  k_attack: 0.120,       // x biteForce x mass^0.75, flesh taken per tick
  k_armEff: 2.0,         // armour efficacy; benefit SATURATES as 1/(1+k*a)
  k_retal: 0.45,         // retaliation = target biteForce x aggression x this
  k_digest: 0.0040,      // x max(0,carn+herb-1)^2 — stops both reaching 1
  mixedFree: 0.060,      // carn*herb below this is free. Without a free band
                         // the penalty purges carnivory before it is ever used.

                         // WAS 0.0025 — a half-life of 0.58 sim-days, at which

// 3. PRNG
//==========================================================================
let rngState = 0, gaussCache = null;
function srand(s){ rngState = s|0; gaussCache = null; }
function rng(){
  rngState = rngState + 0x6D2B79F5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function gauss(){
  if (gaussCache !== null){ const v = gaussCache; gaussCache = null; return v; }
  let u = 0; while (u === 0) u = rng();
  const v = rng(), m = Math.sqrt(-2*Math.log(u));
  gaussCache = m*Math.sin(2*Math.PI*v);
  return m*Math.cos(2*Math.PI*v);
}
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;

function valueNoise(n, base, octaves, persistence){
  const out = new Float32Array(n*n);
  let amp = 1, tot = 0;
  for (let o = 0; o < octaves; o++){
    const g = Math.min(n, base << o);
    const grid = new Float32Array(g*g);
    for (let i = 0; i < g*g; i++) grid[i] = rng();
    for (let ty = 0; ty < n; ty++){
      const fy = ty*g/n, y0 = Math.floor(fy), y1 = (y0+1)%g, sy = fy-y0;
      const wy = sy*sy*(3-2*sy);
      for (let tx = 0; tx < n; tx++){
        const fx = tx*g/n, x0 = Math.floor(fx), x1 = (x0+1)%g, sx = fx-x0;
        const wx = sx*sx*(3-2*sx);
        const a = grid[y0*g+x0], b = grid[y0*g+x1], c = grid[y1*g+x0], d = grid[y1*g+x1];
        const top = a + (b-a)*wx, bot = c + (d-c)*wx;
        out[ty*n+tx] += amp*(top + (bot-top)*wy);
      }
    }
    tot += amp; amp *= persistence;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot;
  return out;
}
