<!doctype html>
<!--
  evosim 1.x — single file, no build step, no dependencies, runs on a phone.

  Plants are an evolving cellular layer: every occupied cell carries a small
  genome (stature, defence, dispersal) and spreads by seed into cells that are
  empty or nearly so. Animals are agents whose behaviour is a small neural
  network in their genome. Nothing tells an animal what to eat, whom to
  attack, when to run or where to go. The only things written into the code
  are physics: what food is worth, what a body costs, what a bite does.

  The engine is the script block with id "engine" and never touches the DOM, so
  run.js can execute it headless. Notes and results: HANDOFF.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>evosim</title>
<style>
  :root{--ink:#0b1014;--panel:rgba(13,19,24,.93);--hair:#1e2b32;--paper:#dce6e2;--dim:#6a7e86;
        --leaf:#7fc24a;--ember:#e0704a;--sky:#6fa3c4}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--paper);
    font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #top{position:fixed;top:0;left:0;right:0;z-index:3;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;
    background:rgba(10,15,19,.88);border-bottom:1px solid var(--hair);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 8px}
  #top b{font-weight:600} .k{color:var(--dim);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-right:3px}
  .kpi{display:flex;flex-direction:column;min-width:0;line-height:1.2;cursor:pointer}
  .kpi b{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi.pre b{opacity:.4}
  #msg{grid-column:1/-1} #msg:empty{display:none}
  @media (min-width:760px){ #top{grid-template-columns:repeat(10,auto);justify-content:start;column-gap:22px} }
  #tip{position:fixed;left:8px;right:8px;z-index:6;display:none;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;
    background:#16232a;border:1px solid #2c404a;box-shadow:0 4px 18px rgba(0,0,0,.5)}
  #tip.on{display:block} #tip b{color:var(--leaf)}
  .leaf{color:var(--leaf)} .ember{color:var(--ember)} .sky{color:var(--sky)}
  #graph{position:fixed;left:8px;width:calc(100% - 16px);z-index:2;height:92px;border:1px solid var(--hair);border-radius:8px;
    background:rgba(10,15,19,.82)}
  #legend{position:fixed;left:8px;right:8px;z-index:2;pointer-events:none;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;
    font-size:10.5px;color:#a5b6bd;text-shadow:0 0 3px #000,0 0 3px #000}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.6)}
  #legend .grad{width:54px;border-radius:3px}
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;gap:6px;align-items:center;
    padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:rgba(10,15,19,.94);border-top:1px solid var(--hair)}
  button{flex:1;min-height:44px;border-radius:9px;font:inherit;color:#a5b6bd;background:#121c21;border:1px solid var(--hair)}
  button.on{color:var(--leaf);border-color:#3a5730}
  #spd{flex:1.4;accent-color:var(--leaf)}
  #card{position:fixed;left:8px;max-width:min(440px,calc(100% - 16px));z-index:4;display:none;padding:10px 12px;border-radius:10px;
    background:var(--panel);border:1px solid var(--hair);font-size:11.5px;line-height:1.5}
  #card.on{display:block} #card .dim{color:var(--dim)} #card .note2{color:#e0c04a;margin-bottom:4px}
  .genes{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:6px}
  .genes div{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap} .genes span{color:#8a99a1}
  .genes i{flex:0 0 100%;height:3px;border-radius:2px;background:#24343c} .genes u{display:block;height:100%;border-radius:2px;background:var(--sky)}
  #drawer{position:fixed;left:0;right:0;bottom:0;z-index:5;max-height:70vh;overflow-y:auto;transform:translateY(101%);visibility:hidden;
    transition:transform .2s,visibility .2s;padding:10px 12px calc(env(safe-area-inset-bottom) + 14px);border-radius:14px 14px 0 0;
    background:var(--panel);border:1px solid var(--hair)}
  #drawer.open{transform:none;visibility:visible}
  @media (min-width:900px){ #drawer{left:auto;right:8px;width:440px;border-radius:14px} }   /* a side panel, not a wall of 1200px sliders */
  #toast{position:fixed;left:8px;right:8px;z-index:4;display:none;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.45;
    background:rgba(22,35,42,.95);border:1px solid #3a5730;color:var(--paper)}
  #toast.on{display:block} #toast .k{margin-right:6px}
  .ev{display:flex;gap:10px;margin:4px 0;font-size:11px;line-height:1.45} .ev .k{flex:0 0 64px;text-align:right;margin:0}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .row label{flex:0 0 42%;color:#8a99a1;font-size:11px}
  .row input{flex:1;min-width:0;accent-color:var(--leaf)}
  input[type=range]{height:40px} .row span{flex:0 0 52px;text-align:right}
  .note{color:#83959d;font-size:11.5px;margin:10px 0 4px;line-height:1.5}
  h4{font:600 10px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);margin:14px 0 6px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top"></div>
<div id="tip"></div>
<canvas id="graph"></canvas>
<div id="legend"></div>
<div id="card"></div>
<div id="toast"></div>
<div id="drawer"></div>
<div id="bar">
  <button id="bPlay">pause</button>
  <input id="spd" type="range" min="0" max="7" step="1" value="3">
  <button id="bCol">diet</button>
  <button id="bMore">world</button>
</div>

<script id="engine">
var Sim = (function(Math){
'use strict';
// =========================================================================
// ENGINE. Pure simulation, no DOM. Everything in CFG is physics or scale;
// none of it is a behaviour.
// =========================================================================
var VERSION = '1.0.0';

var CFG_DEFAULT = {
  seed: 1,
  // ---- world ----
  gridN: 96,            // plant cells per side
  cellSize: 4,          // world units per plant cell; world side = gridN*cellSize
  fertNoise: 0.6,       // spatial variation in fertility
  seasonAmp: 0,         // 0 = no seasons. Seasons force population cycles, so
                        // they are off unless you want them.
  yearTicks: 6000,
  giveRate: 0.1,        // energy passed per tick x mass^0.75, at most half the giver's reserves
  giveEff: 0.8,         // share of it the receiver gets
  compass: 0,           // 1 = an animal senses its own heading in world terms (compassX/Y), as a sun
                        // or magnetic compass would; 0 = those inputs read 0. With it prey
                        // populations evolve a shared bearing and travel together (prey clumping
                        // 1.22 against 0.84 at 400k ticks), but over 1M ticks predators then
                        // die out far more often (persisting in 10 of 24 worlds against 20)
  dayTicks: 0,          // ticks per day and night; 0 = always day
  nightSight: 0.3,      // at full dark, animals and corpses are seen over this share of the sense range
  seasonWave: 0,        // 1 = the season travels along x, one wavelength per world width per year:
                        // a band of fast growth moving at world/yearTicks per tick

  // ---- plants ----
  pR: 0.012,            // logistic growth rate per tick at fertility 1, no costs paid
  pKmin: 2, pKmax: 14,  // standing-crop capacity, set by the stature gene
  pStatCost: 0.55,      // share of growth rate given up at stature 1
  browseGrown: 1,       // 1: a plant's height grows with it (browse x stature x biomass / capacity)
                        // and does not shrink when grazed, like a trunk; a new seedling is short.
                        // 0: every plant stands at its full height, seedlings included. Over 24
                        // worlds it removed the giant trap (0 giant worlds against 8)
  browse: 2,            // plant height per unit stature, in reach units. An animal reaches
                        // mass^(1/3) high and cannot crop the share of a cell's capacity that
                        // stands above its reach. 0 = everything is in reach. At 2, over 12
                        // worlds: carnivore specialists in 8 (3 without), no dwarf worlds,
                        // tall trees; but 4 worlds of giants
  pDefCost: 0.45,       // share of growth rate given up at defence 1
  kDef: 4,              // a tough plant: bite size / (1 + kDef*defence*(1-detox))
  pSeedB: 0.25,         // biomass a seed starts a cell with (paid by the parent)
  pRoot: 0.12,          // biomass a grazer cannot reach: roots. Grazing alone
                        // never kills a plant; a seed can take the cell over
                        // once it is grazed below pTakeover.
  pTakeover: 0.4,
  pSeedP: 0.03,         // seed pressure a full cell adds per tick (cells over half full only); a seed flies at 1
  pDispMax: 8,          // longest seed throw beyond the first cell, at dispersal 1
  pDispCost: 0.15,      // share of growth rate given up at dispersal 1
  pMutSd: 0.05,
  fruit: 1,             // plants may turn biomass into fruit (their fourth gene sets how much). With animals
                        // carrying the seed, the fruit gene rises over 1M ticks (0.19 -> 0.25) and falls to
                        // 0.08 without carrying; predators persist as without fruit (19 of 24 against 17)
  seeFruit: 1,          // animals sense fruit ahead-left, ahead-right and underfoot
  fruitRate: 0.002,     // biomass turned into fruit per tick, x fruit gene x biomass
  fruitMax: 0.5,        // fruit a cell can hold, as a share of its capacity
  fruitRot: 0.005,      // share of the fruit that rots per tick
  fruitValue: 3,        // energy per unit of fruit against a unit of leaf; no defence, hangs in reach
  gutTicks: 200,        // an animal that eats fruit drops its seeds this many ticks later, where it is then
  fruitPerSeed: 0.2,    // fruit eaten per batch of seeds swallowed; a gut holds up to 4 batches
  plantEvery: 2,        // plants update every N ticks (dt = N)
  nutrients: 0,         // 1: a closed nutrient loop. Plant growth draws on the soil of its cell;
                        // what an animal eats goes into its body; what its body cannot hold
                        // it passes as dung where it walks; corpses, rotting fruit and dying
                        // plants return to the soil. The total never changes.
  soil0: 6,             // nutrient in a cell's soil at the start, x fertility
  nHalf: 1,             // plant growth x soil/(soil + nHalf), and never more than the soil holds
  nBody: 2,             // nutrient an animal's body holds per unit mass
  dungRate: 0.05,       // share of the surplus beyond that passed each tick
  soilDiff: 0.002,      // share of a cell's soil that seeps to its four neighbours per plant update
  resprout: 0,          // with the nutrient loop: growth x (biomass + resprout x pRoot), so a plant
                        // grazed to its roots regrows from them as fast as the soil lets it
  smell: 1,             // 1: animals smell. Every animal gives off scent in three channels, 0.25 +
                        // 0.75 x its colour tag, x mass^0.75; corpses give off a fourth (carrion).
                        // Scent spreads and fades on a coarse grid. Two nostrils ahead-left and
                        // ahead-right read each channel: how strong, and which side is stronger.
                        // Smell works with the head down and in the dark. 0: those senses read 0.
                        // Over 24 paired worlds grazers evolved to turn away from animal scent
                        // (24 of 24), off ground others have grazed, and neighbours came to head
                        // the same way (alignment 0.069 against 0.007, p < 0.001); predators as often
  smellEmit: 1,         // scent per tick x mass^0.75
  carrionEmit: 4,       // carrion scent per tick x corpse mass
  smellDecay: 0.05,     // share of scent that fades per tick: it lasts about 20 ticks
  smellDiff: 0.2,       // share of a grid cell's scent that spreads to its neighbours per update
  learn: 0,             // 1: brains learn in a lifetime. Every weight changes by learnRate x m x
                        // (its input's activity) x (its output's activity) at the last think, where m
                        // is the brain's own tenth output (tanh), a neuromodulator: the genome decides
                        // when, which way and how much to learn, from any sense, including the new
                        // one, the change in its own reserves since the last think (felt). Each
                        // animal starts from its genome's weights; nothing learned is inherited. For
                        // the mouth's four urges the output's activity is what it did minus the odds
                        // it had of doing it. 0: m and felt read 0 and brains are fixed
  learnRate: 0.05,
  smellK: 5,            // a nostril reads level/(level + smellK); about the level one animal leaves where it stands

  // ---- animals: bodies ----
  maxA: 12000,
  founders: 300,
  reseedFloor: 200,    // BOOTSTRAP ONLY: random genomes arrive while the population is
                        // below this, until a population has once established itself
                        // (reached 2 x the floor). After that, nothing is ever added.
  reseedUntil: 400000,  // give up bootstrapping after this tick
  think: 2,             // ticks between brain evaluations
  eCap: 40,             // energy an animal can store per unit body mass
  callCost: 0.002,      // energy per tick for calling at full loudness, x mass^0.75
  hear: 1,              // 0: calls go unheard (a control: calling then only costs)
  headDown: 0.7,        // an animal that ate last tick senses animals over (1 - headDown) of its
                        // range: eyes on the food are not on the horizon. Over 12 worlds a side
                        // it made prey group where predators were (prey clump 1.17 against 0.90)
  cBuild: 10,           // energy to build one unit of body mass
  growAbove: 0.5,       // a juvenile grows only with reserves above this share of capacity
  breedMargin: 0.05,    // a parent keeps at least this share of capacity after giving birth
  eatMoveSlow: 0.7,     // eating at top speed goes at (1 - this) of the standing rate
  accel: 0.1,           // speed change per tick, as a share of top speed
  ePlant: 1.0,          // energy per unit plant mass at a perfect plant gut
  eMeat: 8.0,           // energy in one unit of lean flesh: 80% of what it cost
                        // to build (cBuild), the rest lost as overhead. A corpse also carries
                        // whatever reserves the animal died with, so a healthy
                        // kill is worth far more than a starved carcass.
  dietCurve: 2,         // plant yield x (1 - diet^c), meat yield x (floor + (1-floor)(1 - (1-diet)^c)).
                        // 2 = concave: a first step toward either gut is cheap. Over 20 small
                        // worlds it gave 16 predator-dominated and 6 with meat guts, against
                        // 11 and 3 at 1 (the linear trade).
  meatFloor: 0.4,       // share of meat yield any gut gets. Flesh is easy to digest;
                        // cellulose is what needs a specialised gut, so the
                        // trade is asymmetric. Full formula: see dietCurve.
  graze: 0.12,          // plant mass bitten per tick, x mass^0.75
  chew: 0.20,           // flesh eaten per tick, x mass^0.75 (x (teethBase + weapon) when teethBase < 1)
  teethBase: 1,         // meat eating rate x (teethBase + weapon) when < 1; 1 = weapon-independent.
                        // 0.25 was tried: it cut early scavenging and kills fell to zero in 3 of 4 worlds.
  upFixed: 0.003,       // per animal per tick, whatever its size. Reproductive rate peaks
                        // at mass ~ (4 upFixed / net intake per mass^0.75)^(4/3). At 0.010
                        // size had an interior optimum without predators but worlds stayed
                        // peaceful: 0 of 20 predator worlds at 600k ticks. At 0.003 small,
                        // fast-breeding animals evolve predation and carnivore species,
                        // and predation itself holds size off the floor.
  upBase: 0.008,        // upkeep per tick x mass^0.75
  upSense: 0.004,       // x (sense/10)^2 x mass^0.75
  upWeapon: 0.012,      // x weapon^2 x mass^0.75
  upArmour: 0.008,      // x armour x mass^0.75
  upDetox: 0.006,       // x detox^2 x mass^0.75
  upSpeed: 0.010,       // x speed gene^2 x mass^0.75: owning the muscle
  upMove: 0.012,        // x mass x speed^2: using it
  sizeMax: 12,          // the body-size gene's upper bound. Giant worlds end when predators reach it
                        // (23 of 32 exits had meat-eaters at size 10 or more)
  dmg: 0.5,            // damage per tick x weapon x mass^0.75
  atkCost: 0.004,       // energy per attack tick x mass^0.75
  hpPerMass: 2,
  heal: 0.003,          // fraction of max hp regained per tick
  armourEff: 0.75,      // damage taken x (1 - armourEff*armour)
  armourSlow: 0.35,     // top speed x (1 - armourSlow*armour)
  juvSlow: 0.5,         // top speed x (mass / adult size)^juvSlow: the young are slow. 0 = off
  turnMax: 0.35,
  radiusK: 0.7,         // body radius = radiusK * mass^(1/3)
  reach: 0.6,
  corpseDecay: 0.0015,  // fraction of corpse mass lost per tick
  growRate: 0.008,      // max growth per tick as a share of current mass
  ageK: 6000,           // lifespan in ticks x mass^0.25

  // ---- inheritance ----
  mateDist: 0.1,        // with sex on: partners whose body genomes differ by more than this
                        // (mean normalised difference) cannot breed. 1 = no limit.
  sex: 1,               // 1: a breeder recombines with the nearest acceptable adult it
                        // can sense (clones if there is none). 0: always clone. Over 24
                        // paired worlds sexual ones got predators as often as clonal ones,
                        // and in 13 the meat-eaters became a separate species.
  mutP: 0.06,           // per-gene mutation probability, body genes
  mutPW: 0.02,          // per-weight mutation probability, brain
  mutSd: 0.08,          // body genes: sd as a share of range (x3, multiplicative, for log-scaled genes)
  wSd: 0.35,            // brain weights: sd
  wMax: 4,

  seedGenomes: null,    // optional array of genomes (from run.js --dump) to found the world from
  seedNI: 0,            // number of senses the seed genomes were evolved with, if fewer than now
  seedNO: 0,            // number of brain outputs they were evolved with (0 = 5, before the voice)
  // ---- logging ----
  sampleEvery: 500
};

// Body genes: name, min, max, log-scaled
var BODY = [
  ['size',     0.3, 12,   true ],
  ['speed',    0.1, 1.6,  false],
  ['sense',    3,   32,   false],
  ['diet',     0,   1,    false],   // 0 = plant gut, 1 = meat gut; trade-off set by dietCurve and meatFloor
  ['weapon',   0,   1.5,  false],
  ['armour',   0,   1,    false],
  ['detox',    0,   1,    false],   // counters plant defence
  ['reproT',   0.3, 0.95, false],   // breed when energy is above this share of capacity
  ['childE',   0.05,0.7,  false],   // share of own energy handed to each child
  ['tagR',     0,   1,    false],   // heritable colour: visible to others, costs nothing
  ['tagG',     0,   1,    false],
  ['tagB',     0,   1,    false],
  ['birthSize',0.1, 0.6,  false],   // newborn mass as a share of adult size: few big young or many small
  ['choosy',   0,   1,    false],   // mate tolerance: accept a partner whose colour tag is closer than 1 - choosy
  // ATTENTION: which neighbour fills the 'animal' senses and takes a strike.
  // salience = closeness + attSize*relative size + attKin*kinship + attWeapon*its weapon
  ['attSize',  -2,  2,    false],
  ['attKin',   -2,  2,    false],
  ['attWeapon',-2,  2,    false]
];
var NB = BODY.length;
var G_SIZE=0, G_SPEED=1, G_SENSE=2, G_DIET=3, G_WEAPON=4, G_ARMOUR=5, G_DETOX=6,
    G_REPROT=7, G_CHILDE=8, G_TAG=9, G_BIRTH=12, G_CHOOSY=13, G_ATT=14;
var NI = 51, NH = 8, NO = 10;
var W1 = NB, W2 = W1 + NI*NH, WD = W2 + NH*NO, NG = WD + NI*NO;
var INPUT_NAMES = ['bias','energy','health','hurt','plantL','plantC','plantR','plantHere','tasteHere',
  'animal','animalDir','animalNear','animalSize','animalKin','animalWeapon',
  'corpse','corpseDir','corpseNear','crowd','noise','corpseInReach','animalInReach','crowdDir','alarm','alarmDir','gut','crowdSpeed','heard','heardDir','kinDir','animalR','animalG','animalB','compassX','compassY','crowdHeading','light','mem1','mem2','fruitL','fruitR','fruitHere',
  'smellR','smellG','smellB','smellMeat','smellRDir','smellGDir','smellBDir','smellMeatDir','felt'];
var OUTPUT_NAMES = ['turn','throttle','eat','meatPref','attack','call','give','mem1','mem2','learn'];
var NW = NG - NB;   // brain weights per animal, as learned (learn on)

var CFG, S;   // config and state

// xorshift128, state in an Int32Array: in closure variables V8 with pointer compression
// (Chrome, Android) boxes an int32 beyond +-2^30 on every write
var RS = new Int32Array([1, 2, 3, 4]);
function seedRng(seed){
  var a = (seed >>> 0) || 1;
  function sm(){ a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), a | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return (t ^ (t >>> 14)) | 0; }
  RS[0] = sm(); RS[1] = sm(); RS[2] = sm(); RS[3] = sm();
  if (!(RS[0] | RS[1] | RS[2] | RS[3])) RS[0] = 1;
}
function rng(){
  var s0 = RS[0], s3 = RS[3], t = s0 ^ (s0 << 11);
  RS[0] = RS[1]; RS[1] = RS[2]; RS[2] = s3;
  s3 = (s3 ^ (s3 >>> 19)) ^ (t ^ (t >>> 8));
  RS[3] = s3;
  return (s3 >>> 0)*2.3283064365386963e-10;
}
var gCache = null;
function gauss(){
  if (gCache !== null){ var g = gCache; gCache = null; return g; }
  var u = 0, v = 0;
  while (u === 0) u = rng();
  v = rng();
  var r = Math.sqrt(-2*Math.log(u)), th = 2*Math.PI*v;
  gCache = r*Math.sin(th);
  return r*Math.cos(th);
}
function clamp(x, a, b){ return x < a ? a : x > b ? b : x; }

// smooth value noise on the torus, for fertility
function noiseField(n, octaves){
  var f = new Float32Array(n*n);
  var amp = 1, tot = 0;
  for (var o = 0; o < octaves; o++){
    var m = 3 << o, lat = new Float32Array(m*m);
    for (var i = 0; i < m*m; i++) lat[i] = rng();
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++){
      var fx = x/n*m, fy = y/n*m, x0 = fx|0, y0 = fy|0, tx = fx-x0, ty = fy-y0;
      var x1 = (x0+1)%m, y1 = (y0+1)%m;
      tx = tx*tx*(3-2*tx); ty = ty*ty*(3-2*ty);
      var a = lat[y0*m+x0], b = lat[y0*m+x1], c = lat[y1*m+x0], d = lat[y1*m+x1];
      f[y*n+x] += amp*((a*(1-tx)+b*tx)*(1-ty) + (c*(1-tx)+d*tx)*ty);
    }
    tot += amp; amp *= 0.5;
  }
  for (var k = 0; k < n*n; k++) f[k] /= tot;
  return f;
}

function init(patch){
  CFG = {};
  for (var k in CFG_DEFAULT) CFG[k] = CFG_DEFAULT[k];
  if (patch) for (var k2 in patch) CFG[k2] = patch[k2];
  BODY[G_SIZE][2] = CFG.sizeMax;   // the size gene's range is physics too
  seedRng(CFG.seed*2654435761 + 12345); gCache = null;
  var n = CFG.gridN, nc = n*n, M = CFG.maxA;
  S = {
    tick: 0, light: 1, world: n*CFG.cellSize, established: false,
    // plants
    pB: new (CFG.nutrients ? Float64Array : Float32Array)(nc), pStat: new Float32Array(nc), pDef: new Float32Array(nc),
    pDisp: new Float32Array(nc), fert: new Float32Array(nc),
    pK: new Float32Array(nc), pRate: new Float32Array(nc),   // cached from the genome

// decode the embedded population: one byte per gene over the gene's range
function evolvedGenomes(){
  if (!EVOLVED) return null;
  var raw = atob(EVOLVED.data), NG = EVOLVED.NG, NB = Sim.NB, B = Sim.BODY, W = Sim.CFG_DEFAULT.wMax, out = [];
  for (var i = 0; i < EVOLVED.n; i++){
    var g = new Array(NG);
    for (var k = 0; k < NG; k++){
      var lo = k < NB ? B[k][1] : -W, hi = k < NB ? B[k][2] : W;
      g[k] = lo + (hi - lo)*raw.charCodeAt(i*NG + k)/255;
    }
    out.push(g);
  }
  return out;
}
var COLOUR_NAMES = ['diet', 'kin', 'action'];
var cam = {x: 0, y: 0, z: 1}, view = {x: 0, y: 0, w: 0, h: 0};
var patch = {gridN: 64};   // the small world by default: about twice as fast, and predators evolve as often
var plantImg = null, plantCv = document.createElement('canvas'), pctx = plantCv.getContext('2d');

function newWorld(seed){
  patch.seed = seed != null ? seed : (Math.random()*1e9)|0;
  Sim.init(patch);
  resumedFrom = 0; lastSaved = -1; saveFailed = false;
  running = true; $('bPlay').textContent = 'pause'; $('bPlay').classList.remove('on');
  $('drawer').classList.remove('open'); $('bMore').textContent = 'world';   // show the new world, not the menu
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  afterLoad();
  toast(0, patch.seedGenomes ? 'founded from an evolved world: armoured meat-eaters that never stop moving, among small grazers. Try colour: action to watch hunts.'
                            : 'random animals are arriving and most will die. Tap a number above to see what it means, or tap an animal to follow it.');
}
// one tap should not throw away hours of evolution
function discardOK(){ return Sim.S.tick < 20000 || Sim.S.n === 0 || confirm('Replace this world (tick ' + Sim.S.tick + ')?'); }
function afterLoad(){
  var n = Sim.CFG.gridN;
  plantCv.width = n; plantCv.height = n;
  plantImg = pctx.createImageData(n, n);
  selId = -1; follow = false; $('card').classList.remove('on'); selIdx = -1; relSet = null; deathNote = null;
  resetCam();
  resetEvents(); scanEvents(false);   // a resumed world gets its history back without a burst of toasts
}
function layout(){
  var top = $('top').getBoundingClientRect().bottom, bot = $('bar').getBoundingClientRect().top;
  view.x = 0; view.y = top; view.w = innerWidth; view.h = Math.max(100, bot - top);
  gcv.style.top = ''; gcv.style.bottom = (innerHeight - bot + 8) + 'px';
  $('toast').style.bottom = (innerHeight - bot + 8 + gcv.offsetHeight + 4) + 'px';   // where the legend sits; the legend steps aside
  $('legend').style.bottom = (innerHeight - bot + 8 + gcv.offsetHeight + 4) + 'px';
  $('card').style.top = (top + 8) + 'px'; $('tip').style.top = (top + 6) + 'px';
  var dr = $('drawer'); dr.style.bottom = (innerHeight - bot) + 'px'; dr.style.maxHeight = Math.max(120, bot - top - 8) + 'px';
  return top;
}
function resize(){
  var m0 = Math.min(view.w, view.h);
  cv.width = innerWidth*DPR; cv.height = innerHeight*DPR;
  layout();
  gcv.width = gcv.clientWidth*DPR; gcv.height = gcv.clientHeight*DPR;
  if (!m0 || !Sim.S) resetCam(); else cam.z *= Math.min(view.w, view.h)/m0;
}
var lastTop = 0;
function resetCam(){
  if (!Sim.S) return;
  var W = Sim.S.world;
  cam.z = Math.min(view.w, view.h)/W; cam.x = W/2; cam.y = W/2;
}
function toScreen(wx, wy){ return [view.x + view.w/2 + (wx - cam.x)*cam.z, view.y + view.h/2 + (wy - cam.y)*cam.z]; }
function toWorld(sx, sy){ return [cam.x + (sx - view.x - view.w/2)/cam.z, cam.y + (sy - view.y - view.h/2)/cam.z]; }

function drawPlants(){
  var S = Sim.S, C = Sim.CFG, n = C.gridN, d = plantImg.data, kmax = C.pKmax;
  for (var c = 0; c < n*n; c++){
    var B = S.pB[c], o = c*4, f = C.nutrients ? Math.min(1.6, S.soil[c]/C.soil0) : S.fert[c];   // bare ground: fertility, or with the nutrient loop the soil's richness
    if (B > 0){
      var v = Math.min(1, B/kmax), df = S.pDef[c];
      d[o]   = 18 + 40*v*df + 20*v;
      d[o+1] = 30 + 150*v*(1 - 0.5*df);
      d[o+2] = 20 + 90*v*df;
      var fr = S.pF[c] > 0 ? Math.min(1, S.pF[c]/(0.1*S.pK[c]))*0.75 : 0;   // fruit: a warm blush
      if (fr > 0){ d[o] += (235 - d[o])*fr; d[o+1] += (95 - d[o+1])*fr; d[o+2] += (120 - d[o+2])*fr; }
    } else { d[o] = 26 + 14*f; d[o+1] = 22 + 10*f; d[o+2] = 18; }
    d[o+3] = 255;
  }
  pctx.putImageData(plantImg, 0, 0);
  var W = S.world;
  ctx.imageSmoothingEnabled = true;
  // the world is a torus: draw the tiles that intersect the view
  var nx = Math.ceil(view.w/(W*cam.z)/2) + 1, ny = Math.ceil(view.h/(W*cam.z)/2) + 1;
  var bx = Math.floor(cam.x/W), by = Math.floor(cam.y/W);
  for (var ox = bx-nx; ox <= bx+nx; ox++) for (var oy = by-ny; oy <= by+ny; oy++){
    var a = toScreen(ox*W, oy*W);
    var sz = W*cam.z;
    if (a[0] > view.w || a[1] > view.y + view.h || a[0] + sz < 0 || a[1] + sz < view.y) continue;
    ctx.imageSmoothingEnabled = cam.z*Sim.CFG.cellSize < 6;
    ctx.drawImage(plantCv, a[0], a[1], sz, sz);
    // the world wraps round: mark its edge so a second copy on a tall or wide screen is seen to be a repeat, not more animals
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
    ctx.strokeRect(Math.round(a[0]) + 0.5, Math.round(a[1]) + 0.5, sz, sz); ctx.setLineDash([]);
  }
}
function dietColourOf(d){
  // green (plant gut) -> amber -> red (meat gut)
  var r = d < 0.5 ? 120 + 270*d : 255, g = d < 0.5 ? 220 - 60*d : 190 - 330*(d - 0.5);
  return 'rgb(' + (r|0) + ',' + (Math.max(30, g)|0) + ',' + (60|0) + ')';
}
var DIET_COL = []; for (var dc = 0; dc <= 32; dc++) DIET_COL.push(dietColourOf(dc/32));
function dietColour(d){ return DIET_COL[Math.max(0, Math.min(32, Math.round(d*32)))]; }
// grazing is pale, not leaf green, so a grazer stands out against the plants it eats
var ACT_COL = ['#7d8a92', '#f2efc8', '#f0a040', '#ff3b30', '#b48cff'];
function legend(){
  var h;
  if (colourMode === 0) h = '<span>diet: plant gut <i class="grad" style="background:linear-gradient(90deg,' + dietColour(0) + ',' + dietColour(0.5) + ',' + dietColour(1) + ')"></i> meat gut</span>';
  else if (colourMode === 1) h = '<span>kin: a heritable colour, so a shared colour means close relatives</span>';
  else h = ['idle', 'grazing', 'eating meat', 'attacking', 'feeding another'].map(function(a, k){ return '<span><i style="background:' + ACT_COL[k] + '"></i>' + a + '</span>'; }).join('');
  h += '<span><i style="background:#e05f78"></i>fruit</span><span><i style="background:#8a3328"></i>corpse</span><span><i style="background:none;border:1.5px solid #6fa3c4;width:11px;height:11px;border-radius:6px"></i>calling</span>';
  $('legend').innerHTML = h;
}
function drawAnimals(){

  cam.x -= W*Math.floor(cam.x/W); cam.y -= W*Math.floor(cam.y/W);
  if (span >= Math.max(view.w, view.h)){ drawAnimalsAt(0, 0, true); return; }
  var x0 = Math.floor((cam.x - view.w/2/cam.z)/W), x1 = Math.floor((cam.x + view.w/2/cam.z)/W),
      y0 = Math.floor((cam.y - view.h/2/cam.z)/W), y1 = Math.floor((cam.y + view.h/2/cam.z)/W);
  for (var ox = x0; ox <= x1; ox++) for (var oy = y0; oy <= y1; oy++) drawAnimalsAt(ox*W, oy*W, false);
}

  [0,1,2,3,4,5,6,7,8,12].forEach(function(k){
    var v = G[g+k], f = Math.max(0, Math.min(1, (v - B[k][1])/(B[k][2] - B[k][1])));
    h += '<div><span>' + GENE_NAMES[k] + '</span>' + v.toFixed(2) + '<i><u style="width:' + (100*f).toFixed(0) + '%' + (k === 3 ? ';background:' + dietColour(v) : '') + '"></u></i></div>';
  });
  h += '</div><div class="dim" style="margin-top:6px">' + (relSet.size - 1) + ' close relatives alive (white rings) · tap open ground to let go</div>';
  el.innerHTML = h;
}

// ---- input: drag pans, pinch/wheel zooms, tap selects
var ptrs = {}, down = null, pinch0 = 0, z0 = 1;
cv.addEventListener('pointerdown', function(e){
  if ($('drawer').classList.contains('open')){ $('drawer').classList.remove('open'); $('bMore').textContent = 'world'; }
  cv.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = [e.clientX, e.clientY];
  var ks = Object.keys(ptrs);
  if (ks.length === 1) down = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false};
  if (ks.length === 2){ var a = ptrs[ks[0]], b = ptrs[ks[1]]; pinch0 = Math.hypot(a[0]-b[0], a[1]-b[1]); z0 = cam.z; }
});
cv.addEventListener('pointermove', function(e){
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = [e.clientX, e.clientY];
  var ks = Object.keys(ptrs);
  if (ks.length === 2){
    var a = ptrs[ks[0]], b = ptrs[ks[1]];
    cam.z = clampZ(z0*Math.hypot(a[0]-b[0], a[1]-b[1])/Math.max(1, pinch0)); if (down) down.moved = true;
  } else if (down){
    var dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 6){ down.moved = true; follow = false; }
    if (down.moved){ cam.x = down.cx - dx/cam.z; cam.y = down.cy - dy/cam.z; }
  }
});
function up(e){
  if (down && !down.moved && Object.keys(ptrs).length === 1) tap(e.clientX, e.clientY);
  delete ptrs[e.pointerId];
  var ks = Object.keys(ptrs);
  if (!ks.length) down = null;
  else if (ks.length === 1){ var p = ptrs[ks[0]]; down = {x: p[0], y: p[1], cx: cam.x, cy: cam.y, moved: true}; }
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', function(e){ if (down) down.moved = true; up(e); });
cv.addEventListener('wheel', function(e){ e.preventDefault(); cam.z = clampZ(cam.z*Math.exp(-e.deltaY*0.0015)); }, {passive: false});
function clampZ(z){ var m = Math.min(view.w, view.h)/Sim.S.world; return Math.max(m*0.5, Math.min(m*40, z)); }
function tap(sx, sy){
  var w = toWorld(sx, sy), S = Sim.S, best = -1, bd = 1e9, W = S.world;
  for (var i = 0; i < S.hi; i++){
    if (!S.alive[i]) continue;
    var dx = S.x[i] - w[0], dy = S.y[i] - w[1];
    dx -= W*Math.round(dx/W); dy -= W*Math.round(dy/W);
    var d = dx*dx + dy*dy;
    if (d < bd){ bd = d; best = i; }
  }
  if (best >= 0 && Math.sqrt(bd)*cam.z < 30){ selId = S.id[best]; selIdx = best; deathNote = null; remember(best); follow = true; $('card').classList.add('on'); card(); }
  else { selId = -1; selIdx = -1; relSet = null; follow = false; $('card').classList.remove('on'); }
}

// ---- controls
$('bPlay').onclick = function(){ running = !running; this.textContent = running ? 'pause' : 'play'; this.classList.toggle('on', !running); };
$('spd').oninput = function(){ speedIdx = +this.value; };
$('bCol').onclick = function(){ colourMode = (colourMode + 1) % 3; this.textContent = COLOUR_NAMES[colourMode]; legend(); };
$('bMore').onclick = function(){ var o = $('drawer').classList.toggle('open'); this.textContent = o ? 'close' : 'world'; };
var SLIDERS = [
  ['eMeat', 'meat energy', 1, 12, 0.5], ['ePlant', 'plant energy', 0.3, 3, 0.1], ['graze', 'graze rate', 0.03, 0.3, 0.01],
  ['kDef', 'plant defence power', 0, 10, 0.5], ['corpseDecay', 'corpse rot', 0.0001, 0.01, 0.0001],
  ['dmg', 'bite damage', 0.05, 1, 0.05], ['seasonAmp', 'seasons', 0, 0.8, 0.05], ['mutP', 'mutation rate', 0.01, 0.2, 0.01]
];
function buildDrawer(){
  var d = $('drawer'), h = '<h4>what happened</h4><div id="events"></div><h4>physics — live</h4>';
  SLIDERS.forEach(function(s){
    h += '<div class="row"><label>' + s[1] + '</label><input type="range" id="s_' + s[0] + '" min="' + s[2] + '" max="' + s[3] +
         '" step="' + s[4] + '"><span id="v_' + s[0] + '"></span></div>';
  });
  h += '<div class="row"><label>seasons move</label><button id="wS">still</button><button id="wT">travelling</button></div>';
  h += '<div class="row"><label>fruit</label><button id="fOff">off</button><button id="fOn">on</button></div>';
  h += '<div class="row"><label>compass</label><button id="cOff">off</button><button id="cOn">on</button></div>';
  h += '<div class="row"><label>smell</label><button id="mOff">off</button><button id="mOn">on</button></div>';
  h += '<div class="row"><label>nutrient loop</label><button id="nOff">off</button><button id="nOn">on</button></div>';
  h += '<div class="row"><label>learning</label><button id="lOff">off</button><button id="lOn">on</button></div>';
  h += '<div class="row"><label>day and night</label><button id="dOff">off</button><button id="dOn">on</button></div>';
  h += '<div class="row"><label>world size</label><button id="z64">small</button><button id="z96">medium</button><button id="z128">large</button></div>';
  h += '<div class="row"><label>reproduction</label><button id="rC">clonal</button><button id="rS">sexual</button></div>';
  h += '<div class="row"><button id="bNew">new world</button><button id="bSeed">same seed</button><button id="bLog">save log</button></div>';
  if (EVOLVED) h += '<div class="row"><button id="bEvo">evolved start</button></div><p class="note">Evolved start founds a new world from ' + EVOLVED.n +
    ' animals sampled from a world that had evolved for ' + EVOLVED.tick + ' ticks. ' + EVOLVED.note + '</p>';
  h += '<h4>species — measured, not declared</h4><div id="species"></div>';
  h += '<p class="note">Sexual is the default. In about half of test worlds meat-eaters became a separate species that cannot interbreed with the grazers, and in some the grazers split too. Clonal worlds get predators as often, but a species there is only a cluster of look-alikes.</p>';
  h += '<p class="note">Small is the default: it runs about twice as fast, and predators evolved at least as often in test worlds as in the medium one. Predators usually need one to three hundred generations to appear, and only some worlds get them.</p>';
  h += '<p class="note">Seasons: the slider sets how much plant growth rises and falls over a year. Travelling makes the growing season sweep across the world from left to right; with the compass on, most test worlds learned to go with it.</p>';
  h += '<p class="note">Fruit (pink on the map): every plant has a gene for how much of its growth it turns into fruit. Fruit is rich food, and an animal that eats it drops the seeds wherever it is a while later. Nothing tells plants to fruit or animals to carry seed; in test worlds the fruit gene rose where animals carried seed and fell where they could not.</p>';
  h += '<p class="note">Compass: with it on, every animal can tell which way it faces. Within a few hundred generations a world\'s grazers share a bearing and stream across the world together, with the meat-eaters following. Over a million ticks predators die out far more often with it on (in 14 of 24 test worlds against 4), so it is off by default.</p>';
  h += '<p class="note">Smell (on): animals give off a scent set by their colour, corpses one of their own; it drifts and fades, and two nostrils tell which side smells stronger, with the head down or in the dark. In test worlds grazers learned to steer away from where others have been, and neighbours came to travel the same way. Nutrient loop and learning are under test. Nutrient loop (new world): plants draw on the soil, animals carry what they eat and drop it as dung, and the dead return to the soil, so the ground (brown when bare) grows rich where animals feed and die. Learning (new world, about half the speed): brains change as they live, when and how their genes decide; nothing learned is passed on.</p>';
  h += '<p class="note">Day and night: at night eyes see animals and corpses over a third of their range (ears are unaffected), and every animal can sense how light it is. Fewer kills happen at night; in test worlds no daily rhythm evolved.</p>';
  h += '<p class="note">The world wraps round: an animal leaving one edge comes back at the other. The dashed line is the edge, and what lies beyond it is the same world again.</p>';
  h += '<p class="note">A faint tail shows which way an animal is moving and how fast. When the grazers of a world evolve a shared bearing, their tails line up.</p>';
  h += '<p class="note">A blue ring means an animal is calling; the ring grows with loudness. Calls cost energy and nothing says what they mean.</p>';
  h += '<p class="note">Colour: diet shows each animal\'s gut, green for plants to red for meat. kin shows its heritable colour, which is how relatives recognise each other. action shows what it is doing now. Tap an animal to follow it. Nothing here tells an animal what to eat or whom to attack: its brain is in its genome and evolves.</p>';
  d.innerHTML = h;
  SLIDERS.forEach(function(s){
    var el = $('s_' + s[0]);
    el.value = Sim.CFG[s[0]]; $('v_' + s[0]).textContent = (+el.value).toFixed(4).replace(/\.?0+$/, '');
    el.oninput = function(){ Sim.CFG[s[0]] = +this.value; patch[s[0]] = +this.value; $('v_' + s[0]).textContent = (+this.value).toFixed(4).replace(/\.?0+$/, ''); };
  });
  [64, 96, 128].forEach(function(z){
    var el = $('z' + z); el.classList.toggle('on', (patch.gridN || Sim.CFG.gridN) === z);
    el.onclick = function(){ if (!discardOK()) return; patch.gridN = z; fresh(); newWorld(); buildDrawer(); };
  });
  function fresh(){ delete patch.seedGenomes; delete patch.seedNI; delete patch.seedNO; delete patch.founders; }
  // sexual worlds: a breeder recombines with an acceptable mate in sense range, and
  // genomes too far apart cannot breed, so clusters become true species
  var sexual = !!Sim.CFG.sex;
  $('rC').classList.toggle('on', !sexual); $('rS').classList.toggle('on', sexual);
  $('rC').onclick = function(){ if (!sexual || !discardOK()) return; patch.sex = 0; fresh(); newWorld(); buildDrawer(); };
  $('rS').onclick = function(){ if (sexual || !discardOK()) return; patch.sex = 1; fresh(); newWorld(); buildDrawer(); };
  var fo = !!Sim.CFG.fruit;
  $('fOff').classList.toggle('on', !fo); $('fOn').classList.toggle('on', fo);
  $('fOff').onclick = function(){ Sim.CFG.fruit = 0; patch.fruit = 0; buildDrawer(); };
  $('fOn').onclick = function(){ Sim.CFG.fruit = 1; patch.fruit = 1; buildDrawer(); };
  var cp = !!Sim.CFG.compass;
  $('cOff').classList.toggle('on', !cp); $('cOn').classList.toggle('on', cp);
  $('cOff').onclick = function(){ Sim.CFG.compass = 0; patch.compass = 0; buildDrawer(); };
  $('cOn').onclick = function(){ Sim.CFG.compass = 1; patch.compass = 1; buildDrawer(); };
  var sm = !!Sim.CFG.smell;
  $('mOff').classList.toggle('on', !sm); $('mOn').classList.toggle('on', sm);
  $('mOff').onclick = function(){ Sim.CFG.smell = 0; patch.smell = 0; buildDrawer(); };
  $('mOn').onclick = function(){ Sim.CFG.smell = 1; patch.smell = 1; buildDrawer(); };
  // these two set up the world differently, so they start a new one
  [['nutrients', 'n'], ['learn', 'l']].forEach(function(t){
    var on = !!Sim.CFG[t[0]];
    $(t[1] + 'Off').classList.toggle('on', !on); $(t[1] + 'On').classList.toggle('on', on);
    $(t[1] + 'Off').onclick = function(){ if (!on || !discardOK()) return; patch[t[0]] = 0; fresh(); newWorld(); buildDrawer(); };
    $(t[1] + 'On').onclick = function(){ if (on || !discardOK()) return; patch[t[0]] = 1; fresh(); newWorld(); buildDrawer(); };
  });
  var dn = Sim.CFG.dayTicks > 0;
  $('dOff').classList.toggle('on', !dn); $('dOn').classList.toggle('on', dn);
  $('dOff').onclick = function(){ Sim.CFG.dayTicks = 0; patch.dayTicks = 0; buildDrawer(); };
  $('dOn').onclick = function(){ Sim.CFG.dayTicks = 1000; patch.dayTicks = 1000; buildDrawer(); };
  var wave = !!Sim.CFG.seasonWave;
  $('wS').classList.toggle('on', !wave); $('wT').classList.toggle('on', wave);
  $('wS').onclick = function(){ Sim.CFG.seasonWave = 0; patch.seasonWave = 0; buildDrawer(); };
  $('wT').onclick = function(){ Sim.CFG.seasonWave = 1; patch.seasonWave = 1; if (!Sim.CFG.seasonAmp){ Sim.CFG.seasonAmp = 0.8; patch.seasonAmp = 0.8; } buildDrawer(); };
  $('bNew').onclick = function(){ if (!discardOK()) return; fresh(); newWorld(); buildDrawer(); };
  if (EVOLVED) $('bEvo').onclick = function(){ if (!discardOK()) return; patch.seedGenomes = evolvedGenomes(); patch.seedNI = EVOLVED.ni || 22; patch.seedNO = EVOLVED.no || 5; patch.founders = 600; newWorld(); buildDrawer(); };
  $('bSeed').onclick = function(){ if (!discardOK()) return; newWorld(Sim.CFG.seed); buildDrawer(); };
  $('bLog').onclick = function(){
    var cfg = {}; for (var k in Sim.CFG) if (k !== 'seedGenomes') cfg[k] = Sim.CFG[k];
    cfg.seededFrom = Sim.CFG.seedGenomes ? 'evolved start' : null;
    var blob = new Blob([JSON.stringify({kind: 'evosim1-log', version: Sim.VERSION, cfg: cfg, logStartsAt: Sim.S.log.length ? Sim.S.log[0].t : 0, log: Sim.S.log})], {type: 'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'evosim-s' + Sim.CFG.seed + '-t' + Sim.S.tick + '.json'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  };
}

var lastHud = 0;
function frame(ts){
  if (running){
    var budget = performance.now() + 30, n = SPEEDS[speedIdx];
    for (var k = 0; k < n && performance.now() < budget; k++){
      Sim.step();
      if (selIdx >= 0) watchSel();
      if (Sim.S.n === 0 && (Sim.S.established || Sim.S.tick > Sim.CFG.reseedUntil)){ running = false; $('bPlay').textContent = 'play'; $('bPlay').classList.add('on'); break; }
    }
    if (Sim.S.log.length > 6000) Sim.S.log.splice(0, 1000);   // ~3M ticks of rows; the graph shows the last 400
  }
  if (selId >= 0 && (selIdx < 0 || Sim.S.id[selIdx] !== selId)) selIdx = findSel();
  if (follow && selIdx >= 0){ cam.x = Sim.S.x[selIdx]; cam.y = Sim.S.y[selIdx]; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0b1014'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  drawPlants(); drawAnimals();
  if (Sim.CFG.dayTicks > 0 && Sim.S.light < 1){ ctx.fillStyle = 'rgba(4,8,28,' + (0.55*(1 - Sim.S.light)).toFixed(3) + ')'; ctx.fillRect(view.x, view.y, view.w, view.h); }   // night
  if (ts - lastHud > 250){ hud(); drawGraph(); card(); lastHud = ts; }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
// ---- keep the world across visits: autosave to localStorage, resume on load
var SAVE_KEY = 'evosim-world', resumedFrom = 0, lastSaved = -1, saveFailed = false;
function saveWorld(){
  if (!Sim.S || !Sim.S.established || Sim.S.n === 0 || Sim.S.tick === lastSaved) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(Sim.snapshot())); lastSaved = Sim.S.tick; saveFailed = false; }
  catch (e) { saveFailed = true; try { localStorage.removeItem(SAVE_KEY); } catch (e2) {} }   // full or blocked
}
function resumeWorld(){
  try {
    var w = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (w && Sim.restore(w)){
      ['gridN', 'seed', 'sex', 'mateDist', 'seasonWave', 'dayTicks', 'compass', 'fruit', 'smell', 'nutrients', 'learn'].concat(SLIDERS.map(function(s){ return s[0]; })).forEach(function(k){ patch[k] = Sim.CFG[k]; });
      resumedFrom = Sim.S.tick; afterLoad(); return true;
    }
  } catch (e) {}
  return false;
}
setInterval(saveWorld, 60000);
window.evosim = { save: saveWorld, get resumedFrom(){ return resumedFrom; } };   // for tests and the console
document.addEventListener('visibilitychange', function(){ if (document.hidden) saveWorld(); });
if (!resumeWorld()) newWorld((Math.random()*1e9)|0);
buildDrawer(); resize(); legend();
requestAnimationFrame(frame);
})();
</script>
